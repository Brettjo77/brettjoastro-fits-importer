        for(const bg of cd.badges||[]) { const bb=el("div"); bb.append(el("span","badge",bg)); bb.style.marginTop="4px"; b.append(bb); }
        if(cd.evidence) b.append(el("div","p-ev",cd.evidence));
        if(cd.action) b.append(el("div","p-act",cd.action));
        b.addEventListener("click",()=>{ if(byName[cd.target]) openTarget(cd.target); });
        col.append(b);
      }
      board.append(col);
    }
  }
  paint();
  const src=el("div","sub");
  src.style.marginTop="12px";
  src.textContent="Capturing: a session within the quiet period ("+(D.quietPeriodDays||14)+" observing nights) or kept open by hand. Ready to process: the quiet period has passed and nothing is started. In progress: one of your own masters is saved in the target's folder on the archive. Done: a finished picture names the target and the scope.";
  root.append(src);
};

/* ================= NIGHTS ================= */
RENDER.nights = function(root){
  const camSel=new Set(); let metric="hours";
  const tb=el("div","toolbar");
  for(const cm of CAMS){
    const ch=el("button","chip"); ch.append(camDot(cm.id), cm.short); ch.setAttribute("aria-pressed","false");
    ch.addEventListener("click",()=>{ camSel.has(cm.id)?camSel.delete(cm.id):camSel.add(cm.id); ch.classList.toggle("sel"); ch.setAttribute("aria-pressed",ch.classList.contains("sel")); paint(); });
    tb.append(ch);
  }
  const mt=el("button","tbtn","colour by frames"); mt.setAttribute("aria-pressed","false");
  mt.addEventListener("click",()=>{ metric = metric==="hours"?"frames":"hours"; mt.textContent = metric==="hours"?"colour by frames":"colour by hours"; mt.setAttribute("aria-pressed", metric==="frames"); paint(); });
  tb.append(mt);
  root.append(tb);
  const holder=el("div"); root.append(holder);

  function valOf(nightRec){
    let h=0,f=0;
    for(const [cam,x] of Object.entries(nightRec.perCam)){
      if(camSel.size && !camSel.has(cam)) continue;
      h+=x.hours; f+=x.frames;
    }
    return {h,f,v:metric==="hours"?h:f};
  }
  const HB=[0.5,1.5,3,5], FB=[100,300,700,1200];
  function binVar(v){
    if(v<=0) return "--heat0";
    const bins=metric==="hours"?HB:FB;
    for(let i=0;i<bins.length;i++) if(v<=bins[i]) return "--heat"+(i+1);
    return "--heat5";
  }
  const yearNow=new Date().getFullYear();
  const plausible=n=>{ const y=+String(n).slice(0,4); return y>=2015 && y<=yearNow+1; };
  function paint(){
    holder.replaceChildren();
    const years=[...new Set([...nightly.keys()].filter(plausible).map(n=>+n.slice(0,4)))].sort(); if(!years.length) years.push(yearNow);
    const cell=12, gap=2.5, step=cell+gap;
    let totalNights=0, totalH=0, best=null, streak=0, bestStreak=0, prev=null, gapBest=0, gapPrev=null;
    const monthAgg={};
    const active=[];
    const oddSess=SESS.filter(s=>!plausible(s.night) && (!camSel.size||camSel.has(s.camera))).length;
    for(const [night,recN] of [...nightly.entries()].sort()){
      if(!plausible(night)) continue;
      const {h,f,v}=valOf(recN);
      if(v>0){ active.push(night); totalNights++; totalH+=h;
        if(!best||h>best.h) best={night,h,f};
        const mkey=night.slice(0,7); monthAgg[mkey]=(monthAgg[mkey]||0)+h;
      }
    }
    for(const n of active){
      if(prev){
        const d=(Date.parse(n)-Date.parse(prev))/86400000;
        if(d===1) streak++; else streak=1;
        if(d-1>gapBest) gapBest=d-1;
      } else streak=1;
      bestStreak=Math.max(bestStreak,streak); prev=n;
    }
    const bestMonth=Object.entries(monthAgg).sort((a,b)=>b[1]-a[1])[0];
    const card=el("div","card");
    card.append(el("h2","sec","Imaging nights"));
    card.append(el("div","sub","one cell per calendar night, coloured by "+(metric==="hours"?"hours captured":"frames captured")+(camSel.size?" on the selected scopes":" across all scopes")));
    for(const yr of years){
      const ywrap=el("div","hm-year");
      const lab=el("div","eyebrow",String(yr)); lab.style.marginBottom="6px"; ywrap.append(lab);
      const scroll=el("div","hm-scroll");
      const jan1=new Date(Date.UTC(yr,0,1));
      const startDow=(jan1.getUTCDay()+6)%7; /* Monday=0 */
      const start=new Date(jan1); start.setUTCDate(start.getUTCDate()-startDow);
      const end=new Date(Date.UTC(yr,11,31));
      const weeks=Math.ceil(((end-start)/86400000+1)/7);
      const W=weeks*step+34, H=7*step+22;
      const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:W,height:H,role:"img","aria-label":"Imaging nights "+yr});
      ["Mon","Wed","Fri","Sun"].forEach((d2,i)=>{
        const tx=svgEl("text",{x:0,y:16+step*[0,2,4,6][i]+9,class:"axis mono","font-size":"9.5"}); tx.textContent=d2; svg.append(tx);
      });
      let lastMon=-1;
      for(let w=0;w<weeks;w++){
        for(let dow=0;dow<7;dow++){
          const d=new Date(start); d.setUTCDate(d.getUTCDate()+w*7+dow);
          if(d.getUTCFullYear()!==yr) continue;
          const iso=d.toISOString().slice(0,10);
          if(d.getUTCDate()<=7 && dow===0 && d.getUTCMonth()!==lastMon){
            lastMon=d.getUTCMonth();
            const tx=svgEl("text",{x:34+w*step,y:9,class:"axis mono","font-size":"9.5"}); tx.textContent=MONTHS[lastMon]; svg.append(tx);
          }
          const recN=nightly.get(iso);
          const res=recN?valOf(recN):{h:0,f:0,v:0};
          const r=svgEl("rect",{x:34+w*step,y:14+dow*step,width:cell,height:cell,rx:2.5,fill:"var("+binVar(res.v)+")"});
          if(res.v<=0) r.setAttribute("stroke","var(--grid)");
          if(recN&&res.v>0){
            r.setAttribute("tabindex","0"); r.style.cursor="pointer"; r.setAttribute("role","img");
            r.setAttribute("aria-label",fmtDY(iso)+" · "+res.h.toFixed(2)+" h · "+fmtI(res.f)+" frames");
            hoverable(r,box=>{
              box.append(el("div","tt-t",fmtDY(iso)));
              ttRow(box,"hours",res.h.toFixed(2)); ttRow(box,"frames",fmtI(res.f));
              const tgs=[...recN.targets]; ttRow(box,"targets",tgs.slice(0,3).join(", ")+(tgs.length>3?" +"+(tgs.length-3):""));
              for(const cm of CAMS){ const x=recN.perCam[cm.id]; if(x&&(!camSel.size||camSel.has(cm.id))&&x.hours>0) ttRow(box,cm.short,x.hours.toFixed(2)+" h",cm.id); }
            });
          }
          svg.append(r);
        }
      }
      scroll.append(svg); ywrap.append(scroll); card.append(ywrap);
    }
    const lg=el("div","hm-legend"); lg.style.marginTop="10px";
    lg.append(el("span",null,"quiet"));
    ["--heat0","--heat1","--heat2","--heat3","--heat4","--heat5"].forEach(v=>{ const c2=el("span","cell"); c2.style.background="var("+v+")"; lg.append(c2); });
    lg.append(el("span",null,"big night"));
    card.append(lg);
    const stx=el("div","hm-stats");
    function s6(lbl,val){ const s7=el("span"); s7.append(lbl+" "); s7.append(el("b",null,val)); stx.append(s7); }
    s6("nights with light frames",fmtI(totalNights)); s6("hours",totalH.toFixed(1));
    if(best) s6("biggest night",fmtDY(best.night)+" ("+best.h.toFixed(1)+" h)");
    s6("longest run",bestStreak+" nights in a row");
    s6("longest dry spell",Math.round(gapBest)+" nights");
    if(bestMonth) s6("busiest month",fmtMonth(bestMonth[0])+" ("+bestMonth[1].toFixed(0)+" h)");
    if(oddSess){ const s8=el("span"); s8.append(el("b",null,String(oddSess)), " session"+(oddSess===1?"":"s")+" with an implausible night left out"); stx.append(s8); }
    card.append(stx);
    holder.append(card);
  }
  paint();
};
function fmtMonth(ym){ const [y,m]=ym.split("-"); return MONTHS[+m-1]+" "+y; }
</script>
<script>
"use strict";
/* ================= SKY ================= */
RENDER.sky = function(root){
  const card=el("div","card");
  card.append(el("h2","sec","Sky coverage"));
  card.append(el("div","sub","every target at its catalogue position · dot area is total integration · colour is how far the data has come · click a dot to open the target"));
  const wrapS=el("div","skywrap"); card.append(wrapS);

  const W=1000,H=600,padL=46,padR=16,padT=26,padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const DEC0=90, DEC1=-35;
  const X=ra=>padL+((24-ra)%24)/24*plotW;
  const Y=dec=>padT+(DEC0-dec)/(DEC0-DEC1)*plotH;
  const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",style:"min-width:760px",role:"img","aria-label":"Sky map of imaged targets"});
  svg.append(svgEl("rect",{x:padL,y:padT,width:plotW,height:plotH,fill:"var(--card2)",rx:8}));
  for(let ra=0;ra<=24;ra+=2){
    const x=X(ra===0?0.0001:ra);
    svg.append(svgEl("line",{x1:x,x2:x,y1:padT,y2:padT+plotH,class:"gridline"}));
    if(ra>0&&ra<24){ const t=svgEl("text",{x:x,y:padT+plotH+18,"text-anchor":"middle",class:"axis mono"}); t.textContent=ra+"h"; svg.append(t); }
  }
  for(let dec=75;dec>=-30;dec-=15){
    const y=Y(dec);
    svg.append(svgEl("line",{x1:padL,x2:padL+plotW,y1:y,y2:y,class:"gridline"}));
    const t=svgEl("text",{x:padL-7,y:y+3.5,"text-anchor":"end",class:"axis mono"}); t.textContent=(dec>0?"+":"")+dec+"°"; svg.append(t);
  }
  const pts=TG.filter(t=>t.ra!=null && t.dec!=null).map(t=>({t,ra:t.ra,dec:t.dec,h:t.hours,state:t.state,name:t.name}));
  pts.sort((a,b)=>b.h-a.h);
  const R=h=>Math.min(24, 3.2+Math.sqrt(Math.max(h,0.05))*2.15);
  const labelSet=new Set(pts.slice(0,9).map(p=>p.name));
  const labelJobs=[];
  for(const p of pts){
    const r=R(p.h), cx=X(p.ra), cy=Y(p.dec);
    const isDone=p.state==="complete";
    const isTodo=p.state==="todo";
    const fillVar = p.state==="quarantined" ? "--st-quarantined"
      : p.state==="processing" ? "--st-processing"
      : p.state==="stacked" ? "--st-stacked"
      : p.state==="captured" ? "--st-captured" : "--muted";
    const c=svgEl("circle",{cx:cx,cy:cy,r:r,fill:isTodo?"transparent":"var("+fillVar+")",
      stroke:isTodo?"var(--st-todo)":"var(--card)","stroke-width":isTodo?"1.6":"2",
      opacity:isDone?"0.5":"0.92",tabindex:"0",role:"img","aria-label":p.name+" · "+fmtH(p.h)+" · "+stageOf(p.state).label});
    c.style.cursor=p.t?"pointer":"default";
    hoverable(c,box=>{
      box.append(el("div","tt-t",p.name));
      if(p.t){ ttRow(box,"integration",fmtH(p.t.hours)); ttRow(box,"nights",String(p.t.nights));
        ttRow(box,"scopes",p.t.cameras.map(x=>CAMSHORT[x]||x).join(", "));
        ttRow(box,"state",stageOf(p.state).label);
        if(p.t.type) ttRow(box,"type",p.t.type+(p.t.constellation?" · "+p.t.constellation:""));
      } else { ttRow(box,"state","quarantined, awaiting identification"); ttRow(box,"integration","about 4 h"); }
    });
    if(p.t) c.addEventListener("click",()=>openTarget(p.name));
    svg.append(c);
    if(labelSet.has(p.name)) labelJobs.push({p,cx,cy,r});
  }
  /* collision-aware labels, drawn after every dot */
  const placedL=pts.filter(q=>R(q.h)>=9).map(q=>({x:X(q.ra)-R(q.h),y:Y(q.dec)-R(q.h),w:2*R(q.h),h:2*R(q.h),dot:true}));
  for(const job of labelJobs){
    const full=job.p.name.replace(" (unidentified)","");
    const name=full.length>28?full.slice(0,27)+"…":full;
    const w=name.length*6.6, h=13;
    const cands=[[job.cx-w/2,job.cy-job.r-17],[job.cx-w/2,job.cy+job.r+5],[job.cx+job.r+7,job.cy-h/2],[job.cx-job.r-7-w,job.cy-h/2]];
    for(const [lx,ly] of cands){
      if(lx<padL+3||lx+w>padL+plotW-3||ly<padT+3||ly+h>padT+plotH-3) continue;
      if(placedL.some(q=>!(lx+w<q.x||q.x+q.w<lx||ly+h<q.y||q.y+q.h<ly))) continue;
      placedL.push({x:lx,y:ly,w:w,h:h});
      const lab=svgEl("text",{x:lx,y:ly+10,class:"dlabel"});
      lab.textContent=name;
      if(name!==full){ const ti=svgEl("title"); ti.textContent=full; lab.append(ti); }
      svg.append(lab);
      break;
    }
  }
  wrapS.append(svg);
  const lg=el("div","legend"); lg.style.marginTop="12px";
  [["captured"],["stacked"],["processing"]].map(([id])=>[STAGE[id].label.toLowerCase(),STAGE[id].v]).forEach(([l,v])=>{
    const li=el("span","li"); const sw=el("span","sw"); sw.style.borderRadius="50%"; sw.style.background="var("+v+")"; li.append(sw,l); lg.append(li);
  });
  const liD=el("span","li"); const swD=el("span","sw"); swD.style.borderRadius="50%"; swD.style.background="var(--muted)"; swD.style.opacity="0.5"; liD.append(swD,"done (recedes)"); lg.append(liD);
  const sz=el("span","li"); sz.append(el("span","sub","dot area: 1 h · 10 h · 50 h")); lg.append(sz);
  card.append(lg);
  const note=el("p","skynote");
  note.textContent="Right ascension runs atlas-style, increasing to the left. Positions are the contract's catalogue coordinates (contract/targets.json), good for coverage rather than pointing. A target with no coordinates there, or a moving one like a comet, is listed but sits off the map.";
  card.append(note);
  root.append(card);

  /* table twin for the sky */
  root.append(chartCard("Coverage list","the same map as a list, north to south",
    c=>{ const t2=el("div","sub"); t2.textContent="Use the table view button."; c.append(t2); },
    w=>simpleTable(w,["Target","RA","Dec","Constellation","Hours","State"],
      pts.filter(p=>p.t).sort((a,b)=>b.dec-a.dec).map(p=>[p.name, p.ra.toFixed(2)+"h",(p.dec>0?"+":"")+p.dec.toFixed(1)+"°",p.t.constellation||"·",p.t.hours.toFixed(1),stageOf(p.state).label]))
  ));
};

/* ================= EQUIPMENT ================= */
RENDER.equipment = function(root){
  const sc=el("div","scopes");
  for(const cm of CAMS){
    const s=D.scopes.find(z=>z.camera===cm.id); if(!s) continue;
    const cardS=el("div","scard");
    const h=el("h3");
    const title = cm.id==="ASIAir" ? "ASI585MC Air · Askar rigs"
      : (cm.id==="Askar 107PHQ"||cm.id==="Askar FRA400") ? cm.id+" · ASI585MC Air" : cm.id;
    h.append(camDot(cm.id), title); cardS.append(h);
    const nums=el("div","s-nums");
    [["hours",fmtH(s.hours).replace(" h","")],["frames",fmtI(s.frames)],["nights",String(s.nights)]].forEach(([l,v])=>{
      const n=el("div","n"); n.append(el("b",null,v), el("span",null,l)); nums.append(n);
    });
    cardS.append(nums);
    cardS.append(el("div","s-line","On the sky "+fmtDY(s.first)+" to "+fmtDY(s.last)+" · "+fmtGB(s.bytes)+" of lights"));
    const tlb=el("button","tbtn","timeline of its projects ›"); tlb.style.marginTop="8px";
    tlb.addEventListener("click",()=>openScope(cm.id)); cardS.append(tlb);
    /* filter mix */
    const mix={};
    for(const t of TG) for(const p of t.programmes) if(p.camera===cm.id)
      for(const [f,n2] of Object.entries(p.filters)) mix[f]=(mix[f]||0)+n2;
    const tot=Object.values(mix).reduce((a,b)=>a+b,0);
    if(tot){
      const mb=el("div","minibar");
      const FCOL={"IRCUT":"--heat4","LP":"--heat2","wide-cam":"--muted","unrecorded":"--grid"};
      const parts=Object.entries(mix).sort((a,b)=>b[1]-a[1]);
      for(const [f,n2] of parts){ const i=el("i"); i.style.width=(n2/tot*100)+"%"; i.style.background="var("+(FCOL[f]||"--muted")+")"; mb.append(i); }
      cardS.append(mb);
      cardS.append(el("div","s-line",parts.map(([f,n2])=>filtLabel(f)+" "+Math.round(n2/tot*100)+"%").join(" · ")));
    }
    sc.append(cardS);
  }
  root.append(sc);

  /* Askar rig breakdown (shown while the rigs still share one series) */
  const rigs=D.askarRigs||{};
  const rigKeys=Object.keys(rigs);
  if(rigKeys.length && CAMS.some(c=>c.id==="ASIAir")){
    root.append(spacer(14));
    const rc=el("div","card");
    rc.append(el("h2","sec","The Askar rigs, by scope"));
    const att=D.rigAttribution||{};
    rc.append(el("div","sub","one ASI585MC Air moves between the two Askars; attribution comes from the ledger snapshot plus safe per-session inheritance (no session has ever mixed rigs)"));
    const order=["Askar 107PHQ","Askar FRA400","Askar (unattributed)"];
    const totalH=order.reduce((a,k)=>a+(rigs[k]?rigs[k].hours:0),0)||1;
    const box=el("div"); box.style.marginTop="12px"; box.style.display="flex"; box.style.flexDirection="column"; box.style.gap="10px";
    for(const k of order){
      const r=rigs[k]; if(!r) continue;
      const row=el("div"); row.style.display="flex"; row.style.alignItems="center"; row.style.gap="10px"; row.style.flexWrap="wrap";
      const d=el("span","dot"); paintSwatch(d,k); row.append(d);
      const lab=el("span",null,k==="Askar (unattributed)"?"Rig unrecorded (Dec 2025 to May 2026)":k);
      lab.style.width="270px"; lab.style.fontWeight="600"; lab.style.fontSize="13px"; row.append(lab);
      const bar=el("span"); bar.style.flex="1 1 160px"; bar.style.height="8px"; bar.style.borderRadius="4px"; bar.style.background="var(--grid)"; bar.style.overflow="hidden"; bar.style.display="block";
      const fill=el("i"); fill.style.display="block"; fill.style.height="100%"; fill.style.width=Math.max(2,r.hours/totalH*100)+"%"; paintSwatch(fill,k); bar.append(fill); row.append(bar);
      const nums=el("span","sub",fmtH(r.hours)+" · "+fmtI(r.frames)+" frames · "+r.nights+" nights · "+r.targets+" targets");
      nums.style.fontVariantNumeric="tabular-nums"; row.append(nums);
      box.append(row);
    }
    rc.append(box);
    const note=el("p","sub");
    note.style.marginTop="12px"; note.style.maxWidth="95ch";
    note.textContent="To attribute the remainder: run probe_askar_rigs.ps1 at the root of the drive (it reads one FITS header per night folder and writes _verify\\askar_rig_map.csv in seconds), then refresh this page. With the map in place the two rigs become first-class scopes in every chart. The MacBook backfill receipts do the same job when they reach AstroLog.";
    rc.append(note);
    root.append(rc);
  }
  root.append(spacer(14));

  /* monthly stacked columns */
  const byMonth=new Map();
  for(const s of SESS){
    const m=s.night.slice(0,7);
    let rec2=byMonth.get(m); if(!rec2){ rec2={}; byMonth.set(m,rec2); }
    rec2[s.camera]=(rec2[s.camera]||0)+s.hours;
  }
  const monthsAll=[...byMonth.keys()].sort();
  root.append(chartCard("The rhythm of the hobby","integration hours per calendar month, stacked by scope",
    c=>{
      if(!monthsAll.length){ c.append(el("p","sub","Not enough months yet.")); return; }
      const W=1000,padL2=44,padR2=12,padT2=14,padB2=40;
      const plotW2=W-padL2-padR2, Hpl=210, Hv=Hpl+padT2+padB2;
      const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+Hv,width:"100%",role:"img","aria-label":"Hours per month by scope"});
      const colW=Math.min(24, plotW2/monthsAll.length-8);
      const maxM=Math.max(0.01,...monthsAll.map(m=>Object.values(byMonth.get(m)).reduce((a,b)=>a+b,0)));
      for(const gv of niceTicks(maxM,4)){
        const y=padT2+Hpl-gv/maxM*Hpl;
        svg.append(svgEl("line",{x1:padL2,x2:W-padR2,y1:y,y2:y,class:"gridline"}));
        const t3=svgEl("text",{x:padL2-6,y:y+3.5,"text-anchor":"end",class:"axis mono"}); t3.textContent=gv; svg.append(t3);
      }
      svg.append(svgEl("line",{x1:padL2,x2:W-padR2,y1:padT2+Hpl,y2:padT2+Hpl,class:"baseline"}));
      monthsAll.forEach((m,i)=>{
        const x=padL2+(i+0.5)*(plotW2/monthsAll.length)-colW/2;
        let y=padT2+Hpl;
        const rec2=byMonth.get(m);
        for(const cm of CAMS){
          const h=rec2[cm.id]||0; if(h<=0.02) continue;
          const hh=Math.max(1.5,h/maxM*Hpl-2);
          y-=hh;
          const r=svgEl("rect",{x:x,y:y,width:colW,height:hh,rx:2.5,tabindex:"0",role:"img","aria-label":fmtMonth(m)+" · "+cm.short+" · "+h.toFixed(1)+" h"});
          svgCamFill(r,cm.id);
          hoverable(r,box=>{
            box.append(el("div","tt-t",fmtMonth(m)));
            for(const cm2 of CAMS){ const h2=rec2[cm2.id]; if(h2>0.02) ttRow(box,cm2.short,h2.toFixed(1)+" h",cm2.id); }
            ttRow(box,"total",Object.values(rec2).reduce((a,b)=>a+b,0).toFixed(1)+" h");
          });
          svg.append(r);
          y-=2;
        }
        if(m.endsWith("-01")||i===0){
          const t4=svgEl("text",{x:x+colW/2,y:padT2+Hpl+18,"text-anchor":"middle",class:"axis mono"}); t4.textContent=m.slice(0,4); svg.append(t4);
        } else if(["-04","-07","-10"].some(s2=>m.endsWith(s2))){
          const t4=svgEl("text",{x:x+colW/2,y:padT2+Hpl+18,"text-anchor":"middle",class:"axis"}); t4.textContent=MONTHS[+m.slice(5,7)-1]; svg.append(t4);
        }
      });
      c.append(svg);
      c.append(legendRow(CAMS.map(cm=>({label:cm.id,cam:cm.id,kind:"sw"}))));
    },
    w=>simpleTable(w,["Month",...CAMS.map(c2=>c2.short),"Total"],
      monthsAll.map(m=>{ const rec2=byMonth.get(m); const vals=CAMS.map(c2=>(rec2[c2.id]||0)); return [fmtMonth(m),...vals.map(v=>v?v.toFixed(1):"·"),vals.reduce((a,b)=>a+b,0).toFixed(1)];}))
  ));

  /* exposure histogram */
  const expAgg={};
  for(const s of SESS) for(const [e,n2] of Object.entries(s.exps)){ const k=+e; if(k>0) expAgg[k]=(expAgg[k]||0)+n2; }
  const expKeys=Object.keys(expAgg).map(Number).sort((a,b)=>a-b);
  root.append(chartCard("Exposure lengths","light frames per exposure time, all scopes",
    c=>{
      if(!expKeys.length){ c.append(el("p","sub","No exposure lengths recorded.")); return; }
      const W=1000,padL2=52,padT2=14,padB2=34,Hpl=170,Hv=Hpl+padT2+padB2;
      const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+Hv,width:"100%",role:"img","aria-label":"Frames per exposure length"});
      const maxV=Math.max(...expKeys.map(k=>expAgg[k]));
      const slot=(W-padL2-14)/expKeys.length, colW=Math.min(24,slot-10);
      for(const gv of niceTicks(maxV,3)){
        const y=padT2+Hpl-gv/maxV*Hpl;
        svg.append(svgEl("line",{x1:padL2,x2:W-14,y1:y,y2:y,class:"gridline"}));
        const t3=svgEl("text",{x:padL2-6,y:y+3.5,"text-anchor":"end",class:"axis mono"}); t3.textContent=gv>=1000?(gv/1000)+"k":gv; svg.append(t3);
      }
      svg.append(svgEl("line",{x1:padL2,x2:W-14,y1:padT2+Hpl,y2:padT2+Hpl,class:"baseline"}));
      expKeys.forEach((k,i)=>{
        const v=expAgg[k], x=padL2+(i+0.5)*slot-colW/2;
        const hh=Math.max(1.5,v/maxV*Hpl);
        const r=svgEl("rect",{x:x,y:padT2+Hpl-hh,width:colW,height:hh,rx:3,fill:"var(--heat3)",tabindex:"0",role:"img","aria-label":k+" s subs · "+fmtI(v)+" frames"});
        hoverable(r,box=>{ box.append(el("div","tt-t",k+" second subs")); ttRow(box,"frames",fmtI(v)); ttRow(box,"integration",(v*k/3600).toFixed(1)+" h"); });
        svg.append(r);
        const t5=svgEl("text",{x:x+colW/2,y:padT2+Hpl+18,"text-anchor":"middle",class:"axis mono"}); t5.textContent=k+"s"; svg.append(t5);
        if(v===maxV){ const t6=svgEl("text",{x:x+colW/2,y:padT2+Hpl-hh-6,"text-anchor":"middle",class:"dlabel strong"}); t6.textContent=fmtI(v); svg.append(t6); }
      });
      c.append(svg);
    },
    w=>simpleTable(w,["Exposure","Frames","Hours"],expKeys.map(k=>[k+" s",fmtI(expAgg[k]),(expAgg[k]*k/3600).toFixed(1)]))
  ));

  /* calibration */
  const cl=Object.entries(D.calibration||{});
  if(cl.length){
    const cal=el("div","card");
    cal.append(el("h2","sec","Calibration library"));
    cal.append(el("div","sub",cl.map(([k,v])=>k+" "+fmtI(v.files)+" files ("+fmtGB(v.bytes)+")").join(" · ")));
    root.append(spacer(14)); root.append(cal);
  }
};

/* ================= HEALTH ================= */

/* ================= FOOTPRINTS ================= */
/* Field of view per scope in degrees (width x height), from vendor sensor and
   focal-length specs with 2.9 um pixels. Seestar mosaic mode is drawn at twice
   the single frame. Rotation is not yet read from FITS headers, so every
   footprint sits sky-up on the catalogue position. */
const FOV = {"Seestar S30":[2.13,1.20],"Seestar S30 Pro":[3.99,2.24],"Seestar S50":[1.29,0.73],
             "Seestar S50 Pro":[2.45,1.38],"Askar FRA400":[1.59,0.89],"Askar 107PHQ":[0.85,0.48]};
const FPORDER = ["Seestar S30 Pro","Seestar S50 Pro","Seestar S50","Seestar S30","Askar FRA400","Askar 107PHQ"];
function fpProgrammes(t){
  /* one entry per scope per target; the ASIAir programme splits into its rigs by frame share */
  const out=[];
  for(const p of t.programmes){
    if(!p.lights && !p.hours) continue;
    if(p.camera==="ASIAir"){
      const tot=Object.values(p.askar||{}).reduce((a,b)=>a+b,0)||1;
      for(const rig in (p.askar||{})){ if(!FOV[rig]) continue;
        const share=p.askar[rig]/tot;
        out.push({scope:rig,mosaic:p.mosaic,hours:p.hours*share,nights:p.nights,lights:Math.round(p.lights*share),last:p.lastNight});
      }
      if(!Object.keys(p.askar||{}).length) out.push({scope:"Askar FRA400",mosaic:p.mosaic,hours:p.hours,nights:p.nights,lights:p.lights,last:p.lastNight,unattributed:true});
    } else if(FOV[p.camera]) out.push({scope:p.camera,mosaic:!!p.mosaic,hours:p.hours,nights:p.nights,lights:p.lights,last:p.lastNight});
  }
  /* merge same scope+mosaic (e.g. ASIAir mosaic panels reported as separate programmes) */
  const m=new Map();
  for(const o of out){ const k=o.scope+"|"+o.mosaic; const e=m.get(k);
    if(e){ e.hours+=o.hours; e.nights+=o.nights; e.lights+=o.lights; if(o.last>e.last) e.last=o.last; } else m.set(k,{...o}); }
  return [...m.values()].sort((a,b)=>b.hours-a.hours);
}
RENDER.footprints = function(root){
  const placed=TG.filter(t=>t.ra!=null && t.dec!=null && fpProgrammes(t).length).sort((a,b)=>b.hours-a.hours);
  if(!placed.length){ root.append(el("p","sub","No footprints to draw yet: none of the imaged targets has a sky position in contract/targets.json (add ra and dec to an entry to place it).")); return; }
  let cur = placed.find(t=>t.name===mem.fpTarget) || placed[0];
  let tonight = null;

  const grid=el("div","fp-grid"); root.append(grid);
  const left=el("div","card"), right=el("div","card"); grid.append(left,right);

  /* ---- left: every footprint on the sky ---- */
  left.append(el("h2","sec","Every field of view you have put on the sky"));
  left.append(el("div","sub","one rectangle per scope per target, drawn to scale · nights deepen the fill · dashed means mosaic · click a footprint"));
  const W=1000,H=520,padL=46,padR=16,padT=22,padB=34, plotW=W-padL-padR, plotH=H-padT-padB;
  const DEC0=90, DEC1=-35;
  const X=ra=>padL+((24-ra)%24)/24*plotW, Y=dec=>padT+(DEC0-dec)/(DEC0-DEC1)*plotH;
  const degX=plotW/360, degY=plotH/(DEC0-DEC1), EXAG=2.2;
  const skyWrap=el("div","skywrap"); left.append(skyWrap);
  const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",style:"min-width:720px",role:"img","aria-label":"Sky map of every field of view imaged"});
  skyWrap.append(svg);
  function drawSky(){
    svg.replaceChildren();
    svg.append(svgEl("rect",{x:padL,y:padT,width:plotW,height:plotH,fill:"var(--card2)",rx:8}));
    for(let ra=0;ra<=24;ra+=2){ const x=X(ra===0?0.0001:ra);
      svg.append(svgEl("line",{x1:x,x2:x,y1:padT,y2:padT+plotH,class:"gridline"}));
      if(ra>0&&ra<24){ const t=svgEl("text",{x:x,y:padT+plotH+18,"text-anchor":"middle",class:"axis mono"}); t.textContent=ra+"h"; svg.append(t); } }
    for(let dec=75;dec>=-30;dec-=15){ const y=Y(dec);
      svg.append(svgEl("line",{x1:padL,x2:padL+plotW,y1:y,y2:y,class:"gridline"}));
      const t=svgEl("text",{x:padL-7,y:y+3.5,"text-anchor":"end",class:"axis mono"}); t.textContent=(dec>0?"+":"")+dec+"°"; svg.append(t); }
    for(const t of placed){
      const ps=fpProgrammes(t).sort((a,b)=>(b.mosaic?2:1)*FOV[b.scope][0]-(a.mosaic?2:1)*FOV[a.scope][0]);
      for(const p of ps){
        const f=FOV[p.scope], m=p.mosaic?2:1;
        const w=Math.max(f[0]*m*degX*EXAG,6), h=Math.max(f[1]*m*degY*EXAG,4);
        const r=svgEl("rect",{x:X(t.ra)-w/2,y:Y(t.dec)-h/2,width:w,height:h,rx:1.5,
          "fill-opacity":Math.min(.14+p.nights*.04,.6),"stroke-width":"1.2","stroke-dasharray":p.mosaic?"4 2.5":"none",style:"cursor:pointer",tabindex:"0",role:"button",
          "aria-label":t.name+" · "+(CAMSHORT[p.scope]||p.scope)+(p.mosaic?" mosaic":"")+" · "+fmtH(p.hours)});
        svgCamFill(r,p.scope); r.setAttribute("stroke","var("+CAMV[p.scope]+")");
        hoverable(r,()=>{ tt.replaceChildren(); tt.append(el("div","tt-t",t.name));
          ttRow(tt,(CAMSHORT[p.scope]||p.scope)+(p.mosaic?" mosaic":""),fmtH(p.hours)+" · "+p.nights+" night"+(p.nights===1?"":"s"),CAMV[p.scope]); });
        r.addEventListener("click",()=>{ select(t); });
        r.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(t);} });
        svg.append(r);
      }
      if(t===cur) svg.append(svgEl("circle",{cx:X(t.ra),cy:Y(t.dec),r:11,fill:"none",stroke:"var(--ink)","stroke-width":"1.3","stroke-dasharray":"2 2"}));
    }
  }
  const lg=el("div","legend"); lg.style.marginTop="10px"; left.append(lg);
  for(const id of FPORDER.filter(id=>D.scopes.some(s=>s.camera===id))){
    const li=el("span","li"); const sw=el("span","sw"); paintSwatch(sw,id); li.append(sw, (CAMSHORT[id]||id)+" ");
    const mono=el("span","mono",FOV[id][0]+"×"+FOV[id][1]+"°"); mono.style.color="var(--muted)"; mono.style.fontSize="11px"; li.append(mono); lg.append(li); }
  const lim=el("span","li"); const dsw=el("span","sw"); dsw.style.border="1px dashed var(--ink2)"; lim.append(dsw,"mosaic"); lg.append(lim);
  const note=el("div","skynote","Footprints are exaggerated 2.2× on the all-sky map so the S30 Pro's 4° field is visible; the target panel is to scale. Rotation is not yet read from FITS headers, so every field sits sky-up on its catalogue position, and Seestar mosaics are drawn at twice the single frame. "+(TG.length-placed.length)+" targets have no catalogue position and are not drawn.");
  left.append(note);
  const list=el("div","fp-list"); left.append(list);

  /* ---- right: one target, to scale ---- */
  const rHead=el("div"); right.append(rHead);
  const fsvg=svgEl("svg",{class:"fp",viewBox:"0 0 420 320",width:"100%",role:"img","aria-label":"Footprints on the selected target"}); right.append(fsvg);
  const rows=el("div","fp-rows"); right.append(rows);
  const tonightBox=el("div","fp-tonight"); right.append(tonightBox);

  function drawTarget(){
    rHead.replaceChildren();
    rHead.append(el("div","eyebrow",[cur.type||"target",cur.constellation,...cur.codes].filter(Boolean).join(" · ")));
    const h=el("h2","sec",cur.name); h.style.fontSize="20px"; h.style.fontWeight="700"; h.style.letterSpacing="-.015em"; rHead.append(h);
    const ps=fpProgrammes(cur);
    const sub=el("div","sub",fmtH(cur.hours)+" · "+cur.nights+" nights · "+ps.length+" scope programme"+(ps.length===1?"":"s")+" · "+fmtDY(cur.firstNight)+" to "+fmtDY(cur.lastNight));
    rHead.append(sub);
    const open=el("button","tbtn","open target"); open.style.marginTop="8px"; open.addEventListener("click",()=>openTarget(cur.name)); rHead.append(open);

    fsvg.replaceChildren();
    let maxd=0.6; for(const p of ps){ const f=FOV[p.scope],m=p.mosaic?2:1; maxd=Math.max(maxd,f[0]*m/2,f[1]*m/2); }
    if(tonight){ const f=FOV[tonight]; maxd=Math.max(maxd,f[0]/2,f[1]/2); }
    const span=maxd*2*1.25, sc=320/span, cx=210, cy=160;
    fsvg.append(svgEl("rect",{x:0,y:0,width:420,height:320,fill:"var(--card2)",rx:8}));
    for(let d=-Math.ceil(span/2);d<=span/2;d+=1){ if(d===0) continue;
      fsvg.append(svgEl("line",{x1:cx+d*sc,x2:cx+d*sc,y1:0,y2:320,class:"gridline"}));
      fsvg.append(svgEl("line",{y1:cy-d*sc,y2:cy-d*sc,x1:0,x2:420,class:"gridline"})); }
    fsvg.append(svgEl("line",{x1:14,x2:14+sc,y1:306,y2:306,stroke:"var(--ink2)","stroke-width":"1.5"}));
    const st=svgEl("text",{x:14,y:299,class:"axis mono"}); st.textContent="1°"; fsvg.append(st);
    const sorted=[...ps].sort((a,b)=>(b.mosaic?2:1)*FOV[b.scope][0]-(a.mosaic?2:1)*FOV[a.scope][0]);
    const bigW = sorted.length ? FOV[sorted[0].scope][0]*(sorted[0].mosaic?2:1)*sc : 0;
    sorted.forEach((p,i)=>{
      const f=FOV[p.scope],m=p.mosaic?2:1,w=f[0]*m*sc,h=f[1]*m*sc;
      const r=svgEl("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:2,"fill-opacity":Math.min(.12+p.nights*.035,.5),"stroke-width":"1.6","stroke-dasharray":p.mosaic?"5 3":"none"});
      svgCamFill(r,p.scope); r.setAttribute("stroke","var("+CAMV[p.scope]+")"); fsvg.append(r);
      if(p.mosaic){ fsvg.append(svgEl("line",{x1:cx,x2:cx,y1:cy-h/2,y2:cy+h/2,stroke:"var("+CAMV[p.scope]+")","stroke-opacity":".35"}));
                    fsvg.append(svgEl("line",{y1:cy,y2:cy,x1:cx-w/2,x2:cx+w/2,stroke:"var("+CAMV[p.scope]+")","stroke-opacity":".35"})); }
      const small = w<130 || h<40;
      const lx = small ? 12 : cx-w/2+6, ly = small ? 18+i*13 : cy-h/2+13;
      if(small) fsvg.append(svgEl("line",{x1:cx-w/2,y1:cy-h/2+2,x2:lx+120,y2:ly-3,stroke:"var("+CAMV[p.scope]+")","stroke-opacity":".45"}));
      const lbl=svgEl("text",{x:lx,y:ly,class:"fl"}); lbl.textContent=(CAMSHORT[p.scope]||p.scope)+(p.mosaic?" mosaic":"")+" · "+fmtH(p.hours); fsvg.append(lbl);
    });
    if(tonight){ const f=FOV[tonight],w=f[0]*sc,h=f[1]*sc;
      fsvg.append(svgEl("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:2,fill:"none",stroke:"var(--ink)","stroke-width":"2","stroke-dasharray":"2 3"}));
      const l=svgEl("text",{x:cx,y:cy+h/2+13,"text-anchor":"middle",class:"fl"}); l.textContent="tonight · "+(CAMSHORT[tonight]||tonight); fsvg.append(l); }
    fsvg.append(svgEl("circle",{cx,cy,r:2.5,fill:"var(--ink)"}));

    rows.replaceChildren();
    const mx=Math.max(...ps.map(p=>p.hours),0.1);
    for(const p of ps){
      const row=el("div","fp-row"); const sw=el("span","sw"); paintSwatch(sw,p.scope); row.append(sw);
      const body=el("div"); const l=el("div","l");
      l.append(el("span",null,(CAMSHORT[p.scope]||p.scope)+(p.mosaic?" mosaic":"")+(p.unattributed?" (rig unrecorded)":"")));
      l.append(el("span",null,fmtH(p.hours)+" · "+p.nights+" n · last "+fmtD(p.last)));
      const bar=el("div","bar"); const fill=el("i"); fill.style.width=(p.hours/mx*100)+"%"; paintSwatch(fill,p.scope); bar.append(fill);
      body.append(l,bar); row.append(body); rows.append(row);
    }

    tonightBox.replaceChildren();
    tonightBox.append(el("div","eyebrow","Frame for tonight"));
    const chips=el("div","fp-chips"); tonightBox.append(chips);
    for(const id of FPORDER){ const b=el("button","chip",CAMSHORT[id]||id); if(tonight===id) b.classList.add("sel");
      b.setAttribute("aria-pressed",tonight===id?"true":"false"); b.addEventListener("click",()=>{ tonight = tonight===id?null:id; drawTarget(); }); chips.append(b); }
    const v=el("div","fp-verdict"); tonightBox.append(v);
    if(!tonight){ v.textContent="Pick a scope to see whether tonight adds new sky, more depth on sky you already have, or resolution on a field a bigger scope already covers."; return; }
    const f=FOV[tonight]; const shot=ps.filter(p=>p.scope===tonight);
    const cover=ps.filter(p=>{ const g=FOV[p.scope],m=p.mosaic?2:1; return g[0]*m>=f[0]*.95 && g[1]*m>=f[1]*.95; });
    if(shot.length){ const hrs=shot.reduce((s,p)=>s+p.hours,0); const last=shot.map(p=>p.last).sort().pop();
      v.replaceChildren(); v.append("You already have ",el("b",null,fmtH(hrs))," on ",el("b",null,cur.name)," with the "+(CAMSHORT[tonight]||tonight)+" (last "+fmtDY(last)+"). Tonight adds depth, not new sky. Mosaic mode would roughly double the field."); }
    else if(cover.length){ v.replaceChildren(); v.append("New scope, but this sky is already covered: ",el("b",null,cover.map(p=>(CAMSHORT[p.scope]||p.scope)+(p.mosaic?" mosaic":"")).join(", "))," span the "+(CAMSHORT[tonight]||tonight)+" field. Worth it for resolution or depth, not for coverage."); }
    else { v.classList.add("new"); v.replaceChildren(); v.append(el("b",null,"New framing. "),"The "+(CAMSHORT[tonight]||tonight)+" field ("+f[0]+"° × "+f[1]+"°) is larger than anything you have on "+cur.name+". Tonight adds sky nobody has shot."); }
  }
  function drawList(){
    list.replaceChildren();
    for(const t of placed){ const b=el("button",null,t.name); b.setAttribute("aria-current",t===cur?"true":"false"); b.addEventListener("click",()=>select(t)); list.append(b); }
  }
  function select(t){ cur=t; tonight=null; mem.fpTarget=t.name; remember(); drawSky(); drawList(); drawTarget(); }
  drawSky(); drawList(); drawTarget();
};

RENDER.health = function(root){
  const rec=el("div","card");
  rec.append(el("h2","sec","How the numbers add up"));
  rec.append(el("div","sub","what was read, what this page counts, and where the difference went"));
  const w=el("div","tablewrap"); rec.append(w);
  const t2=el("table","dt");
  const thead=el("thead"); const hr=el("tr");
  ["Check","Read","Counted","Note",""].forEach(h=>hr.append(el("th",null,h))); thead.append(hr); t2.append(thead);
  const tb=el("tbody");
  for(const r of D.reconciliation){
    const tr=el("tr");
    tr.append(el("td",null,r.check));
    tr.append(el("td",null,String(typeof r.expected==="number"?r.expected.toLocaleString("en-GB"):r.expected)));
    tr.append(el("td",null,String(typeof r.computed==="number"?r.computed.toLocaleString("en-GB"):r.computed)));
    tr.append(el("td",null,r.note||""));
    const td=el("td"); td.append(el("span","okbadge "+(r.ok?"ok":"diff"), r.ok?"OK":"CHECK")); tr.append(td);
    tb.append(tr);
  }
  t2.append(tb); w.append(t2);
  root.append(rec);

  const hl=el("div","hlist"); hl.style.marginTop="14px";
  for(const h of D.health){
    const it=el("div","hitem");
    const st=el("div","stripe"); st.style.background=h.severity==="warn"?"var(--st-quarantined)":"var(--line)";
    it.append(st);
    const bx=el("div"); bx.append(el("h4",null,h.title), el("p",null,h.detail)); it.append(bx);
    hl.append(it);
  }
  root.append(hl);

  /* shelves */
  if(!Object.keys(D.shelves||{}).length) { const p0=el("p","sub"); p0.style.marginTop="14px"; p0.textContent=D.sourceNote+" "+(D.provenance||""); root.append(p0); return; }
  const sh=el("div","card"); sh.style.marginTop="14px";
  sh.append(el("h2","sec","Shelves and side rooms"));
  sh.append(el("div","sub","everything on the archive that is not a camera tree; lights never count these"));
  const w2=el("div","tablewrap"); sh.append(w2);
  const rows=Object.entries(D.shelves)
    .filter(([k])=>k!=="(root)")
    .sort((a,b)=>b[1].bytes-a[1].bytes)
    .map(([k,v])=>[k.replace("_Seestar S30 Pro Data\\","S30 Pro side · ").replace("_ZWO ASI585MC Data\\","ZWO side · "),fmtI(v.files),fmtGB(v.bytes)]);
  rows.push(["Mac '._' and .DS_Store junk, everywhere",fmtI(D.junk.files),fmtGB(D.junk.bytes)]);
  simpleTable(w2,["Shelf","Files","Size"],rows);
  root.append(sh);

  const lg=el("div","card"); lg.style.marginTop="14px";
  lg.append(el("h2","sec","Where this snapshot came from"));
  const p=el("p"); p.style.fontSize="12.5px"; p.style.color="var(--ink2)"; p.style.maxWidth="90ch";
  p.textContent=D.sourceNote+" "+(D.provenance||"");
  lg.append(p);
  root.append(lg);
};

/* ================= INIT ================= */
go((mem.tab && RENDER[mem.tab]) ? mem.tab : "overview");
