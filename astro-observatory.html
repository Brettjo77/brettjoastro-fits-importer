<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Astro Archive Observatory, served by the BrettjoAstro FITS Importer panel (1.7.0).
     Design: the Astro Archive Observatory artifact (Aug 2026). Data: the dataset slot is
     filled by the engine (build_observatory) from projects.json, the ledgers and
     the contract. Fonts are the system's: the panel loads nothing from the web. -->
<title>Astro Archive Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  /* dark-first: the bare root carries the full night palette */
  --page:#0b0e15; --card:#131720; --card2:#181d29; --line:#283041; --grid:#212837;
  --ink:#edf1f8; --ink2:#a9b3c6; --muted:#7a849b;
  --cam-s30p:#eda100; --cam-asiair:#3cb554; --cam-s50:#0a0a0a; --cam-s30:#3987e5; --cam-fra:#e05a5a; --cam-s50p:#d66bc9; --edge:rgba(255,255,255,.55);
  --st-captured:#5f4fbe; --st-stacked:#8f80ea; --st-processing:#beb3fa;
  --st-complete:#0ca30c; --st-quarantined:#ec835a; --st-todo:#7a849b;
  --good:#0ca30c; --warn-c:#ec835a;
  --heat0:var(--card); --heat1:#0d366b; --heat2:#1c5cab; --heat3:#2a78d6; --heat4:#5598e7; --heat5:#9ec5f4;
  --focus:#5598e7; --wash:rgba(255,255,255,.05); --wash2:rgba(255,255,255,.09);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --page:#f2f4f8; --card:#fcfdfe; --card2:#f5f7fb; --line:#dde3ec; --grid:#e8ecf3;
    --ink:#151b28; --ink2:#4d586e; --muted:#8791a6;
    --cam-s30p:#e0a000; --cam-asiair:#0f8f2f; --cam-s50:#0a0a0a; --cam-s30:#2a78d6; --cam-fra:#d23a3a; --cam-s50p:#b84ea8; --edge:rgba(11,17,32,.55);
    --st-captured:#a99df0; --st-stacked:#7a68dd; --st-processing:#4a3aa7;
    --st-complete:#0ca30c; --st-quarantined:#ec835a; --st-todo:#8791a6;
    --good:#006300; --warn-c:#c65b32;
    --heat0:var(--card); --heat1:#cde2fb; --heat2:#9ec5f4; --heat3:#5598e7; --heat4:#2a78d6; --heat5:#184f95;
    --focus:#2a78d6; --wash:rgba(21,27,40,.045); --wash2:rgba(21,27,40,.08);
  }
}
:root[data-theme="light"]{
  --page:#f2f4f8; --card:#fcfdfe; --card2:#f5f7fb; --line:#dde3ec; --grid:#e8ecf3;
  --ink:#151b28; --ink2:#4d586e; --muted:#8791a6;
  --cam-s30p:#e0a000; --cam-asiair:#0f8f2f; --cam-s50:#0a0a0a; --cam-s30:#2a78d6; --cam-fra:#d23a3a; --cam-s50p:#b84ea8; --edge:rgba(11,17,32,.55);
  --st-captured:#a99df0; --st-stacked:#7a68dd; --st-processing:#4a3aa7;
  --st-complete:#0ca30c; --st-quarantined:#ec835a; --st-todo:#8791a6;
  --good:#006300; --warn-c:#c65b32;
  --heat0:var(--card); --heat1:#cde2fb; --heat2:#9ec5f4; --heat3:#5598e7; --heat4:#2a78d6; --heat5:#184f95;
  --focus:#2a78d6; --wash:rgba(21,27,40,.045); --wash2:rgba(21,27,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark light}
body{background:var(--page);color:var(--ink);font:400 15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none !important;animation:none !important}}

/* ---------- header ---------- */
header.top{border-bottom:1px solid var(--line);padding:20px 0 0;background:var(--page)}
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:16px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1.wordmark{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.mast-right{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink2);line-height:1.7}
.mast-right b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:9px 14px 11px;font-size:13.5px;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0}
nav.tabs button:hover{color:var(--ink);background:var(--wash)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
main{padding:26px 0 20px}
section.view{display:none}
section.view.on{display:block}

/* ---------- cards & layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
h2.sec{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink);margin-bottom:2px}
.sub{font-size:12.5px;color:var(--muted)}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tbtn{font-size:11.5px;font-family:"IBM Plex Mono",monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.tbtn:hover{color:var(--ink);background:var(--wash)}
.tbtn[aria-pressed="true"]{color:var(--ink);background:var(--wash2);border-color:var(--muted)}

/* ---------- hero + KPIs ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:26px 24px}
.hero .big{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.hero .big small{font-size:24px;font-weight:600;color:var(--ink2);letter-spacing:0}
.hero .lede{max-width:56ch;color:var(--ink2);font-size:14px}
.hero .lede b{color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .k-label{font-size:12px;color:var(--muted)}
.kpi .k-val{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- chips, dots, badges ---------- */
.hashfill{background:repeating-linear-gradient(45deg,#ffffff 0 3px,#101010 3px 6px) !important}
.edged{box-shadow:inset 0 0 0 1px var(--edge)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2.5px 10px;white-space:nowrap}
.chip.sel{color:var(--ink);background:var(--wash2);border-color:var(--muted)}
.stchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.badge{display:inline-block;font-size:10.5px;font-family:"IBM Plex Mono",monospace;color:var(--ink2);background:var(--wash);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend .li{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .lk{width:14px;height:2.5px;border-radius:2px;flex:none}

/* ---------- charts ---------- */
.chart{position:relative}
svg text{font-family:"IBM Plex Sans",system-ui,sans-serif}
svg .axis{font-size:11px;fill:var(--muted)}
svg .axis.mono,svg text.mono{font-family:"IBM Plex Mono",monospace}
svg .gridline{stroke:var(--grid);stroke-width:1}
svg .baseline{stroke:var(--line);stroke-width:1}
svg .dlabel{font-size:11.5px;fill:var(--ink2)}
svg .dlabel.strong{fill:var(--ink);font-weight:600}
.tt{position:fixed;z-index:50;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px;max-width:320px;box-shadow:0 6px 24px rgba(0,0,0,.28);display:none}
.tt .tt-t{font-weight:600;margin-bottom:4px}
.tt .row{display:flex;align-items:center;gap:7px;margin-top:2px;color:var(--ink2)}
.tt .row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tt .lk{display:inline-block;width:12px;height:2.5px;border-radius:2px;flex:none}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line);padding:6px 10px 6px 0;white-space:nowrap}
table.dt td{border-bottom:1px solid var(--grid);padding:5.5px 10px 5.5px 0;color:var(--ink2);font-variant-numeric:tabular-nums}
table.dt td:first-child{color:var(--ink)}
table.dt tr:last-child td{border-bottom:none}
.tablewrap{overflow-x:auto}

/* ---------- targets ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type="search"]{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 12px;font:inherit;font-size:13.5px;width:230px}
.toolbar input[type="search"]::placeholder{color:var(--muted)}
.toolbar select{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 9px;font:inherit;font-size:13px}
.tcount{font-size:12px;color:var(--muted);margin-left:auto;font-family:"IBM Plex Mono",monospace}
.trows{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:minmax(210px,1.5fr) minmax(140px,1fr) 110px 130px 76px 68px 84px 100px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 16px;text-align:left;width:100%}
.trow:hover{background:var(--card2)}
.trow .tname{font-weight:600;font-size:14px}
.trow .tcodes{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:1px}
.trow .tmeta{font-size:12px;color:var(--ink2)}
.trow .num{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2);text-align:right}
.trow .num b{color:var(--ink);font-weight:600}
.thead{display:grid;grid-template-columns:minmax(210px,1.5fr) minmax(140px,1fr) 110px 130px 76px 68px 84px 100px;gap:10px;padding:0 16px 6px;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace;letter-spacing:.05em;text-transform:uppercase}
.thead .num{text-align:right}
@media (max-width:1040px){.thead{display:none}.trow{grid-template-columns:1fr 1fr;grid-auto-rows:auto}}

/* ---------- drawer ---------- */
.drawer-scrim{position:fixed;inset:0;background:rgba(4,6,10,.55);z-index:39;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,96vw);background:var(--page);border-left:1px solid var(--line);z-index:40;transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;padding:24px 26px 40px}
.drawer.open{transform:none}
.drawer .close{position:sticky;top:0;float:right;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:13px;color:var(--ink2);z-index:2}
.drawer h3{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:4px 0 2px;text-wrap:balance}
.answer{font-size:14.5px;color:var(--ink2);max-width:62ch;margin:10px 0 4px}
.answer b{color:var(--ink);font-weight:600}
.prog{border:1px solid var(--line);border-radius:10px;padding:13px 16px;background:var(--card);margin-top:10px}
.prog .p-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:13.5px}
.prog .p-path{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:6px;word-break:break-all}
.prog .p-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.prog .p-stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.spot{border:1px solid var(--line);border-left:3px solid var(--st-stacked);border-radius:10px;background:var(--card2);padding:14px 16px;margin-top:12px;font-size:13px;color:var(--ink2)}
.spot b{color:var(--ink)}

/* ---------- pipeline board ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.col h3{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.col .colsum{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin:3px 0 10px}
.pcard{border:1px solid var(--line);border-radius:8px;background:var(--card2);padding:9px 11px;margin-top:8px;text-align:left;width:100%;display:block}
.pcard:hover{border-color:var(--muted)}
.pcard .p-t{font-weight:600;font-size:13px;line-height:1.3}
.pcard .p-m{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.pcard .p-ev{font-size:11px;color:var(--muted);margin-top:5px}
.pcard .p-act{font-size:11.5px;color:var(--ink2);font-style:italic;margin-top:4px}

/* ---------- nights heatmap ---------- */
.hm-year{margin-top:16px}
.hm-scroll{overflow-x:auto;padding-bottom:4px}
.hm-stats{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:12px}
.hm-stats b{color:var(--ink);font-weight:600}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.hm-legend .cell{width:11px;height:11px;border-radius:2.5px;border:1px solid var(--grid)}

/* ---------- sky ---------- */
.skywrap{overflow-x:auto}
/* scope timeline (click a scope on the Overview): dots grow in once, left to right */
.scopehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.scopehead .sname{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.scopehead .range{display:flex;gap:4px;margin-left:auto}
.scopebtn{display:inline-flex;align-items:center;gap:7px;font-weight:600;border-radius:6px;padding:2px 6px 2px 2px;margin-left:-2px}
.scopebtn:hover{background:var(--wash2)}
.scopebtn .arrow{color:var(--muted);font-weight:400;font-size:11.5px}
svg .tl-dot{transform-box:fill-box;transform-origin:center;animation:tlgrow .4s cubic-bezier(.2,.8,.2,1) both}
svg .tl-dot:hover,svg .tl-dot:focus{stroke:var(--ink);stroke-width:1.5}
svg .tl-lane{cursor:pointer}
svg .tl-lane:hover text.dlabel{fill:var(--ink)}
@keyframes tlgrow{from{transform:scale(0);opacity:0}}
.skynote{font-size:12px;color:var(--muted);margin-top:10px;max-width:80ch}

/* ---------- equipment ---------- */
.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.scard h3{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.scard .s-nums{display:flex;gap:18px;margin:10px 0 2px}
.scard .s-nums .n b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em}
.scard .s-nums .n span{font-size:11px;color:var(--muted)}
.scard .s-line{font-size:12px;color:var(--ink2);margin-top:7px}
.minibar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:6px;background:transparent}
.minibar i{display:block;height:100%}

/* ---------- health ---------- */
.hlist{display:flex;flex-direction:column;gap:10px}
.hitem{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px}
.hitem .stripe{width:3px;border-radius:2px;flex:none}
.hitem h4{font-size:13.5px;font-weight:600}
.hitem p{font-size:12.5px;color:var(--ink2);margin-top:3px;max-width:90ch}
.okbadge{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;border-radius:5px;padding:1px 7px}
.okbadge.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.okbadge.diff{color:var(--warn-c);background:color-mix(in srgb,var(--warn-c) 14%,transparent)}

/* ---------- coverage matrix ---------- */
.mxwrap{overflow-x:auto;padding-bottom:4px}
.mxhead{display:grid;gap:6px;padding:0 12px 8px;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace;letter-spacing:.05em;text-transform:uppercase;align-items:end}
.mxhead .mxcol{display:flex;align-items:center;gap:6px;justify-content:center;text-align:center}
.mxhead .end{text-align:right;justify-content:flex-end}
.mxrow{display:grid;gap:6px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px}
.mxrow:hover{background:var(--card2)}
.mxcell{display:flex;align-items:center;gap:6px;justify-content:center;border-radius:7px;padding:5px 4px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);min-height:29px}
.mxcell b{font-weight:600}
.mxcell.off{color:var(--muted)}
.mxn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);text-align:right}
.mxsum{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}

/* ---------- footprints ---------- */
.fp-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);gap:14px;align-items:start}
@media (max-width:900px){.fp-grid{grid-template-columns:1fr}}
.fp-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-height:260px;overflow:auto;padding-right:4px}
.fp-list button{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.fp-list button:hover{background:var(--wash);color:var(--ink)}
.fp-list button[aria-current="true"]{color:var(--ink);background:var(--wash2);border-color:var(--muted)}
.fp-rows{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.fp-row{display:grid;grid-template-columns:11px 1fr;gap:10px;align-items:center}
.fp-row .sw{width:11px;height:11px;border-radius:3px}
.fp-row .l{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.fp-row .l span:last-child{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.fp-row .bar{height:7px;border-radius:4px;background:var(--grid);margin-top:4px;overflow:hidden}
.fp-row .bar i{display:block;height:100%;border-radius:4px}
.fp-tonight{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.fp-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fp-verdict{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--card2);border-left:3px solid var(--st-stacked);font-size:13px;color:var(--ink2)}
.fp-verdict.new{border-left-color:var(--good)}
.fp-verdict b{color:var(--ink)}
svg.fp text.fl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:var(--ink)}
.warnstrip{margin:0 0 10px;padding:9px 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--warn-c) 50%,var(--line));background:color-mix(in srgb,var(--warn-c) 10%,transparent);color:var(--ink);font-size:13px;line-height:1.45}
.warnstrip b{color:var(--warn-c)}
.p-act-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
.p-act-row button{font-size:12px;font-weight:500;color:var(--ink);background:var(--wash2);border:1px solid var(--line);border-radius:7px;padding:5px 11px}
.p-act-row button:hover{border-color:var(--muted)}
.p-act-row .said{font-size:12px;color:var(--ink2)}
footer.foot{border-top:1px solid var(--line);margin-top:34px;padding:16px 0 26px;font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;line-height:1.8}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="hatchS30" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><rect width="7" height="3.2" fill="#101010"/></pattern>
</defs></svg>
<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="masthead">

<script id="dataset" type="application/json">__DATASET__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("dataset").textContent);
/* a dataset from another engine version may lack a key: fill the gaps once, so no tab goes blank */
for(const [k,v] of Object.entries({targets:[],sessions:[],scopes:[],events:[],health:[],reconciliation:[],warnings:[],shelves:{},calibration:{},askarRigs:{},junk:{files:0,bytes:0},totals:{},inputs:{}})) if(D[k]==null) D[k]=v;

/* ---------- constants ---------- */
/* Fixed identity order (validated palette slots); CAMS shows only the scopes
   present in the dataset, so the same page handles the split and unsplit
   Askar worlds. Colour follows the entity in every mode. */
const CAMORDER = [
  {id:"Seestar S30 Pro", short:"S30 Pro", v:"--cam-s30p"},
  {id:"ASIAir",          short:"Askar rigs", v:"--cam-asiair"},
  {id:"Askar 107PHQ",    short:"107PHQ", v:"--cam-asiair"},
  {id:"Seestar S50",     short:"S50", v:"--cam-s50"},
  {id:"Seestar S30",     short:"S30", v:"--cam-s30"},
  {id:"Askar FRA400",    short:"FRA400", v:"--cam-fra"},
  {id:"Seestar S50 Pro", short:"S50 Pro", v:"--cam-s50p"},
];
/* A scope the list above doesn't know (a new entry in contract/scopes.json) still
   gets a place and its contract colour, never a silent drop */
for(const s of (D.scopes||[])){
  if(!CAMORDER.some(c=>c.id===s.camera))
    CAMORDER.push({id:s.camera, short:String(s.camera).replace(/^(Seestar|Askar)\s+/,""), v:"--muted", hex:s.colour||null});
}
/* a camera that only the sessions name (no scopes row) gets a place the same way */
for(const s of (D.sessions||[])){
  if(s && s.camera && !CAMORDER.some(c=>c.id===s.camera))
    CAMORDER.push({id:s.camera, short:String(s.camera).replace(/^(Seestar|Askar)\s+/,""), v:"--muted", hex:null});
}
const CAMS = CAMORDER.filter(c=>D.scopes.some(s=>s.camera===c.id) || D.sessions.some(s=>s && s.camera===c.id));
const CAMV = Object.fromEntries(CAMORDER.map(c=>[c.id,c.v]));
const CAMSHORT = Object.fromEntries(CAMORDER.map(c=>[c.id,c.short]));
CAMV["Askar (unattributed)"]="--muted"; CAMSHORT["Askar (unattributed)"]="Askar, rig unrecorded";
/* Brett's palette: S30 Pro yellow, 107PHQ green, S50 black, S30 blue, FRA400 red.
   The black S50 marks carry a fine contrasting edge so they hold on the dark theme. */
const CAMFILL = {
  "Seestar S30 Pro": {v:"--cam-s30p"},
  "ASIAir":          {v:"--cam-asiair"},
  "Askar 107PHQ":    {v:"--cam-asiair"},
  "Seestar S50":     {v:"--cam-s50", edge:true},
  "Seestar S30":     {v:"--cam-s30"},
  "Askar FRA400":    {v:"--cam-fra"},
  "Seestar S50 Pro": {v:"--cam-s50p"},
  "Askar (unattributed)": {v:"--muted"},
};
function camFillOf(camId){
  if(CAMFILL[camId]) return CAMFILL[camId];
  const c=CAMORDER.find(x=>x.id===camId);
  return c&&c.hex ? {hex:c.hex} : {v:"--muted"};
}
function svgCamFill(node, camId){
  const f=camFillOf(camId);
  node.setAttribute("fill", f.hash ? "url(#hatchS30)" : f.hex ? f.hex : "var("+f.v+")");
  if(f.edge){ node.setAttribute("stroke","var(--edge)"); node.setAttribute("stroke-width","1"); }
  return node;
}
function paintSwatch(node, camId){
  const f=camFillOf(camId);
  if(f.hash) node.classList.add("hashfill"); else node.style.background=f.hex?f.hex:"var("+f.v+")";
  if(f.edge) node.classList.add("edged");
  return node;
}
const STAGES = [
  {id:"todo",        label:"To do",        v:"--st-todo",        outline:true},
  {id:"captured",    label:"Still capturing", v:"--st-captured"},
  {id:"stacked",     label:"To process",   v:"--st-stacked"},
  {id:"processing",  label:"In progress",  v:"--st-processing"},
  {id:"complete",    label:"Done",         v:"--st-complete"},
  {id:"quarantined", label:"Quarantined",  v:"--st-quarantined"},
];
const STAGE = Object.fromEntries(STAGES.map(s=>[s.id,s]));
const stageOf=id=>STAGE[id]||STAGE.captured;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- state (remembered per viewer, best-effort) ---------- */
let mem = {};
try { mem = JSON.parse(localStorage.getItem("aao") || "{}") || {}; } catch(e) { mem = {}; }
if(typeof mem!=="object"||mem===null||Array.isArray(mem)) mem={};
function remember(){ try { localStorage.setItem("aao", JSON.stringify(mem)); } catch(e){} }

/* ---------- tiny DOM + format helpers ---------- */
function el(tag, cls, text){ const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n; }
const fmtI = n => (n==null?"?":n.toLocaleString("en-GB"));
const fmtH = (h,dp=1) => h==null?"?":h.toLocaleString("en-GB",{minimumFractionDigits:dp,maximumFractionDigits:dp})+" h";
const fmtGB = b => b>=1e12 ? (b/1e12).toLocaleString("en-GB",{maximumFractionDigits:2})+" TB" : b>=1e9 ? (b/1e9).toLocaleString("en-GB",{maximumFractionDigits:1})+" GB" : (b/1e6).toLocaleString("en-GB",{maximumFractionDigits:0})+" MB";
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDY(iso){ if(!iso) return "?"; const [y,m,d]=String(iso).split("-"); if(!m||!d) return String(iso); return (+d)+" "+(MONTHS[+m-1]||m)+" "+y; }
const fmtD=fmtDY;
function svgEl(tag, attrs){ const n=document.createElementNS("http://www.w3.org/2000/svg",tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function camDot(camId){ const d=el("span","dot"); paintSwatch(d,camId); d.title=camId; return d; }
function stageChip(stId){
  const s=stageOf(stId), c=el("span","stchip");
  const d=el("span","dot"); d.style.background=s.outline?"transparent":"var("+s.v+")";
  if(s.outline) d.style.border="1.5px solid var("+s.v+")";
  c.append(d, s.label); return c;
}

/* ---------- tooltip ---------- */
const tt = document.getElementById("tt");
let ttOwner=null;
function ttBuild(build, owner){ tt.replaceChildren(); build(tt); tt.style.display="block"; ttOwner=owner||null; }
function ttPlace(evt){
  const pad=14, w=tt.offsetWidth, h=tt.offsetHeight;
  let x=evt.clientX+pad, y=evt.clientY+pad;
  if(x+w>innerWidth-8) x=evt.clientX-w-pad;
  if(y+h>innerHeight-8) y=evt.clientY-h-pad;
  tt.style.left=x+"px"; tt.style.top=y+"px";
}
function ttShow(evt, build, owner){ ttBuild(build, owner); ttPlace(evt); }
function ttHide(){ tt.style.display="none"; ttOwner=null; }
function ttRow(parent, label, val, colorVar){
  const r=el("div","row");
  if(colorVar){ const k=el("span","lk");
    if(CAMFILL[colorVar] || CAMORDER.some(c=>c.id===colorVar)) paintSwatch(k,colorVar);
    else k.style.background="var("+colorVar+")";
    r.append(k); }
  r.append(el("span",null,label));
  const b=el("b",null,val); r.append(b); return parent.appendChild(r);
}
function hoverable(node, build){
  /* built once on enter (or focus), only moved on pointermove; rebuilt if another node owns the tooltip */
  node.addEventListener("pointerenter", e=>ttShow(e,build,node));
  node.addEventListener("pointermove", e=>{ if(ttOwner!==node||tt.style.display!=="block") ttShow(e,build,node); else ttPlace(e); });
  node.addEventListener("pointerleave", ttHide);
  node.addEventListener("focus", e=>{ const r=node.getBoundingClientRect(); ttShow({clientX:r.right,clientY:r.top}, build, node); });
  node.addEventListener("blur", ttHide);
}

/* ---------- chart card scaffold with table twin ---------- */
function chartCard(title, sub, renderChart, renderTable){
  const card=el("div","card");
  const head=el("div","cardhead");
  const left=el("div"); left.append(el("h2","sec",title)); if(sub) left.append(el("div","sub",sub));
  head.append(left);
  const btn=el("button","tbtn","view as table"); btn.setAttribute("aria-pressed","false");
  head.append(btn); card.append(head);
  const body=el("div"); card.append(body);
  let mode="chart";
  function paint(){
    body.replaceChildren();
    if(mode==="chart"){ const c=el("div","chart"); renderChart(c); body.append(c); btn.textContent="view as table"; btn.setAttribute("aria-pressed","false"); }
    else { const w=el("div","tablewrap"); renderTable(w); body.append(w); btn.textContent="view as chart"; btn.setAttribute("aria-pressed","true"); }
  }
  btn.addEventListener("click", ()=>{ mode = mode==="chart" ? "table":"chart"; paint(); });
  paint();
  return card;
}
function simpleTable(wrap, headers, rows){
  const t=el("table","dt"), tr=el("tr");
  headers.forEach(h=>tr.append(el("th",null,h)));
  const thead=el("thead"); thead.append(tr); t.append(thead);
  const tb=el("tbody");
  rows.forEach(r=>{ const x=el("tr"); r.forEach(c=>x.append(el("td",null,String(c)))); tb.append(x); });
  t.append(tb); wrap.append(t);
}

/* ---------- derived data ---------- */
const TG = D.targets.slice();
const byName = {};
for(const t of TG){
  if(byName[t.name]){ D.health.push({severity:"warn", title:"Two targets share a display name", detail:t.name}); continue; }
  byName[t.name]=t;
}
const SESS = D.sessions;
for(const s of SESS){ s.hours=+s.hours||0; s.frames=+s.frames||0; s.filters=s.filters||{}; s.exps=s.exps||{}; s.night=String(s.night||""); }
const totalHours = D.totals.hours;
const camOrderIdx = Object.fromEntries(CAMS.map((c,i)=>[c.id,i]));

/* per-target per-camera hour split, from sessions so a rig split flows through */
for(const t of TG) t.camHours = {};
for(const s of SESS){
  const t=byName[s.target]; if(!t) continue;
  t.camHours[s.camera]=(t.camHours[s.camera]||0)+s.hours;
}
/* nightly map: night -> {frames, seconds, perCam, targets} */
const nightly = new Map();
for(const s of SESS){
  let n = nightly.get(s.night);
  if(!n){ n={frames:0,hours:0,perCam:{},targets:new Set()}; nightly.set(s.night,n); }
  n.frames+=s.frames; n.hours+=s.hours;
  n.perCam[s.camera]=n.perCam[s.camera]||{frames:0,hours:0};
  n.perCam[s.camera].frames+=s.frames; n.perCam[s.camera].hours+=s.hours;
  n.targets.add(s.target);
}
/* all status cards flattened */
const CARDS=[];
for(const t of TG) for(const c of t.statusCards) CARDS.push(c);
Object.freeze(CARDS);

/* ---------- tabs ---------- */
const VIEWS=[
  ["overview","Overview"],["targets","Targets"],["coverage","Coverage"],["pipeline","Pipeline"],
  ["nights","Nights"],["sky","Sky"],["footprints","Footprints"],["equipment","Equipment"],["health","Data health"]
];
const tabsNav=document.getElementById("tabs");
const mainEl=document.getElementById("main");
const sections={};
const WARN_N=(D.health||[]).filter(h=>h&&h.severity==="warn").length;
for(const [id,label] of VIEWS){
  const b=el("button",null,label+(id==="health"&&WARN_N?" · "+WARN_N:""));
  b.id="tab-"+id; b.setAttribute("role","tab"); b.setAttribute("aria-selected","false");
  b.addEventListener("click",()=>go(id));
  tabsNav.append(b);
  const s=el("section","view"); s.id="view-"+id; s.setAttribute("role","tabpanel");
  s.setAttribute("aria-labelledby","tab-"+id);
  mainEl.append(s); sections[id]=s;
}
tabsNav.addEventListener("keydown",e=>{
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  const ids=VIEWS.map(v=>v[0]); let i=ids.indexOf(current);
  i=(i+(e.key==="ArrowRight"?1:-1)+ids.length)%ids.length; go(ids[i]);
  document.getElementById("tab-"+ids[i]).focus();
});
let current=null;
const painted={}, failed={};
function go(id){
  if(!RENDER[id]) id="overview";
  current=id;
  for(const [vid] of VIEWS){
    sections[vid].classList.toggle("on", vid===id);
    document.getElementById("tab-"+vid).setAttribute("aria-selected", vid===id?"true":"false");
  }
  if(!painted[id]){
    try{ RENDER[id](sections[id]); }
    catch(e){ failed[id]=true; sections[id].replaceChildren(el("p","sub","This view couldn't be drawn ("+(e&&e.message||e)+"). The other tabs still work.")); }
    painted[id]=true;
  }
  if(!failed[id]){ mem.tab=id; remember(); }   /* remembered only once it drew: a view that fails never sticks */
}

/* ---------- masthead + footer ---------- */
(function(){
  const m=document.getElementById("mastStats");
  const l1=el("div"); l1.append(el("b",null,fmtH(totalHours))); l1.append(document.createTextNode(" integration · "));
  l1.append(el("b",null,fmtI(D.totals.lights))); l1.append(document.createTextNode(" lights"));
  const inp=D.inputs||{};
  const srcBits=[];
  if(inp.snapshot) srcBits.push("the "+(inp.snapshot.machine||"other computer")+"'s record of "+fmtDY(String(inp.snapshot.at||"").slice(0,10))+(typeof inp.snapshot.ageHours==="number"&&inp.snapshot.ageHours>=24?" ("+Math.floor(inp.snapshot.ageHours/24)+" day"+(Math.floor(inp.snapshot.ageHours/24)===1?"":"s")+" old)":""));
  if(inp.inventoryAt) srcBits.push("the archive's inventory of "+fmtDY(String(inp.inventoryAt).slice(0,10)));
  const l2=el("div",null,"worked out "+D.generatedAt+(D.servedFrom&&D.servedFrom.machine?" on the "+D.servedFrom.machine:"")+(srcBits.length?" from "+srcBits.join(" and "):""));
  const eb=document.getElementById("mastEyebrow"); if(eb && D.machine) eb.textContent=D.machine;
  m.append(l1,l2);
  const warnsAll=(D.health||[]).filter(h=>h&&h.severity==="warn");
  if(warnsAll.length){
    const strip=el("div","warnstrip");
    strip.append(el("b",null,"⚠ "+warnsAll.length+" thing"+(warnsAll.length===1?"":"s")+" to know: "));
    strip.append(warnsAll.map(h=>h.detail||h.title).join(" · "));
    document.querySelector("header.top .wrap").append(strip);
  }
  const f=document.getElementById("footNote");
  f.append(el("div",null,D.sourceNote));
  f.append(el("div",null,"Nothing on the archive is touched by this page. Its facts are worked out with the To process list: after each import and each ship on the Mac, each night on the PC, and whenever you press Refresh now."));
})();
</script>
<script>
"use strict";
const RENDER = {};

/* ================= OVERVIEW ================= */
/* The first card has two faces. All scopes: the last three sessions on each.
   One scope (click its name): a calendar timeline of that scope's projects.
   SCOPECARD holds the card's parts so Equipment and the hero can open it too. */
let SCOPECARD=null;
const dayMs=864e5;
const nightIdx=(iso,start)=>Math.round((Date.parse(iso+"T12:00:00Z")-Date.parse(start+"T12:00:00Z"))/dayMs);
const nightAdd=(iso,n)=>new Date(Date.parse(iso+"T12:00:00Z")+n*dayMs).toISOString().slice(0,10);
function openScope(cam){
  go("overview");
  if(!SCOPECARD) return;
  paintScopeCard(cam);
  SCOPECARD.card.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function paintScopeCard(cam){
  const {head,sub,body}=SCOPECARD;
  body.replaceChildren();
  if(!cam){
    head.textContent="What each scope captured last";
    sub.textContent="the last three sessions on each scope, newest first · a session is one object on one night · click one for the object, or a scope's name for its timeline";
    body.style.display="grid"; body.style.gridTemplateColumns="repeat(auto-fit,minmax(290px,1fr))"; body.style.gap="12px";
    for(const cm of CAMS){
      const ss=SESS.filter(s=>s.camera===cm.id).sort((a,b)=>b.night.localeCompare(a.night)||(b.hours-a.hours)).slice(0,3);
      const col=el("div");
      const h=el("div"); h.style.display="flex"; h.style.alignItems="center"; h.style.gap="7px"; h.style.marginBottom="6px"; h.style.flexWrap="wrap";
      const nb=el("button","scopebtn"); nb.append(camDot(cm.id), cm.id, el("span","arrow","timeline ›"));
      nb.title="Show this scope's timeline"; nb.setAttribute("aria-label",cm.id+": show its timeline");
      nb.addEventListener("click",()=>paintScopeCard(cm.id));
      h.append(nb);
      if(ss.length) h.append(el("span","sub","last on "+fmtDY(ss[0].night)));
      col.append(h);
      if(!ss.length) col.append(el("div","sub","no sessions recorded"));
      for(const s of ss){
        const b=el("button","pcard");
        b.append(el("div","p-t",s.target));
        const m=el("div","p-m");
        m.append(el("b",null,fmtDY(s.night)), el("span",null,"· "+(s.hours>0?fmtH(s.hours,2):"exposure unrecorded")+" · "+fmtI(s.frames)+" frame"+(s.frames===1?"":"s")));
        const fl=Object.keys(s.filters||{}).filter(k=>k!=="unrecorded").map(filtLabel).join(", ");
        if(fl) m.append(el("span",null,"· "+fl));
        if(s.cal) m.append(el("span",null,"· "+calText(s.cal)));
        b.append(m);
        b.addEventListener("click",()=>openTarget(s.target));
        col.append(b);
      }
      body.append(col);
    }
    return;
  }
  /* one scope: its projects on a real calendar */
  const cm=CAMORDER.find(c=>c.id===cam)||{id:cam,short:cam};
  head.textContent="What the "+cm.id+" has been doing";
  sub.textContent="one row per object, a dot per session (bigger is more hours) · the shaded band is the quiet period: a dataset whose last dot leaves it becomes To process · click an object for its story";
  body.style.display="block";
  const all=SESS.filter(s=>s.camera===cam).sort((a,b)=>a.night.localeCompare(b.night));
  const bar=el("div","scopehead");
  const back=el("button","tbtn","‹ all scopes"); back.addEventListener("click",()=>paintScopeCard(null)); bar.append(back);
  const nm=el("span","sname"); nm.append(camDot(cam), cm.id); bar.append(nm);
  const sc=D.scopes.find(z=>z.camera===cam);
  if(sc) bar.append(el("span","sub",fmtH(sc.hours)+" · "+fmtI(sc.frames)+" frames · "+sc.nights+" nights · on the sky "+fmtDY(sc.first)+" to "+fmtDY(sc.last)));
  const rangeBox=el("div","range"); bar.append(rangeBox);
  body.append(bar);
  const plot=el("div","skywrap"); plot.style.marginTop="10px"; body.append(plot);
  if(!all.length){ plot.append(el("p","sub","No sessions recorded on this scope.")); return; }
  const end=[D.asOfNight, all[all.length-1].night].filter(Boolean).sort().pop();
  const first=all[0].night;
  const spanAll=Math.max(30, nightIdx(end,first)+1);
  const RANGES=[["90","90 nights",90],["365","a year",365],["all","all time",spanAll]];
  let range=mem.scopeRange||"90";
  if(!RANGES.some(r=>r[0]===range)) range="90";
  for(const [id,label] of RANGES){
    const b=el("button","tbtn",label); b.setAttribute("aria-pressed",id===range?"true":"false");
    b.addEventListener("click",()=>{ range=id; mem.scopeRange=id; remember(); for(const x of rangeBox.children) x.setAttribute("aria-pressed",x===b?"true":"false"); draw(); });
    rangeBox.append(b);
  }
  function draw(){
    plot.replaceChildren();
    const N=RANGES.find(r=>r[0]===range)[2];
    const start=nightAdd(end,-(N-1));
    const inRange=all.filter(s=>s.night>=start);
    if(!inRange.length){
      const latest=all[all.length-1];
      const p=el("p","sub","Nothing in the last "+N+" nights on this scope. The latest session is "+latest.target+" on "+fmtDY(latest.night)+".");
      const b=el("button","tbtn","show all time"); b.style.marginLeft="8px";
      b.addEventListener("click",()=>{ range="all"; mem.scopeRange="all"; remember(); for(const x of rangeBox.children) x.setAttribute("aria-pressed",x.textContent==="all time"?"true":"false"); draw(); });
      p.append(b); plot.append(p); return;
    }
    /* lanes: each object, newest session first; the top lane is the scope's activity night by night */
    const byT=new Map();
    for(const s of inRange){ let a=byT.get(s.target); if(!a){ a=[]; byT.set(s.target,a); } a.push(s); }
    const lanes=[...byT.entries()].map(([name,ss])=>({name,ss,last:ss[ss.length-1].night,hours:ss.reduce((a,b)=>a+b.hours,0)}))
      .sort((a,b)=>b.last.localeCompare(a.last)||b.hours-a.hours);
    const MAXL=40, shown=lanes.slice(0,MAXL);
    const W=1000, x0=176, x1=986, laneH=30, topH=58, actH=44;
    const dayW=(x1-x0)/N;
    const X=i=>x0+i*dayW+dayW/2;
    const yA=topH, yL=yA+actH+8;
    const H=yL+shown.length*laneH+22;
    const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",role:"img","aria-label":"Sessions on the "+cm.id+" by object, last "+N+" nights"});
    svg.style.minWidth=(N>120?760:560)+"px";
    const quiet=D.quietPeriodDays||14, qn=Math.min(quiet,N);
    const qx=X(Math.max(0,N-qn))-dayW/2;
    svg.append(svgEl("rect",{x:qx,y:yA-6,width:x1-qx,height:H-yA-10,fill:"var(--wash)",rx:3}));
    const qt=svgEl("text",{x:x1,y:yA-28,"text-anchor":"end",class:"axis mono"}); qt.textContent="quiet period: the last "+quiet+" nights"+(quiet>N?" (wider than this view)":""); svg.append(qt);
    /* month lines and labels */
    let lastM="";
    for(let i=0;i<N;i++){
      const iso=nightAdd(start,i), ym=iso.slice(0,7);
      if(ym===lastM) continue;
      lastM=ym;
      if(i>0||N<=120){
        const x=X(i)-dayW/2;
        svg.append(svgEl("line",{x1:x,x2:x,y1:yA-6,y2:H-12,class:"gridline"}));
        if(N<=120 || iso.slice(8)==="01" || i===0){
          const t=svgEl("text",{x:x+3,y:yA-10,class:"axis mono"});
          t.textContent=MONTHS[+iso.slice(5,7)-1]+(iso.slice(5,7)==="01"||i===0?" "+iso.slice(0,4):""); svg.append(t);
        }
      }
    }
    const nowX=X(N-1)+dayW/2;
    svg.append(svgEl("line",{x1:nowX,x2:nowX,y1:yA-6,y2:H-12,stroke:"var(--ink2)","stroke-dasharray":"2 3"}));
    const nt=svgEl("text",{x:nowX-3,y:H-2,"text-anchor":"end",class:"axis mono"}); nt.textContent=fmtDY(end); svg.append(nt);
    const st0=svgEl("text",{x:x0,y:H-2,class:"axis mono"}); st0.textContent=fmtDY(start); svg.append(st0);
    /* activity lane: hours per night */
    const perN=new Map();
    for(const s of inRange){ const a=perN.get(s.night)||{hours:0,frames:0,targets:[]}; a.hours+=s.hours; a.frames+=s.frames; a.targets.push(s); perN.set(s.night,a); }
    const maxN=Math.max(...[...perN.values()].map(a=>a.hours),0.1);
    const la=svgEl("text",{x:8,y:yA+actH/2+4,class:"dlabel strong"}); la.textContent="Every night"; svg.append(la);
    const la2=svgEl("text",{x:8,y:yA+actH/2+18,class:"axis mono"}); la2.textContent=perN.size+" night"+(perN.size===1?"":"s")+" · "+fmtH(inRange.reduce((a,b)=>a+b.hours,0)); svg.append(la2);
    svg.append(svgEl("line",{x1:x0,x2:x1,y1:yA+actH,y2:yA+actH,class:"baseline"}));
    let di=0;
    for(const [night,a] of [...perN.entries()].sort()){
      const i=nightIdx(night,start), bw=Math.max(2,dayW-1.5);
      const h=Math.max(2,a.hours/maxN*(actH-6));
      const r=svgEl("rect",{x:X(i)-bw/2,y:yA+actH-h,width:bw,height:h,rx:1,class:"tl-dot",tabindex:"0",role:"img",
        "aria-label":fmtDY(night)+" · "+(CAMSHORT[cam]||cam)+" · "+(a.hours>0?fmtH(a.hours,2):fmtI(a.frames)+" frames")});
      r.style.animationDelay=(di++*6)+"ms";
      svgCamFill(r,cam);
      hoverable(r,box=>{
        box.append(el("div","tt-t",fmtDY(night)));
        ttRow(box,"this scope",(a.hours>0?fmtH(a.hours,2):"exposure unrecorded")+" · "+fmtI(a.frames)+" frames",cam);
        for(const s of a.targets) ttRow(box,s.target,s.hours>0?fmtH(s.hours,2):fmtI(s.frames)+" frames");
      });
      r.addEventListener("click",()=>openTarget(a.targets.sort((p,q)=>q.hours-p.hours)[0].target));
      svg.append(r);
    }
    /* object lanes */
    const maxH=Math.max(...inRange.map(s=>s.hours),0.1);
    const rMax=Math.min(11,laneH/2-3);
    const rOf=h=>h>0?2.5+(rMax-2.5)*Math.sqrt(Math.min(h,maxH)/maxH):3.5;
    shown.forEach((ln,li)=>{
      const y=yL+li*laneH, mid=y+laneH/2;
      const g=svgEl("g",{class:"tl-lane",tabindex:"0",role:"button","aria-label":ln.name+": "+ln.ss.length+" session"+(ln.ss.length===1?"":"s")+", "+fmtH(ln.hours)+", latest "+fmtDY(ln.last)});
      if(li%2===0) g.append(svgEl("rect",{x:0,y:y,width:W,height:laneH,fill:"var(--wash)",rx:4}));
      const t=byName[ln.name], cd=t&&t.statusCards.find(c=>c.camera===cam);
      const lab=svgEl("text",{x:8,y:mid+4,class:"dlabel strong"});
      lab.textContent=ln.name.length>24?ln.name.slice(0,23)+"…":ln.name; g.append(lab);
      if(ln.name.length>24){ const ti=svgEl("title"); ti.textContent=ln.name; lab.append(ti); }
      g.append(svgEl("line",{x1:x0,x2:x1,y1:mid,y2:mid,class:"gridline"}));
      /* a thin line joins the sessions, so a project's span reads at a glance */
      if(ln.ss.length>1){
        const sp=svgEl("line",{x1:X(nightIdx(ln.ss[0].night,start)),x2:X(nightIdx(ln.last,start)),y1:mid,y2:mid,"stroke-width":"2"});
        svgCamFill(sp,cam); sp.setAttribute("stroke",sp.getAttribute("fill")); sp.setAttribute("opacity","0.45"); g.append(sp);
      }
      for(const s of ln.ss){
        const i=nightIdx(s.night,start);
        const c=svgEl("circle",{cx:X(i),cy:mid,r:rOf(s.hours),class:"tl-dot",tabindex:"0",role:"img",
          "aria-label":s.target+" · "+(CAMSHORT[cam]||cam)+" · "+(s.hours>0?fmtH(s.hours,2):fmtI(s.frames)+" frames")+" · "+fmtDY(s.night)});
        c.style.animationDelay=Math.round(i/N*420)+"ms";
        svgCamFill(c,cam);
        if(!(s.hours>0)){ c.setAttribute("fill","none"); c.setAttribute("stroke",camFillOf(cam).hex||"var("+(camFillOf(cam).v||"--muted")+")"); c.setAttribute("stroke-width","1.5"); }
        hoverable(c,box=>{
          box.append(el("div","tt-t",s.target+" · "+fmtDY(s.night)));
          ttRow(box,CAMSHORT[cam]||cam,s.hours>0?fmtH(s.hours,2):"exposure unrecorded",cam);
          ttRow(box,"frames",fmtI(s.frames));
          const f=Object.keys(s.filters||{}).filter(k=>k!=="unrecorded").map(filtLabel).join(", "); if(f) ttRow(box,"filter",f);
          if(s.cal) ttRow(box,"calibration",calText(s.cal));
        });
        g.append(c);
      }
      /* the dataset's state, at the right */
      if(cd){
        const stg=stageOf(cd.state);
        const dot=svgEl("circle",{cx:x1+4,cy:mid,r:4,fill:stg.outline?"none":"var("+stg.v+")"});
        if(stg.outline) { dot.setAttribute("stroke","var("+stg.v+")"); dot.setAttribute("stroke-width","1.5"); }
        const ti=svgEl("title"); ti.textContent=stg.label+(cd.readyOn&&cd.state==="captured"?" · ready from "+fmtDY(cd.readyOn):"")+(cd.evidence?" · "+cd.evidence:""); dot.append(ti);
        g.append(dot);
      }
      const open=()=>openTarget(ln.name);
      g.addEventListener("click",open);
      g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
      svg.append(g);
    });
    plot.append(svg);
    const foot=el("div","sub"); foot.style.marginTop="8px";
    foot.textContent=lanes.length+" object"+(lanes.length===1?"":"s")+" on this scope in the last "+N+" nights"+(lanes.length>MAXL?" (the "+MAXL+" most recent shown; the Targets tab lists them all)":"")+" · the dot at the right is the dataset's state: "+STAGES.filter(s=>["captured","stacked","processing","complete"].includes(s.id)).map(s=>s.label).join(", ");
    plot.append(foot);
    plot.append(legendRow([{label:"Still capturing",v:"--st-captured"},{label:"To process",v:"--st-stacked"},{label:"In progress",v:"--st-processing"},{label:"Done",v:"--st-complete"}]));
  }
  draw();
}

RENDER.overview = function(root){
  if(!TG.length){ root.append(el("p","sub","Nothing to show yet: no light frames were counted. Once frames have been imported and shipped, the Observatory fills in.")); return; }
  /* what each scope captured last: the last three sessions per scope (a session is
     one object on one night; with UK skies that can be days apart, so sessions, not nights) */
  const ls=el("div","card"); ls.id="scopecard";
  const lsHead=el("h2","sec","What each scope captured last");
  const lsSub=el("div","sub","the last three sessions on each scope, newest first · a session is one object on one night · click one for the object, or a scope's name for its timeline");
  ls.append(lsHead, lsSub);
  const lsg=el("div"); lsg.style.marginTop="12px"; ls.append(lsg);
  SCOPECARD={card:ls, head:lsHead, sub:lsSub, body:lsg};
  paintScopeCard(null);
  root.append(ls);
  /* what to process next: first, under the hero */
  const q=el("div","card"); q.style.marginTop="14px";
  q.append(el("h2","sec","What to process next on the PC"));
  q.append(el("div","sub","worked out from your records · biggest first here; the To process tab lists the same datasets newest first, with Open buttons"));
  const qg=el("div"); qg.style.display="grid"; qg.style.gridTemplateColumns="repeat(auto-fit,minmax(230px,1fr))"; qg.style.gap="12px"; qg.style.marginTop="12px";
  let qAny=false;
  function qcol(stId, verb){
    const all=CARDS.filter(c=>c.state===stId).sort((a,b)=>(b.hours||0)-(a.hours||0)||(b.lights||0)-(a.lights||0));
    const cardsQ=all.slice(0,4);
    if(!cardsQ.length) return;
    qAny=true;
    const col=el("div");
    const h=el("div"); h.style.display="flex"; h.style.alignItems="center"; h.style.gap="7px"; h.style.marginBottom="6px";
    h.append(stageChip(stId), el("span","sub",verb)); col.append(h);
    for(const cd of cardsQ){
      const b=el("button","pcard");
      b.append(el("div","p-t",cd.target));
      const m=el("div","p-m"); m.append(camDot(cd.camera), el("span",null,CAMSHORT[cd.camera]||cd.camera));
      m.append(el("b",null, cd.hours>0 ? fmtH(cd.hours) : fmtI(cd.lights||0)+" frames (exposure unrecorded)"));
      if(cd.nights) m.append(el("span",null,"· "+cd.nights+" night"+(cd.nights===1?"":"s")));
      b.append(m);
      if(cd.action) b.append(el("div","p-act",cd.action));
      b.addEventListener("click",()=>openTarget(cd.target));
      col.append(b);
    }
    if(all.length>cardsQ.length){
      const more=el("button","tbtn","+"+(all.length-cardsQ.length)+" more: see Pipeline"); more.style.marginTop="8px";
      more.addEventListener("click",()=>go("pipeline")); col.append(more);
    }
    qg.append(col);
  }
  qcol("stacked","ready: no new frames for "+(D.quietPeriodDays||14)+" nights, nothing started");
  qcol("processing","started: a master is saved, no final yet");
  qcol("captured","still capturing");
  if(!qAny){
    const soon=CARDS.filter(c=>c.state==="captured"&&c.readyOn).map(c=>c.readyOn).sort()[0];
    qg.append(el("p","sub","Nothing is waiting. Everything is either still capturing"+(soon?" (the first is ready from "+fmtDY(soon)+")":"")+" or done."));
  }
  q.append(qg);
  root.append(q);

  /* the headline figure: interesting, not the job, so it sits below the two cards */
  const hero=el("div","card hero"); hero.style.marginTop="14px";
  const hl=el("div");
  const big=el("div","big"); big.append(fmtH(totalHours,1).replace(" h",""), el("small",null," hours of integration"));
  hl.append(big);
  const lede=el("p","lede");
  lede.append("Every light frame the importer knows about: ",
    el("b",null,fmtI(D.totals.lights)+" frames"), " across ",
    el("b",null,D.totals.targets+" targets"), " on ",
    el("b",null,fmtI(D.totals.nights)+" nights"), ", ",
    el("b",null,(CAMS.length===1?"one scope":CAMS.length===2?"two scopes":CAMS.length===3?"three scopes":CAMS.length===4?"four scopes":CAMS.length===5?"five scopes":CAMS.length+" scopes")), ".");
  hl.append(lede);
  hero.append(hl);
  const heroR=el("div");
  const camsBox=el("div"); camsBox.style.display="flex"; camsBox.style.flexDirection="column"; camsBox.style.gap="7px";
  for(const c of CAMS){
    const s=D.scopes.find(x=>x.camera===c.id); if(!s) continue;
    const row=el("button"); row.style.display="flex"; row.style.alignItems="center"; row.style.gap="9px"; row.style.fontSize="12.5px"; row.style.textAlign="left";
    row.title="Show this scope's timeline"; row.addEventListener("click",()=>openScope(c.id));
    row.append(camDot(c.id));
    const lab=el("span",null,c.short); lab.style.width="86px"; lab.style.color="var(--ink2)"; row.append(lab);
    const b=el("b",null,fmtH(s.hours)); b.style.width="76px"; b.style.textAlign="right"; b.style.fontVariantNumeric="tabular-nums"; row.append(b);
    const sub=el("span",null,fmtI(s.frames)+" frames · "+s.nights+" nights"); sub.style.color="var(--muted)"; sub.style.fontSize="11.5px"; row.append(sub);
    camsBox.append(row);
  }
  heroR.append(camsBox); hero.append(heroR);
  root.append(hero);

  /* what's new since the previous snapshot */
  if(D.delta && D.delta.addedFrames>0){
    const dl=D.delta;
    const nc=el("div","card"); nc.style.marginTop="14px";
    nc.style.borderLeft="3px solid var(--st-stacked)";
    nc.append(el("h2","sec","New since the previous snapshot"+(dl.prevGeneratedAt?" ("+dl.prevGeneratedAt+")":"")));
    const line=el("p"); line.style.fontSize="13.5px"; line.style.color="var(--ink2)"; line.style.marginTop="6px";
    line.append(el("b",null,"+"+fmtI(dl.addedFrames)+" light frames"), " and ",
      el("b",null,"+"+fmtH(dl.addedHours)), " across ",
      el("b",null,dl.newNights+" new nights"),
      ", latest night now "+fmtDY(dl.nowLatest)+".");
    for(const b of line.querySelectorAll("b")) b.style.color="var(--ink)";
    nc.append(line);
    const perScope=Object.entries(dl.addedByScope||{});
    if(perScope.length){
      const row=el("div"); row.style.display="flex"; row.style.gap="14px"; row.style.flexWrap="wrap"; row.style.margin="8px 0 2px";
      for(const [cam,n] of perScope){
        const li=el("span","li"); li.style.display="inline-flex"; li.style.alignItems="center"; li.style.gap="6px"; li.style.fontSize="12.5px"; li.style.color="var(--ink2)";
        li.append(camDot(cam), (CAMSHORT[cam]||cam)+" +"+fmtI(n));
        row.append(li);
      }
      nc.append(row);
    }
    if(dl.newTargets && dl.newTargets.length){
      const tl=el("div"); tl.style.display="flex"; tl.style.gap="7px"; tl.style.flexWrap="wrap"; tl.style.marginTop="10px";
      tl.append(el("span","sub",dl.newTargets.length+" new targets:"));
      for(const name of dl.newTargets){
        const ch=el("button","chip",name);
        ch.addEventListener("click",()=>openTarget(name));
        tl.append(ch);
      }
      nc.append(tl);
    }
    root.append(nc);
  }

  /* KPI row: the two that matter first, both a click away from the Pipeline */
  const kp=el("div","kpis");
  function kpi(label,val,sub,onClick){ const k=el(onClick?"button":"div","kpi"); k.append(el("div","k-label",label), el("div","k-val",val)); if(sub) k.append(el("div","k-sub",sub)); if(onClick){ k.style.textAlign="left"; k.style.cursor="pointer"; k.addEventListener("click",onClick); } kp.append(k); }
  kpi("To process", String(CARDS.filter(c=>c.state==="stacked").length), "objects (per scope) with no new frames for "+(D.quietPeriodDays||14)+" nights and nothing started", ()=>go("pipeline"));
  kpi("In progress", String(CARDS.filter(c=>c.state==="processing").length), "a master of yours is saved, no final yet", ()=>go("pipeline"));
  kpi("Light frames", fmtI(D.totals.lights), fmtGB(D.totals.bytes)+" of lights");
  kpi("Targets", String(D.totals.targets), TG.filter(t=>t.mosaic).length+" shot as mosaics");
  kpi("Nights out", String(D.totals.nights), D.scopes.length?fmtDY(D.scopes.reduce((a,s)=>a&&a<s.first?a:s.first,null))+" to "+fmtDY(D.scopes.reduce((a,s)=>a&&a>s.last?a:s.last,null)):"none yet");
  if(D.events.length) kpi("Sun, Moon, planets", String(D.events.filter(e=>e.date).length)+" days", "solar, lunar and planetary captures");
  root.append(kp);

  /* integration by scope, stacked */
  root.append(spacer(14));
  root.append(chartCard("Integration by scope", "hours of light-frame exposure per camera",
    c=>{
      const W=980,H=96,pad=8,bw=22;
      const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",role:"img","aria-label":"Stacked bar of integration hours by scope"});
      let x=pad; const total=D.scopes.reduce((a,s)=>a+s.hours,0);
      const scale=(W-2*pad-3*2)/(total||1);
      const y=18;
      for(const cam of CAMS){
        const s=D.scopes.find(z=>z.camera===cam.id); if(!s) continue;
        const w=Math.max(1.5,s.hours*scale);
        const r=svgEl("rect",{x:x,y:y,width:w,height:bw,rx:3});
        svgCamFill(r,cam.id);
        svg.append(r);
        hoverable(r,box=>{ box.append(el("div","tt-t",cam.id)); ttRow(box,"integration",fmtH(s.hours),cam.id); ttRow(box,"share",total>0?Math.round(s.hours/total*100)+"%":"—"); ttRow(box,"frames",fmtI(s.frames)); ttRow(box,"nights",String(s.nights)); });
        if(w>90){
          const t1=svgEl("text",{x:x+8,y:y+bw+20,class:"dlabel strong"}); t1.textContent=cam.short; svg.append(t1);
          const t2=svgEl("text",{x:x+8,y:y+bw+36,class:"dlabel"}); t2.textContent=fmtH(s.hours); svg.append(t2);
        }
        x+=w+2;
      }
      c.append(svg);
      c.append(legendRow(CAMS.map(cm=>({label:cm.id,cam:cm.id,kind:"sw"}))));
    },
    w=>simpleTable(w,["Scope","Hours","Frames","Nights","First night","Latest night","Lights on disk"],
      CAMS.map(cm=>{const s=D.scopes.find(z=>z.camera===cm.id);return s?[cm.id,s.hours.toFixed(1),fmtI(s.frames),s.nights,fmtDY(s.first),fmtDY(s.last),fmtGB(s.bytes)]:null}).filter(Boolean))
  ));

  /* top targets */
  const top=TG.slice().sort((a,b)=>b.hours-a.hours).slice(0,12);
  if(top.length) root.append(chartCard("Where the hours went", "top 12 targets by total integration, split by scope",
    c=>{
      const W=980,rowH=31,padL=196,padR=86,H=top.length*rowH+16;
      const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",role:"img","aria-label":"Top targets by hours"});
      const max=top[0].hours||1, scale=(W-padL-padR)/max;
      top.forEach((t,i)=>{
        const y=8+i*rowH;
        const name=svgEl("text",{x:padL-10,y:y+14.5,"text-anchor":"end",class:"dlabel strong"});
        name.textContent=t.name.length>26?t.name.slice(0,25)+"…":t.name; svg.append(name);
        let x=padL;
        for(const cam of CAMS){
          const h=t.camHours[cam.id]||0; if(h<=0.01) continue;
          const w=Math.max(1.5,h*scale-2);
          const r=svgEl("rect",{x:x,y:y,width:w,height:20,rx:3,tabindex:"0",role:"img","aria-label":t.name+" · "+cam.id+" · "+fmtH(h)});
          svgCamFill(r,cam.id);
          svg.append(r);
          hoverable(r,box=>{ box.append(el("div","tt-t",t.name)); ttRow(box,cam.id,fmtH(h),cam.id); ttRow(box,"total",fmtH(t.hours)); ttRow(box,"nights",String(t.nights)); });
          r.addEventListener("click",()=>openTarget(t.name));
          r.style.cursor="pointer";
          x+=w+2;
        }
        const v=svgEl("text",{x:x+7,y:y+14.5,class:"dlabel"}); v.textContent=t.hours.toFixed(1)+" h"; svg.append(v);
      });
      c.append(svg);
      c.append(legendRow(CAMS.map(cm=>({label:cm.id,cam:cm.id,kind:"sw"}))));
    },
    w=>simpleTable(w,["Target","Hours","Nights","Frames","Scopes"],
      top.map(t=>[t.name,t.hours.toFixed(1),t.nights,fmtI(t.lights),t.cameras.map(c=>CAMSHORT[c]||c).join(", ")]))
  ));


  /* events strip */
  if(!D.events.length) return;
  const ev=el("div","card");
  ev.append(el("h2","sec","Sun, Moon and planets"));
  const evLine=el("div","sub");
  const solar=D.events.filter(e=>e.kind==="Solar"&&e.date).length;
  const lunar=D.events.filter(e=>e.kind==="Lunar"&&e.date).length;
  const planets=[...new Set(D.events.filter(e=>e.kind==="Planetary"&&e.body!=="Planetary").map(e=>e.body))];
  const pDays=D.events.filter(e=>e.kind==="Planetary"&&e.date).length;
  evLine.textContent="Outside deep sky: "+solar+" solar days (S50 and S30 Pro), "+lunar+" lunar days, and "+pDays+" planetary days ("+planets.join(", ")+"), kept as video and stills alongside the archives.";
  ev.append(evLine);
  root.append(ev);
};
function spacer(px){ const s=el("div"); s.style.height=px+"px"; return s; }
function legendRow(items){
  const lg=el("div","legend"); lg.style.marginTop="10px";
  for(const it of items){
    const li=el("span","li");
    const sw=el("span",it.kind==="lk"?"lk":"sw");
    if(it.cam) paintSwatch(sw,it.cam); else sw.style.background="var("+it.v+")";
    li.append(sw, it.label); lg.append(li);
  }
  return lg;
}

/* ================= TARGETS ================= */
RENDER.targets = function(root){
  const tb=el("div","toolbar");
  const search=el("input"); search.type="search"; search.placeholder="Search targets or codes"; search.setAttribute("aria-label","Search targets");
  tb.append(search);
  const camSel=new Set(), stSel=new Set();
  const chipBox=el("div"); chipBox.style.display="flex"; chipBox.style.gap="6px"; chipBox.style.flexWrap="wrap";
  for(const cm of CAMS){
    const ch=el("button","chip"); ch.append(camDot(cm.id), cm.short);
    ch.setAttribute("aria-pressed","false");
    ch.addEventListener("click",()=>{ camSel.has(cm.id)?camSel.delete(cm.id):camSel.add(cm.id); ch.classList.toggle("sel"); ch.setAttribute("aria-pressed",ch.classList.contains("sel")); paint(); });
    chipBox.append(ch);
  }
  for(const st of STAGES){
    if(st.id==="todo") continue;
    const ch=el("button","chip"); const d=el("span","dot"); d.style.background="var("+st.v+")"; ch.append(d, st.label);
    ch.setAttribute("aria-pressed","false");
    ch.addEventListener("click",()=>{ stSel.has(st.id)?stSel.delete(st.id):stSel.add(st.id); ch.classList.toggle("sel"); ch.setAttribute("aria-pressed",ch.classList.contains("sel")); paint(); });
    chipBox.append(ch);
  }
  tb.append(chipBox);
  const sort=el("select"); sort.setAttribute("aria-label","Sort targets");
  [["hours","Sort: hours"],["nights","Sort: nights"],["lights","Sort: frames"],["last","Sort: most recent"],["name","Sort: name"]].forEach(([v,l])=>{const o=el("option",null,l);o.value=v;sort.append(o);});
  tb.append(sort);
  const count=el("span","tcount"); tb.append(count);
  root.append(tb);

  const head=el("div","thead");
  ["Target","Type · constellation","Scopes","State (the scope furthest behind)","Hours","Nights","Frames","Latest"].forEach((h,i)=>{
    const s=el("span",i>=4?"num":null,h); head.append(s);
  });
  root.append(head);
  const list=el("div","trows"); root.append(list);

  function paint(){
    const qy=search.value.trim().toLowerCase();
    let rows=TG.filter(t=>{
      if(qy && !(t.name.toLowerCase().includes(qy) || t.codes.join(" ").toLowerCase().includes(qy))) return false;
      if(camSel.size && !t.cameras.some(c=>camSel.has(c))) return false;
      if(stSel.size && !t.statusCards.some(c=>stSel.has(c.state))) return false;
      return true;
    });
    const k=sort.value;
    rows.sort((a,b)=> k==="name" ? a.name.localeCompare(b.name)
      : k==="last" ? String(b.lastNight).localeCompare(String(a.lastNight))
      : (b[k]||0)-(a[k]||0));
    list.replaceChildren();
    count.textContent=rows.length+" of "+TG.length+" targets";
    for(const t of rows){
      const r=el("button","trow");
      const c1=el("div"); c1.append(el("div","tname",t.name));
      if(t.codes.length||t.mosaic){ const cd=el("div","tcodes",[...t.codes, ...(t.mosaic?["mosaic programme"]:[])].join(" · ")); c1.append(cd); }
      r.append(c1);
      r.append(el("div","tmeta",[t.type,t.constellation].filter(Boolean).join(" · ")||"·"));
      const dots=el("div"); dots.style.display="flex"; dots.style.gap="5px";
      for(const cm of CAMS) if(t.cameras.includes(cm.id)) dots.append(camDot(cm.id));
      r.append(dots);
      const stc=el("div"); stc.append(stageChip(t.state)); r.append(stc);
      const n1=el("div","num"); n1.append(el("b",null,t.hours.toFixed(1))); r.append(n1);
      r.append(el("div","num",String(t.nights)));
      r.append(el("div","num",fmtI(t.lights)));
      r.append(el("div","num",fmtDY(t.lastNight)));
      r.addEventListener("click",()=>openTarget(t.name));
      list.append(r);
    }
  }
  search.addEventListener("input",paint);
  sort.addEventListener("change",paint);
  paint();
};

/* ================= COVERAGE MATRIX =================
   One glance answers: have I shot this target with this scope?
   Cells aggregate the session list, so the Askar rig split flows through. */
RENDER.coverage = function(root){
  const AGG=new Map();
  for(const s of SESS){
    let m=AGG.get(s.target); if(!m){ m={}; AGG.set(s.target,m); }
    const a=m[s.camera]||(m[s.camera]={hours:0,frames:0,nights:new Set(),first:s.night,last:s.night});
    a.hours+=s.hours; a.frames+=s.frames; a.nights.add(s.night);
    if(s.night<a.first)a.first=s.night; if(s.night>a.last)a.last=s.night;
  }
  const cols=CAMS;
  const gridCols="minmax(210px,1.5fr) repeat("+cols.length+",minmax(92px,1fr)) 56px";

  const intro=el("div","sub");
  intro.style.marginBottom="12px";
  intro.textContent="Every target against every scope, one glance. A filled cell means light frames exist: integration hours, or the frame count where the exposure went unrecorded. The chips count each scope's targets. Click a row for the full story.";
  root.append(intro);

  const summ=el("div","mxsum");
  for(const cm of cols){
    const n=TG.filter(t=>AGG.get(t.name)&&AGG.get(t.name)[cm.id]).length;
    const ch=el("span","chip"); ch.append(camDot(cm.id), CAMSHORT[cm.id]+" "+n+" of "+TG.length);
    summ.append(ch);
  }
  root.append(summ);

  const tb=el("div","toolbar");
  const search=el("input"); search.type="search"; search.placeholder="Search targets or codes"; search.setAttribute("aria-label","Search coverage matrix");
  tb.append(search);
  const gaps=el("button","tbtn","gaps only"); gaps.setAttribute("aria-pressed","false");
  gaps.addEventListener("click",()=>{ const on=gaps.getAttribute("aria-pressed")!=="true"; gaps.setAttribute("aria-pressed",String(on)); paint(); });
  tb.append(gaps);
  const sort=el("select"); sort.setAttribute("aria-label","Sort coverage matrix");
  [["name","Sort: name"],["hours","Sort: hours"],["most","Sort: most scopes"],["fewest","Sort: fewest scopes"],["last","Sort: most recent"]].forEach(([v,l])=>{const o=el("option",null,l);o.value=v;sort.append(o);});
  tb.append(sort);
  const count=el("span","tcount"); tb.append(count);
  root.append(tb);

  const wrap=el("div","mxwrap"), mx=el("div","mx");
  mx.style.minWidth=(210+cols.length*92+56+(cols.length+2)*6+24)+"px";
  const head=el("div","mxhead"); head.style.gridTemplateColumns=gridCols;
  head.append(el("span",null,"Target"));
  for(const cm of cols){ const c=el("span","mxcol"); c.append(camDot(cm.id), CAMSHORT[cm.id]); head.append(c); }
  head.append(el("span","mxcol end","of "+cols.length));
  mx.append(head);
  const list=el("div"); mx.append(list); wrap.append(mx); root.append(wrap);

  function covOf(t){ const m=AGG.get(t.name)||{}; return cols.filter(cm=>m[cm.id]).length; }
  function paint(){
    const qy=search.value.trim().toLowerCase(), gOn=gaps.getAttribute("aria-pressed")==="true";
    let rows=TG.filter(t=>{
      if(qy && !(t.name.toLowerCase().includes(qy)||t.codes.join(" ").toLowerCase().includes(qy))) return false;
      if(gOn && covOf(t)>=cols.length) return false;

      return true;
    });
    const k=sort.value;
    rows.sort((a,b)=> k==="name" ? a.name.localeCompare(b.name)
      : k==="hours" ? (b.hours||0)-(a.hours||0)
      : k==="most" ? covOf(b)-covOf(a)||(b.hours||0)-(a.hours||0)
      : k==="fewest" ? covOf(a)-covOf(b)||(b.hours||0)-(a.hours||0)
      : String(b.lastNight).localeCompare(String(a.lastNight)));
    list.replaceChildren();
    let shot=0; rows.forEach(t=>shot+=covOf(t));
    count.textContent=rows.length+" of "+TG.length+" targets · "+shot+" of "+(rows.length*cols.length)+" cells filled";
    for(const t of rows){
      const m=AGG.get(t.name)||{};
      const r=el("button","mxrow"); r.style.gridTemplateColumns=gridCols;
      const c1=el("div"); c1.append(el("div","tname",t.name));
      if(t.codes.length){ c1.append(el("div","tcodes",t.codes.join(" · "))); }
      r.append(c1);
      const said=[];
      for(const cm of cols){
        const a=m[cm.id];
        const cell=el("span","mxcell"+(a?"":" off"));
        if(a){
          const f=camFillOf(cm.id);
          cell.style.background="color-mix(in srgb, "+(f.hex?f.hex:"var("+f.v+")")+" 14%, transparent)";
          const d=el("span","dot"); paintSwatch(d,cm.id); cell.append(d);
          const label=a.hours>0 ? (a.hours>=100?Math.round(a.hours)+" h":a.hours.toFixed(1)+" h") : (a.frames>0 ? fmtI(a.frames)+" fr" : "stacks");
          cell.append(el("b",null,label));
          said.push(CAMSHORT[cm.id]+" "+label);
          hoverable(cell, box=>{
            box.append(el("div","tt-t",t.name+" · "+cm.id));
            ttRow(box,"integration", a.hours>0?fmtH(a.hours):"exposure unrecorded", cm.id);
            ttRow(box,"frames", fmtI(a.frames));
            ttRow(box,"nights", String(a.nights.size));
            ttRow(box,"span", fmtDY(a.first)+(a.last!==a.first?" to "+fmtDY(a.last):""));
          });
        }else{
          cell.textContent="·";
          hoverable(cell, box=>{
            box.append(el("div","tt-t",t.name));
            ttRow(box,"not shot with", CAMSHORT[cm.id], cm.id);
          });
        }
        r.append(cell);
      }
      r.append(el("span","mxn",covOf(t)+"/"+cols.length));
      r.setAttribute("aria-label", t.name+": "+(said.length?said.join(", "):"no data")+"; "+covOf(t)+" of "+cols.length+" scopes");
      r.addEventListener("click",()=>openTarget(t.name));
      list.append(r);
    }
  }
  search.addEventListener("input",paint);
  sort.addEventListener("change",paint);
  paint();
};
</script>
<script>
"use strict";
/* ================= TARGET DRAWER ================= */
const drawer=document.getElementById("drawer"), scrim=document.getElementById("scrim");
let lastFocus=null;
function showDrawer(){
  if(!drawer.classList.contains("open")) lastFocus=document.activeElement;
  ttHide();
  scrim.style.display="block";
  drawer.classList.add("open");
  drawer.setAttribute("role","dialog"); drawer.setAttribute("aria-modal","true");
  document.body.style.overflow="hidden";
  drawer.scrollTop=0;
  const c=drawer.querySelector(".close"); if(c) c.focus();
}
function closeDrawer(){
  drawer.classList.remove("open"); scrim.style.display="none";
  document.body.style.overflow=""; ttHide();
  if(lastFocus && document.contains(lastFocus) && lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} }
  lastFocus=null;
}
scrim.addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });

/* Buttons ask the panel that frames this page; alone in a browser they can only say so.
   Messages go to, and come from, the same origin only (a file: page has none, so it never posts). */
const SAME=(location.origin&&location.origin!=="null")?location.origin:null;
const OPEN_SAID=new Map();
function ask(msg){
  if(window.parent===window || !SAME){ const s=OPEN_SAID.get(msg.rel); if(s) s.textContent="Open this page from the importer's Observatory tab to use the buttons."; return; }
  try{ window.parent.postMessage(msg, SAME); }catch(e){}
}
window.addEventListener("message",e=>{
  if(!SAME || e.origin!==SAME || e.source!==window.parent || !e.data || e.data.kind!=="archive-opened") return;
  const s=OPEN_SAID.get(e.data.rel); if(s) s.textContent=e.data.ok?"Opened.":("Couldn't open: "+(e.data.error||"see the panel"));
});
function openTarget(name){
  const t=byName[name]; if(!t) return;
  OPEN_SAID.clear();
  drawer.replaceChildren();
  const close=el("button","close","Close"); close.addEventListener("click",closeDrawer); drawer.append(close);
  drawer.append(el("div","eyebrow",[t.type||"target",t.constellation,...t.codes].filter(Boolean).join(" · ")));
  drawer.append(el("h3",null,t.name));

  const scopeNames=t.cameras.map(c=>CAMSHORT[c]||c);
  const ans=el("p","answer");
  ans.append("Imaged on ", el("b",null,t.nights+" night"+(t.nights===1?"":"s")),
    " with ", el("b",null,scopeNames.length+" scope"+(scopeNames.length===1?"":"s")),
    " ("+scopeNames.join(", ")+"): ",
    el("b",null,fmtI(t.lights)+" light frames"), ", ",
    el("b",null,fmtH(t.hours)), " of integration, ",
    String(t.sessions)+" sessions, first night "+fmtDY(t.firstNight)+", latest "+fmtDY(t.lastNight)+".");
  drawer.append(ans);
  const chips=el("div"); chips.style.display="flex"; chips.style.gap="7px"; chips.style.flexWrap="wrap"; chips.style.margin="6px 0 2px";
  chips.append(stageChip(t.state));
  if(t.mosaic){ const b=el("span","badge","mosaic"); chips.append(b); }
  if(t.ra==null) chips.append(el("span","badge", (t.type&&/comet|asteroid|moving/i.test(t.type)) ? "moving target, not on the sky map" : "no sky position in contract/targets.json yet, so not on the sky map"));
  drawer.append(chips);

  /* per-night sessions chart */
  const ts=SESS.filter(s=>s.target===t.name).sort((a,b)=>a.night.localeCompare(b.night));
  if(ts.length){
    const cardC=chartCard("Sessions, night by night","each bar is one scope on one night; height is hours",
      c=>{
        const n=ts.length, W=650, padL=40, padB=34, padT=12;
        const bw=Math.max(4,Math.min(20,(W-padL-10)/n-2));
        const plotW=n*(bw+2), Wv=Math.max(W,padL+plotW+12);
        const maxH=Math.max(...ts.map(s=>s.hours), 0.2);
        const Hpl=150, Hv=Hpl+padT+padB;
        const svg=svgEl("svg",{viewBox:"0 0 "+Wv+" "+Hv,width:"100%",role:"img","aria-label":"Session hours for "+t.name});
        for(const gv of niceTicks(maxH,3)){
          const y=padT+Hpl-gv/maxH*Hpl;
          svg.append(svgEl("line",{x1:padL,x2:padL+plotW,y1:y,y2:y,class:"gridline"}));
          const tx=svgEl("text",{x:padL-6,y:y+3.5,"text-anchor":"end",class:"axis mono"}); tx.textContent=gv; svg.append(tx);
        }
        svg.append(svgEl("line",{x1:padL,x2:padL+plotW,y1:padT+Hpl,y2:padT+Hpl,class:"baseline"}));
        let lastYr="";
        ts.forEach((s,i)=>{
          const x=padL+i*(bw+2);
          const h=Math.max(1.5,s.hours/maxH*Hpl);
          const r=svgEl("rect",{x:x,y:padT+Hpl-h,width:bw,height:h,rx:Math.min(3,bw/3),tabindex:"0",role:"img",
            "aria-label":fmtDY(s.night)+" · "+(CAMSHORT[s.camera]||s.camera)+" · "+(s.stackOnly?"auto-stack only":fmtH(s.hours))});
          svgCamFill(r,s.camera);
          if(s.stackOnly) r.setAttribute("opacity","0.45");
          svg.append(r);
          hoverable(r,box=>{
            box.append(el("div","tt-t",fmtDY(s.night)));
            ttRow(box,CAMSHORT[s.camera]||s.camera, s.stackOnly?"auto-stack only":fmtH(s.hours), s.camera);
            if(!s.stackOnly){ ttRow(box,"frames",fmtI(s.frames)); const f=Object.keys(s.filters).join(", "); if(f) ttRow(box,"filter",f); if(s.cal) ttRow(box,"calibration",calText(s.cal)); }
            if(s.rig && s.camera==="ASIAir") ttRow(box,"rig",CAMSHORT[s.rig]||s.rig, s.rig);
          });
          const yr=s.night.slice(0,4);
          if(yr!==lastYr){ lastYr=yr; const tx=svgEl("text",{x:x,y:padT+Hpl+16,class:"axis mono"}); tx.textContent=yr; svg.append(tx);
            const mk=svgEl("line",{x1:x-1,x2:x-1,y1:padT+Hpl,y2:padT+Hpl+5,class:"baseline"}); svg.append(mk); }
        });
        c.append(svg);
        c.append(legendRow(CAMS.filter(cm=>ts.some(s=>s.camera===cm.id)).map(cm=>({label:cm.id,cam:cm.id,kind:"sw"}))));
      },
      w=>simpleTable(w,["Night","Scope","Frames","Hours","Filters","Calibration"],
        ts.map(s=>[fmtDY(s.night),CAMSHORT[s.camera]||s.camera,s.stackOnly?"stack only":fmtI(s.frames),s.hours.toFixed(2),Object.keys(s.filters).join(", ")||"·",calText(s.cal)]))
    );
    cardC.style.marginTop="14px";
    drawer.append(cardC);
  }

  /* programmes */
  const ph=el("h2","sec","By scope"); ph.style.margin="16px 0 2px"; drawer.append(ph);
  for(const p of t.programmes.slice().sort((a,b)=>b.hours-a.hours)){
    const box=el("div","prog");
    const h=el("div","p-h");
    h.append(camDot(p.camera), el("span",null,p.camera));
    if(p.mosaic) h.append(el("span","badge","mosaic"));
    const card=t.statusCards.find(c=>c.camera===p.camera);
    if(card) h.append(stageChip(card.state));
    if(p.collected) h.append(el("span","badge","Collect Lights: collected"));
    box.append(h);
    const st=el("div","p-stats");
    function stat(lbl,val){ if(val==null||val==="")return; const s2=el("span"); s2.append(lbl+" "); s2.append(el("b",null,String(val))); st.append(s2); }
    stat("lights",fmtI(p.lights));
    if(p.hours>0) stat("hours",p.hours.toFixed(1));
    stat("nights",p.nights);
    if(p.firstNight) stat("span",fmtDY(p.firstNight)+" to "+fmtDY(p.lastNight));
    if(p.autostacks) stat("auto-stacks",p.autostacks+(p.autostackFrames?" ("+fmtI(p.autostackFrames)+" frames)":""));
    if(p.processedFiles) stat("processed files",p.processedFiles);
    if(p.masters) stat("masters",p.masters);
    if(p.working) stat("working copies",p.working);
    if(p.panels && p.panels.length) stat("mosaic panels",p.panels.length);
    if(p.calibration && p.calibration.applies!==false) stat("calibration", calText(p.calibration)+(p.calibration.nights?" over "+p.calibration.nights_with+" of "+p.calibration.nights+" night"+(p.calibration.nights===1?"":"s"):""));
    box.append(st);
    const fl=Object.entries(p.filters).sort((a,b)=>b[1]-a[1]).map(([k,v])=>filtLabel(k)+" x"+fmtI(v)).join(", ");
    if(fl){ const f2=el("div","p-stats"); const s3=el("span"); s3.append("filters "); s3.append(el("b",null,fl)); f2.append(s3);
      const ex=Object.entries(p.exposures).sort((a,b)=>(+b[0])-(+a[0])).filter(([k])=>+k>0).map(([k,v])=>(+k)+"s x"+fmtI(v)).join(", ");
      if(ex){ const s4=el("span"); s4.append("exposures "); s4.append(el("b",null,ex)); f2.append(s4); }
      box.append(f2);
    }
    if(p.camera==="ASIAir" && p.askar){
      const parts=Object.entries(p.askar).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+" x"+fmtI(v)).join(", ");
      if(parts){ const a2=el("div","p-stats"); const s5=el("span"); s5.append("rig "); s5.append(el("b",null,parts)); a2.append(s5); box.append(a2); }
    }
    if(card && card.evidence){ const evd=el("div","p-path"); evd.style.fontFamily="inherit"; evd.style.fontSize="11.5px"; evd.textContent="Why: "+card.evidence+(card.action?" · Next: "+card.action.toLowerCase():""); box.append(evd); }
    if(p.rel){
      box.append(el("div","p-path",p.path));
      const row=el("div","p-act-row");
      const opener=(D.inputs&&D.inputs.machine==="PC")?"Explorer":"Finder";
      const b1=el("button",null,"Open in "+opener), b2=el("button",null,"Show in To process"), said=el("span","said");
      b1.addEventListener("click",()=>{ said.textContent="Opening…"; ask({kind:"archive-open",rel:p.rel}); });
      b2.addEventListener("click",()=>{ ask({kind:"archive-show",rel:p.rel}); });
      row.append(b1,b2,said); box.append(row);
      OPEN_SAID.set(p.rel, said);
    } else {
      box.append(el("div","p-stats","not on the archive yet"));
    }
    drawer.append(box);
  }
  showDrawer();
}
/* what calibration a session has: null = the Seestar's own (none of ours needed) */
function calText(c){
  if(!c) return "Seestar: its own";
  if(!c.darks&&!c.flats&&!c.biases) return "none linked";
  return [c.darks?c.darks+" darks":"", c.flats?c.flats+" flats":"", c.biases?c.biases+" bias":""].filter(Boolean).join(" · ");
}
function filtLabel(f){ return f==="IRCUT"?"UV/IR Cut":f==="LP"?"LP dual-band":f==="wide-cam"?"wide camera":f; }
function niceTicks(max,n){ if(!(max>0)||!(n>0)) return []; const step=Math.pow(10,Math.floor(Math.log10(max/n))); const cands=[step,2*step,2.5*step,5*step,10*step];
  const s=cands.find(c=>max/c<=n)||10*step; const out=[]; for(let v=s;v<=max;v+=s) out.push(+v.toFixed(2)); return out; }

/* ================= PIPELINE ================= */
RENDER.pipeline = function(root){
  const intro=el("div","sub");
  intro.textContent="Every dataset (one object on one scope), placed by the facts the importer has: the sessions in the ledgers, the masters the PC's inventory found in the target's folder, and the finished pictures in Final Astro Images. Click a card for the full target.";
  intro.style.marginBottom="12px";
  root.append(intro);
  const camSel=new Set();
  const tb=el("div","toolbar");
  for(const cm of CAMS){
    const ch=el("button","chip"); ch.append(camDot(cm.id), cm.short); ch.setAttribute("aria-pressed","false");
    ch.addEventListener("click",()=>{ camSel.has(cm.id)?camSel.delete(cm.id):camSel.add(cm.id); ch.classList.toggle("sel"); ch.setAttribute("aria-pressed",ch.classList.contains("sel")); paint(); });
    tb.append(ch);
  }
  root.append(tb);
  const board=el("div","board"); root.append(board);
  const ORDER=["captured","stacked","processing","complete","todo","quarantined"];
  function paint(){
    board.replaceChildren();
    for(const stId of ORDER){
      let cds=CARDS.filter(c=>c.state===stId && (!camSel.size||camSel.has(c.camera)));
      if(!cds.length) continue;
      cds.sort((a,b)=>(b.hours||0)-(a.hours||0));
      const col=el("div","col");
      const h=el("h3"); h.append(stageChip(stId)); col.append(h);
      const hrs=cds.reduce((a,c)=>a+(c.hours||0),0);
      col.append(el("div","colsum",cds.length+" dataset"+(cds.length===1?"":"s")+" · "+hrs.toFixed(1)+" h invested"));
      for(const cd of cds){
        const b=el("button","pcard");
        b.append(el("div","p-t",cd.target));
        const m=el("div","p-m");
        m.append(camDot(cd.camera), el("span",null,CAMSHORT[cd.camera]||cd.camera));
        if(cd.hours!=null) m.append(el("b",null,fmtH(cd.hours)));
        if(cd.nights!=null) m.append(el("span",null,"· "+cd.nights+" n"));
        b.append(m);
