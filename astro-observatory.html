<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Astro Archive Observatory, served by the BrettjoAstro FITS Importer panel (1.7.2).
     Design: the Astro Archive Observatory artifact (Aug 2026), rebuilt to the merged
     specification of 17 Oct 2026 (docs/ux-observatory-16oct/SPEC.md). Data: the dataset
     slot is filled by the engine (observatory_html) from projects.json, the ledgers and
     the contract. Fonts are the system's: the panel loads nothing from the web. -->
<title>Astro Archive Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================================
   TOKENS. Type (R/type), colour (R/colour), motion (R/motion). Dark is the base;
   light is selected by the OS or the toggle. COLOUR MEANS SCOPE: a scope's colour
   comes only from D.scopes[].colour, set per element as --sc. Status is a glyph
   and a word; teal says alive, ink says do this, an outline says nothing to do.
   ========================================================================== */
:root{
  color-scheme: dark light;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px; --fs-hero:48px;
  --lh-display:1.1; --lh-heading:1.25; --lh-body:1.4; --lh-small:1.45;
  --fw-regular:400; --fw-semi:600; --fw-bold:700;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --card-pad:16px; --item-pad:12px; --section-gap:24px; --item-gap:8px;
  --container:1280px; --container-wide:1440px; --gutter:24px; --measure:72ch;
  --r-sm:6px; --r-md:10px; --r-pill:999px; --accent-bar:4px; --ctl-sm:24px; --ctl-md:32px; --tap:44px; --dot:10px; --ring-min:56px;

  /* surfaces: dark */
  --page:#0e1222; --card:#171c33; --card2:#1d2340; --line:#2c3356; --grid:#252c4a;
  --wash:rgba(241,239,232,.06); --wash2:rgba(241,239,232,.11); --track:#2a3152; --shadow:0 1px 2px rgba(0,0,0,.35);
  --ink:#f1efe8; --ink2:#c1c5d9; --muted:#959bba; --faint:#5f6584;
  /* the night sky: identical in both themes */
  --sky1:#070b1e; --sky2:#131a40; --sky3:#1b2660; --sky-ink:#f4f2ec; --sky-ink2:#c9cde6; --sky-muted:#a4aacb; --sky-line:rgba(255,255,255,.14); --sky-wash:rgba(255,255,255,.08);
  /* status: one accent (teal) + ink */
  --st-live-ink:#5cc9de; --st-live-tint:#21344b; --st-live-line:#2f6a7a;
  --st-work-bg:#2aa5bd; --st-work-ink:#0e1222;
  --st-action-bg:#f1efe8; --st-action-ink:#0e1222;
  --st-quiet-ink:#959bba; --st-quiet-line:#3a4168;
  /* attention: warm wash + ink + glyph */
  --attn-wash:#36301d; --attn-line:#5a4c2a; --attn-ink:#f1efe8; --attn-glyph:#f1efe8;
  --quiet-band:rgba(241,239,232,.07); --today-line:#f1efe8; --mark-ring:var(--card);
  --heat1:#20355f; --heat2:#2b4f8f; --heat3:#3a6fc0; --heat4:#5f93dc; --heat5:#a3c3ee;
  --focus:#8fd3e6; --tip-bg:#f1efe8; --tip-ink:#0e1222; --tip-ink2:#4e4c60;
  --led:#5cc9de; --led-stale:#c9c5d8; --led-off:#e05a5a;
  /* motion */
  --dur-micro:120ms; --dur-short:200ms; --dur-base:320ms; --dur-long:480ms; --dur-reveal:600ms; --dur-pop:360ms; --dur-fade:200ms; --dur-stars:900ms;
  --sweep:420ms; --stagger:70ms;
  --ease-out:cubic-bezier(.2,.7,.2,1); --ease-in:cubic-bezier(.4,0,1,1); --ease-move:cubic-bezier(.65,0,.35,1); --ease-spring:cubic-bezier(.34,1.35,.5,1);
  --lift:-1px; --loop:1; --rscale:1;
}
@media (min-width:1200px){ :root{ --card-pad:20px; } }
@media (max-width:700px){ :root{ --gutter:16px; --fs-hero:34px; --fs-2xl:24px; --fs-xl:18px; --ctl-md:var(--tap); } }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --page:#f3f0e8; --card:#fffdf9; --card2:#f7f4ec; --line:#e1dbce; --grid:#ebe6da;
    --wash:rgba(26,25,38,.05); --wash2:rgba(26,25,38,.09); --track:#e6e1d6; --shadow:0 1px 2px rgba(26,25,38,.05);
    --ink:#1a1926; --ink2:#4e4c60; --muted:#6b6a7e; --faint:#a09ead;
    --st-live-ink:#086b80; --st-live-tint:#dcf2f6; --st-live-line:#9ed3df;
    --st-work-bg:#0f7f95; --st-work-ink:#fffdf9;
    --st-action-bg:#1a1926; --st-action-ink:#fffdf9;
    --st-quiet-ink:#6b6a7e; --st-quiet-line:#c9c4b8;
    --attn-wash:#fbf1dc; --attn-line:#ecd9b0; --attn-ink:#1a1926; --attn-glyph:#7a4a12;
    --quiet-band:rgba(26,25,38,.06); --today-line:#1a1926;
    --heat1:#d7e4f6; --heat2:#a9c5ea; --heat3:#6f9ad8; --heat4:#3f6fbe; --heat5:#1f4687;
    --focus:#0f7f95; --tip-bg:#1a1926; --tip-ink:#f1efe8; --tip-ink2:#c1c5d9;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#f3f0e8; --card:#fffdf9; --card2:#f7f4ec; --line:#e1dbce; --grid:#ebe6da;
  --wash:rgba(26,25,38,.05); --wash2:rgba(26,25,38,.09); --track:#e6e1d6; --shadow:0 1px 2px rgba(26,25,38,.05);
  --ink:#1a1926; --ink2:#4e4c60; --muted:#6b6a7e; --faint:#a09ead;
  --st-live-ink:#086b80; --st-live-tint:#dcf2f6; --st-live-line:#9ed3df;
  --st-work-bg:#0f7f95; --st-work-ink:#fffdf9;
  --st-action-bg:#1a1926; --st-action-ink:#fffdf9;
  --st-quiet-ink:#6b6a7e; --st-quiet-line:#c9c4b8;
  --attn-wash:#fbf1dc; --attn-line:#ecd9b0; --attn-ink:#1a1926; --attn-glyph:#7a4a12;
  --quiet-band:rgba(26,25,38,.06); --today-line:#1a1926;
  --heat1:#d7e4f6; --heat2:#a9c5ea; --heat3:#6f9ad8; --heat4:#3f6fbe; --heat5:#1f4687;
  --focus:#0f7f95; --tip-bg:#1a1926; --tip-ink:#f1efe8; --tip-ink2:#c1c5d9;
}
/* reduced motion: movement to 0, fades stay short, nothing loops */
@media (prefers-reduced-motion: reduce){
  :root:not([data-motion="full"]){ --dur-micro:0ms; --dur-short:0ms; --dur-base:0ms; --dur-long:0ms; --dur-reveal:0ms; --dur-pop:0ms; --sweep:0ms; --stagger:0ms; --lift:0px; --loop:0; --dur-fade:120ms; --rscale:0; --dur-stars:120ms; }
}
:root[data-motion="reduce"]{ --dur-micro:0ms; --dur-short:0ms; --dur-base:0ms; --dur-long:0ms; --dur-reveal:0ms; --dur-pop:0ms; --sweep:0ms; --stagger:0ms; --lift:0px; --loop:0; --dur-fade:120ms; --rscale:0; --dur-stars:120ms; }

/* ============================================================================ base */
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{overflow-x:hidden;scroll-padding-top:64px}
body{background:var(--page);color:var(--ink);font:var(--fw-regular) var(--fs-base)/var(--lh-body) var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--container);margin:0 auto;padding:0 var(--gutter)}
.wrap.wide{max-width:var(--container-wide)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{cursor:default;opacity:.6}
svg{display:block;max-width:100%}
b{font-weight:var(--fw-semi)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
svg [tabindex]:focus-visible{outline:none}
svg g.dot:focus-visible circle.c, svg g.dot.cur circle.c{stroke:var(--ink);stroke-width:2.5;transform:scale(1.25)}
svg g.lane:focus-visible rect.lanehit{stroke:var(--focus);stroke-width:2}
.mono{font-family:var(--mono);font-size:var(--fs-xs)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tab{font-variant-numeric:tabular-nums}
.unit{font-weight:var(--fw-regular);color:var(--ink2)}
.nowrap{white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prose{max-width:var(--measure)}
.eyebrow,.colhead{font:var(--fw-semi) var(--fs-xs)/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font:var(--fw-bold) var(--fs-2xl)/var(--lh-display) var(--sans);letter-spacing:-.01em}
h2{font:var(--fw-bold) var(--fs-xl)/var(--lh-heading) var(--sans);letter-spacing:-.01em}
h3{font:var(--fw-semi) var(--fs-lg)/var(--lh-heading) var(--sans)}
.sub{font-size:var(--fs-md);line-height:var(--lh-body);color:var(--muted);margin-top:var(--s1)}
.meta{font-size:var(--fs-sm);line-height:var(--lh-small);color:var(--ink2)}
.meta b{color:var(--ink)}
.muted{color:var(--muted)}
.ink2{color:var(--ink2)}
.codes{font-weight:var(--fw-regular);color:var(--muted);white-space:nowrap}
.hid{display:none !important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================================ header: the night sky */
header.sky{background:linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 60%,var(--sky3) 100%);color:var(--sky-ink);position:relative;overflow:hidden}
header.sky .stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;animation:fadein var(--dur-stars) var(--ease-out) calc(200ms*var(--rscale)) both}
header.sky .wrap{position:relative;padding-top:var(--s4);padding-bottom:var(--s3)}
.mast{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s3) var(--s6);align-items:end}
.mast>div{animation:rise var(--dur-reveal) var(--ease-out) both}
.mast>div:nth-child(2){animation-delay:calc(120ms*var(--rscale))}
.mast .eyebrow{color:var(--sky-ink2);font-family:var(--mono);letter-spacing:.08em;text-transform:none;font-weight:var(--fw-regular);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fresh{display:flex;gap:var(--s2) var(--s3);align-items:center;flex-wrap:wrap;font-size:var(--fs-md);color:var(--sky-ink2);margin-top:var(--s2);line-height:var(--lh-body)}
.fresh b{color:var(--sky-ink)}
.fresh .pend{display:flex;gap:6px;align-items:flex-start;flex-basis:100%;color:var(--sky-muted)}
.fresh .pend.warn{color:var(--sky-ink)}
.fresh .pend svg{width:14px;height:14px;flex:none;margin-top:3px}
.live{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--sky-line);border-radius:var(--r-pill);height:var(--ctl-sm);padding:0 10px 0 8px;background:rgba(255,255,255,.06);font-size:var(--fs-sm);color:var(--sky-ink2);white-space:nowrap;transition:background var(--dur-short),border-color var(--dur-short)}
.live .led{width:8px;height:8px;border-radius:50%;background:var(--led);flex:none}
.live[data-state="stale"] .led{background:var(--led-stale)}
.live[data-state="offline"] .led{background:var(--led-off)}
.live[data-state="rebuilding"]{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35)}
.live[data-state="rebuilding"] .led{background:var(--sky-ink);animation:pulse 1.2s ease-in-out infinite}
.live[data-state="updated"]{background:rgba(92,201,222,.18);border-color:rgba(92,201,222,.5);color:var(--sky-ink)}
:root[data-motion="reduce"] .live[data-state="rebuilding"] .led{animation:none;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
@media (prefers-reduced-motion: reduce){ :root:not([data-motion="full"]) .live[data-state="rebuilding"] .led{animation:none;box-shadow:0 0 0 3px rgba(255,255,255,.35)} }
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.hero{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 var(--s2);justify-content:flex-end;text-align:right}
.hero .n{font:var(--fw-bold) var(--fs-hero)/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:proportional-nums;color:var(--sky-ink)}
.hero .u{font-size:var(--fs-lg);font-weight:var(--fw-semi);color:var(--sky-ink2)}
.hero .gloss{flex-basis:100%;font-size:var(--fs-sm);color:var(--sky-muted);margin-top:2px}
.comps{display:flex;gap:var(--s2) var(--s4);flex-wrap:wrap;justify-content:flex-end;margin-top:var(--s2);font-size:var(--fs-md);color:var(--sky-ink2)}
.comps span{white-space:nowrap}
.comps b{color:var(--sky-ink);font-variant-numeric:tabular-nums}
.share{margin-top:var(--s3);animation:rise var(--dur-reveal) var(--ease-out) both;animation-delay:calc(200ms*var(--rscale))}
.sharebar{width:100%;height:36px}
.sharebar svg{width:100%;height:36px;overflow:visible}
.sharebar rect.seg{transform-box:fill-box;transform-origin:left center;animation:growx var(--dur-reveal) var(--ease-out) both;animation-delay:calc((260ms + var(--i,0)*60ms)*var(--rscale));transition:filter var(--dur-micro);stroke:var(--sky2);stroke-width:2}
.sharebar rect.seg:hover{filter:brightness(1.15)}
.sharebar text{font:var(--fw-semi) var(--fs-xs) var(--sans);fill:#fff;pointer-events:none}
.sharebar text.tick{fill:var(--sky-ink2);font-weight:var(--fw-semi)}
.sharekey{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s1) var(--s3);margin-top:var(--s1);font-size:var(--fs-sm);color:var(--sky-ink2)}
.sharekey .k{display:grid;grid-template-columns:var(--dot) minmax(0,1fr);gap:0 6px;align-items:start;min-width:0}
.sharekey .k .dot{margin-top:4px;--mark-ring:var(--sky2)}
.sharekey .k .nm{font-weight:var(--fw-semi);color:var(--sky-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sharekey .k .v{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sharekey .k .v b{color:var(--sky-ink)}
.sharekey .k .no{font-weight:var(--fw-bold);font-size:var(--fs-xs);color:var(--sky-muted);margin-right:3px}
.legend{display:flex;gap:var(--s2) var(--s4);flex-wrap:wrap;align-items:center;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--sky-line);font-size:var(--fs-sm);color:var(--sky-ink2);animation:rise var(--dur-reveal) var(--ease-out) both;animation-delay:calc(260ms*var(--rscale))}
.legend .k{font:var(--fw-semi) var(--fs-xs)/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--sky-muted);margin-right:-4px}
.legend .m{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend .m .dot{--mark-ring:var(--sky2)}
.legend .sep{width:1px;height:16px;background:var(--sky-line)}
.legend .st{--st-live-tint:rgba(92,201,222,.16);--st-live-ink:#8fd9e8;--st-live-line:rgba(92,201,222,.5);--st-work-bg:#2aa5bd;--st-work-ink:#0e1222;--st-action-bg:#f1efe8;--st-action-ink:#0e1222;--st-quiet-ink:#c9cde6;--st-quiet-line:rgba(255,255,255,.35)}
details.keyfold{display:none}
@media (max-width:1100px){ .sharekey{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:900px){ .mast{grid-template-columns:minmax(0,1fr)} .hero,.comps{justify-content:flex-start;text-align:left} }
@media (max-width:700px){
  header.sky .wrap{padding-top:var(--s3);padding-bottom:var(--s2)}
  .mast .eyebrow{display:none}
  .hero .gloss{display:none}
  .comps{gap:var(--s1) var(--s3);font-size:var(--fs-sm)}
  .share{margin-top:var(--s2)} .sharebar,.sharebar svg{height:22px}
  .sharekey{grid-template-columns:repeat(3,minmax(0,1fr));gap:2px var(--s2)}
  .fresh{font-size:var(--fs-sm);margin-top:var(--s1)}
  .fresh .snap,.fresh .built,.fresh .pend .long{display:none}
  .sharekey .k .nm{font-size:var(--fs-xs)}
  details.keyfold summary{min-height:32px}
  .legend{display:none}
  details.keyfold{display:block;margin-top:var(--s2);font-size:var(--fs-sm);color:var(--sky-ink2)}
  details.keyfold summary{cursor:pointer;min-height:var(--tap);display:flex;align-items:center;color:var(--sky-ink2);font-weight:var(--fw-semi)}
  details.keyfold .legend{display:flex;margin-top:0;padding-top:var(--s2);border-top:0;animation:none}
}

/* ============================================================================ sticky bar */
.navbar{position:sticky;top:0;z-index:30;background:var(--sky2);color:var(--sky-ink);border-bottom:1px solid var(--sky-line);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.navin{display:flex;align-items:stretch;gap:var(--s1);min-height:48px}
.back{display:inline-flex;align-items:center;gap:6px;min-width:var(--tap);min-height:var(--tap);align-self:center;padding:0 10px 0 2px;font-size:var(--fs-md);color:var(--sky-ink2);text-decoration:none;white-space:nowrap;border-right:1px solid var(--sky-line);margin-right:var(--s1);border-radius:var(--r-sm) 0 0 var(--r-sm)}
.back:hover{color:var(--sky-ink)}
nav.tabs{display:flex;flex-wrap:wrap;gap:0 2px;flex:1;min-width:0;position:relative}
nav.tabs button{padding:0 var(--s3);min-height:48px;font-size:var(--fs-base);font-weight:var(--fw-regular);color:var(--sky-ink2);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-sm) var(--r-sm) 0 0;transition:color var(--dur-micro),background var(--dur-micro)}
nav.tabs button:hover{color:var(--sky-ink);background:var(--sky-wash)}
nav.tabs button[aria-selected="true"]{color:var(--sky-ink);font-weight:var(--fw-semi)}
nav.tabs .ink{position:absolute;bottom:0;height:3px;background:var(--sky-ink);border-radius:2px;transition:left var(--dur-base) var(--ease-move),width var(--dur-base) var(--ease-move)}
nav.tabs .n{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--sky-ink);color:var(--sky1);font-size:var(--fs-xs);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;transition:transform var(--dur-short) var(--ease-spring)}
nav.tabs .n.tick{transform:scale(1.25)}
.viewsel{display:none;align-items:center;gap:10px;flex:1;font-size:var(--fs-base);font-weight:var(--fw-semi);color:var(--sky-ink)}
.viewsel .selwrap{position:relative;flex:1}
.viewsel select{appearance:none;-webkit-appearance:none;width:100%;min-height:var(--tap);font:inherit;font-weight:var(--fw-semi);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:0 36px 0 12px}
.viewsel .selwrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.navright{display:flex;align-items:center;gap:var(--s2);padding-left:var(--s2)}
.theme{display:inline-flex;align-items:center;justify-content:center;width:var(--ctl-md);height:var(--ctl-md);border-radius:var(--r-sm);color:var(--sky-ink2);border:1px solid var(--sky-line);transition:background var(--dur-micro),color var(--dur-micro)}
.theme:hover{color:var(--sky-ink);background:var(--sky-wash)}
.theme svg{width:16px;height:16px}
.asof{font-family:var(--mono);font-size:var(--fs-xs);color:var(--sky-muted);white-space:nowrap}
@media (max-width:1100px){ .asof{display:none} }
@media (max-width:900px){ nav.tabs button{padding:0 var(--s2);font-size:var(--fs-md)} .back .long{display:none} .back{padding-right:8px} }
@media (max-width:700px){ nav.tabs{display:none} .viewsel{display:flex;padding:4px 0} .navin{min-height:52px;align-items:center} .theme{width:var(--tap);height:var(--tap)} }

/* ============================================================================ page */
main{padding:var(--section-gap) 0 var(--s7)}
main.busy{opacity:.72;transition:opacity var(--dur-base)}
section.view{display:none}
section.view.on{display:block}
section.view.leaving{opacity:0;transition:opacity var(--dur-fade) var(--ease-in)}
section.view.entering{opacity:0;transform:translateY(6px)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--card-pad);box-shadow:var(--shadow)}

.lanes.narrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s1) var(--s3)} .lanes.narrow .hd{display:none} .lanes.narrow .cell{border-bottom:0;padding:3px 0} .lanes.narrow .cell.sc{grid-column:1/-1;padding-top:var(--s3);border-top:1px solid var(--line)} .lanes.narrow .cell.lane,.lanes.narrow .marks3,.lanes.narrow .axisrow,.lanes.narrow .qlabel{grid-column:1/-1} .lanes.narrow .cell.next{grid-column:2;align-items:flex-end} .lanes.narrow .cell.num{grid-column:1}

<script id="dataset" type="application/json">__DATASET__</script>
<script>
"use strict";
/* ============================================================================
   Core: the dataset, its normalisation, the vocabulary, formatting with ONE
   rounding function, the anchored tooltip, the toast, tabs, header, freshness
   and the 30 s poll that redraws the page in place when the record changes.
   ========================================================================== */
const $ = id => document.getElementById(id);
let D = JSON.parse(document.getElementById("dataset").textContent);
const DEFAULTS = {targets:[],sessions:[],scopes:[],events:[],health:[],reconciliation:[],warnings:[],shelves:{},calibration:{},askarRigs:{},junk:{files:0,bytes:0},totals:{},inputs:{},
  notices:[],unknownNames:[],scopeOrder:[],notCounted:{},pendingImport:null};
function normalise(d){
  /* a dataset from another engine version may lack a key: fill the gaps once, so no tab goes blank */
  if(!d||typeof d!=="object") d={};
  for(const [k,v] of Object.entries(DEFAULTS)) if(d[k]==null) d[k]=(v===null?null:Array.isArray(v)?[]:(typeof v==="object"?{...v}:v));
  for(const k of ["unknownNames","noScope","noNight","unreadable","duplicates","notLightFrames"]) if(d.notCounted[k]==null) d.notCounted[k]=(k==="unknownNames"?{names:0,frames:0}:0);
  if(typeof d.notCounted.unknownNames!=="object"||d.notCounted.unknownNames===null) d.notCounted.unknownNames={names:0,frames:0};
  if(typeof d.pendingImport!=="object") d.pendingImport=null;
  for(const s of d.sessions){ if(!s) continue; s.hours=+s.hours||0; s.frames=+s.frames||0; s.filters=s.filters||{}; s.exps=s.exps||{}; s.night=String(s.night||""); s.target=String(s.target||""); s.camera=String(s.camera||"");
    if(!s.morning) s.morning=nightAdd(s.night,1); s.gains=Array.isArray(s.gains)?s.gains:[]; s.importedOn=Array.isArray(s.importedOn)?s.importedOn:[]; s.archived=+s.archived||0; s.framesWithoutExposure=+s.framesWithoutExposure||0; s.dayKeys=Array.isArray(s.dayKeys)?s.dayKeys:[]; s.archiveDays=Array.isArray(s.archiveDays)?s.archiveDays:[]; }
  d.sessions=d.sessions.filter(s=>s&&s.night);
  for(const t of d.targets){ t.programmes=t.programmes||[]; t.statusCards=t.statusCards||[]; t.codes=Array.isArray(t.codes)?t.codes:[]; t.cameras=t.cameras||[]; t.hours=+t.hours||0; t.lights=+t.lights||0; t.nights=+t.nights||0; t.name=String(t.name||"?"); t.id=String(t.id||t.name);
    for(const p of t.programmes){ p.hours=+p.hours||0; p.lights=+p.lights||0; p.nights=+p.nights||0; p.sessions=Array.isArray(p.sessions)?p.sessions:[]; p.mastersNamed=Array.isArray(p.mastersNamed)?p.mastersNamed:[]; p.finalsNamed=Array.isArray(p.finalsNamed)?p.finalsNamed:[]; p.captureState=p.captureState||"auto"; p.captureStateSource=p.captureStateSource||"rule"; p.sample=!!p.sample; p.framesWithoutExposure=+p.framesWithoutExposure||0; p.filters=p.filters||{}; p.exposures=p.exposures||{}; if(!p.status) p.status=STATUS_OF_STATE[(t.statusCards.find(c=>c.camera===p.camera)||{}).state]||"capturing"; } }
  return d;
}
const STATUS_OF_STATE={captured:"capturing",stacked:"ready_to_process",processing:"in_progress",complete:"done"};
const STATE_OF_STATUS={capturing:"captured",ready_to_process:"stacked",in_progress:"processing",done:"complete"};
const dayMs=864e5;
function nightAdd(iso,n){ const t=Date.parse(iso+"T12:00:00Z"); if(isNaN(t)) return iso; return new Date(t+n*dayMs).toISOString().slice(0,10); }
const nightIdx=(iso,start)=>Math.round((Date.parse(iso+"T12:00:00Z")-Date.parse(start+"T12:00:00Z"))/dayMs);
D=normalise(D);

/* ---------- the vocabulary: a status is a glyph and a word; colour means scope ---------- */
const ST={
  capturing:        {word:"Still capturing",  verb:"Keep capturing", icon:"cap",    cls:"st-live",   state:"captured"},
  ready_to_process: {word:"Ready to process", verb:"Process it",     icon:"play",   cls:"st-action", state:"stacked"},
  in_progress:      {word:"Finish it",        verb:"Finish it",      icon:"half",   cls:"st-work",   state:"processing"},
  done:             {word:"Done",             verb:"Done",           icon:"check",  cls:"st-done",   state:"complete"},
  sample:           {word:"Quick look",       verb:"Decide",         icon:"sample", cls:"st-sample", state:"sample"},
};
const PIPE_ORDER=["capturing","ready_to_process","in_progress","done","sample"];
const stOf=k=>ST[k]||ST.capturing;
/* the stored state word (statusCards.state) → the status key */
const stageOf=state=>stOf(STATUS_OF_STATE[state]||state);
/* a quick look is Brett's flag, never an hour rule; nothing with a master or a final can be one */
const stKey=p=>(p.sample&&!(p.masters>0||p.processedFinals>0||p.mastersNamed.length||p.finalsNamed.length))?"sample":p.status;
const cardKey=c=>(c.sample&&c.state!=="processing"&&c.state!=="complete")?"sample":(STATUS_OF_STATE[c.state]||"capturing");

/* ---------- scopes: colour and order from the engine only ---------- */
let SC=[], BY={}, TG=[], byName={}, SESS=[], nightly=new Map(), CARDS=[], PROGS=[], MAXSES=1, totalHours=0;
const shortName=cam=>String(cam).replace(/^(Seestar|Askar)\s+/,"").replace(/^Starfront S50 Pro$/,"Starfront");
function derive(){
  const order=D.scopeOrder||[];
  SC=D.scopes.filter(s=>s&&s.camera).map(s=>({...s,short:shortName(s.camera),hours:+s.hours||0,frames:+s.frames||0,nights:+s.nights||0,
    kind:s.kind||(/seestar|starfront/i.test(s.camera)?"seestar":"askar")}))
    .sort((a,b)=>((a.order??(order.indexOf(a.id)+1||99))-(b.order??(order.indexOf(b.id)+1||99)))||String(a.camera).localeCompare(String(b.camera)));
  /* a camera that only the sessions name (no scopes row) still gets a place, never a silent drop */
  for(const s of D.sessions) if(!SC.some(c=>c.camera===s.camera)) SC.push({camera:s.camera,id:s.camera,short:shortName(s.camera),colour:null,hours:0,frames:0,nights:0,kind:/seestar|starfront/i.test(s.camera)?"seestar":"askar",order:99});
  BY=Object.fromEntries(SC.map(s=>[s.camera,s]));
  TG=D.targets.slice(); byName={};
  for(const t of TG){ if(byName[t.name]){ continue; } byName[t.name]=t; }
  SESS=D.sessions;
  for(const t of TG) t.camHours={};
  nightly=new Map();
  for(const s of SESS){
    const t=byName[s.target]; if(t) t.camHours[s.camera]=(t.camHours[s.camera]||0)+s.hours;
    let n=nightly.get(s.night); if(!n){ n={frames:0,hours:0,perCam:{},targets:new Set()}; nightly.set(s.night,n); }
    n.frames+=s.frames; n.hours+=s.hours; n.perCam[s.camera]=n.perCam[s.camera]||{frames:0,hours:0}; n.perCam[s.camera].frames+=s.frames; n.perCam[s.camera].hours+=s.hours; n.targets.add(s.target);
  }
  CARDS=[]; PROGS=[];
  for(const t of TG){ for(const c of t.statusCards) CARDS.push(c); for(const p of t.programmes) PROGS.push({...p,target:t.name,tid:t.id,t}); }
  MAXSES=Math.max(1,...SESS.map(s=>s.hours||0));
  totalHours=+D.totals.hours||0;
}
derive();
const col=cam=>(BY[cam]&&BY[cam].colour)||"var(--muted)";
const short=cam=>(BY[cam]&&BY[cam].short)||String(cam);
const rank=cam=>{ const i=SC.findIndex(s=>s.camera===cam); return i<0?99:i; };
const scopeOrder=list=>list.slice().sort((a,b)=>rank(a.camera)-rank(b.camera));
const isSeestar=cam=>(BY[cam]&&BY[cam].kind)==="seestar";
const CAMSHORT=new Proxy({}, {get:(_,k)=>short(k)});

/* ---------- formatting: ONE rounding function; unknown is never 0; totals are sums of displayed parts ---------- */
const r1=h=>Math.round((+h||0)*10)/10;
const fmtI=n=>(n==null||isNaN(+n))?"?":(+n).toLocaleString("en-GB");
function fmtH(h){ h=+h||0; if(h>0&&h<0.1) return Math.max(1,Math.round(h*60))+" min"; return r1(h).toLocaleString("en-GB",{minimumFractionDigits:1,maximumFractionDigits:1})+" h"; }
const fmtHn=h=>r1(h).toLocaleString("en-GB",{minimumFractionDigits:1,maximumFractionDigits:1});
const sumH=list=>list.reduce((a,x)=>a+r1(x),0);
const hoursUnknown=(hours,frames)=>!(hours>0)&&frames>0;
const hoursTxt=(hours,frames)=>hoursUnknown(hours,frames)?"hours unknown":fmtH(hours);
const fmtGB=b=>{ b=+b||0; const g=b/2**30; return g>=1024?(g/1024).toLocaleString("en-GB",{maximumFractionDigits:2})+" TB":g>=1?g.toLocaleString("en-GB",{maximumFractionDigits:g>=100?0:1})+" GB":(b/2**20).toLocaleString("en-GB",{maximumFractionDigits:0})+" MB"; };
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDY(iso){ if(!iso) return "?"; const [y,m,d]=String(iso).split("-"); if(!m||!d) return String(iso); return (+d)+" "+(MONTHS[+m-1]||m)+" "+y; }
const fmtD=fmtDY;
function fmtDS(iso){ if(!iso) return "?"; const [y,m,d]=String(iso).split("-"); if(!m||!d) return String(iso); return (+d)+" "+(MONTHS[+m-1]||m); }
const dowOf=iso=>{ const t=Date.parse(iso+"T12:00:00Z"); return isNaN(t)?"":DOW[new Date(t).getUTCDay()]; };
/* a night is noon to noon: the key is the evening, `morning` the day after */
function fmtNight(night,morning,year){ morning=morning||nightAdd(night,1); const [y1,m1,d1]=night.split("-"),[y2,m2,d2]=morning.split("-");
  if(!m1||!m2) return fmtDY(night); const a=dowOf(night)+" "+(+d1), b=dowOf(morning)+" "+(+d2)+" "+(MONTHS[+m2-1]||m2)+(year?" "+y2:"");
  return a+(m1!==m2?" "+(MONTHS[+m1-1]||m1):"")+" → "+b; }
const fmtMonth=ym=>{ const [y,m]=String(ym).split("-"); return (MONTHS[+m-1]||m)+" "+y; };
const nts=n=>fmtI(n)+" night"+(n===1?"":"s");
const plural=(n,w,ws)=>fmtI(n)+" "+(n===1?w:(ws||w+"s"));
const ASOF=()=>D.asOfNight||(SESS.map(s=>s.night).sort().pop())||new Date().toISOString().slice(0,10);
const ago=iso=>nightIdx(ASOF(),iso);
const agoTxt=iso=>{ const n=ago(iso); return n===0?"last night":n===1?"1 night ago":n+" nights ago"; };
/* percentages by largest remainder, so they add to 100 */
function pctLR(vals){ const tot=vals.reduce((a,b)=>a+b,0); if(tot<=0) return vals.map(()=>0); const raw=vals.map(v=>v/tot*100), fl=raw.map(Math.floor); let rem=100-fl.reduce((a,b)=>a+b,0); const idx=raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]); for(let k=0;k<rem;k++) fl[idx[k%idx.length][1]]++; return fl; }
/* a name is a common name plus catalogue codes: "Open cluster in the Tadpoles (IC 410) (NGC 1893)" */
function splitName(n){ n=String(n||""); const i=n.indexOf(" ("); if(i<0) return {common:n,codes:""}; const codes=[...n.slice(i).matchAll(/\(([^)]*)\)/g)].map(m=>m[1]).join(", "); return {common:n.slice(0,i),codes}; }
function nameEl(n,cls,tag){ const {common,codes}=splitName(n); const d=el(tag||"div",(cls||"")+" clamp2"); d.title=n; d.append(document.createTextNode(common)); if(codes){ d.append(document.createTextNode(" ")); d.append(el("span","codes","("+codes+")")); } return d; }
const commonName=n=>splitName(n).common;

/* ---------- state remembered per viewer (best-effort) ---------- */
let mem={};
try{ mem=JSON.parse(localStorage.getItem("aao")||"{}")||{}; }catch(e){ mem={}; }
if(typeof mem!=="object"||mem===null||Array.isArray(mem)) mem={};
function remember(){ try{ localStorage.setItem("aao",JSON.stringify(mem)); }catch(e){} }
if(mem.theme==="light"||mem.theme==="dark") document.documentElement.dataset.theme=mem.theme;

/* ---------- tiny DOM helpers ---------- */
function el(tag,cls,text){ const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n; }
function svgEl(tag,attrs){ const n=document.createElementNS("http://www.w3.org/2000/svg",tag); for(const k in (attrs||{})) n.setAttribute(k,attrs[k]); return n; }
const nextFrame=fn=>requestAnimationFrame(()=>requestAnimationFrame(fn));
const ms=name=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name))||0;
const reduced=()=>document.documentElement.dataset.motion==="reduce"||(document.documentElement.dataset.motion!=="full"&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const mode=()=>matchMedia("(max-width:699px)").matches?"phone":matchMedia("(max-width:899px)").matches?"tablet":"desk";
function camDot(cam,cls){ const d=el("span","dot"+(cls?" "+cls:"")); d.style.setProperty("--sc",col(cam)); d.title=String(cam); return d; }
function scopeName(cam){ const s=el("span","scname"); s.append(camDot(cam),document.createTextNode(short(cam))); return s; }
function glyph(kind){
  const s=svgEl("svg",{viewBox:"0 0 16 16","aria-hidden":"true"}); const c="currentColor";
  if(kind==="cap"){ s.append(svgEl("circle",{cx:8,cy:8,r:5.6,fill:"none",stroke:c,"stroke-width":1.8})); s.append(svgEl("circle",{cx:8,cy:8,r:2.4,fill:c})); }
  else if(kind==="play"){ s.append(svgEl("path",{d:"M5 3.6v8.8L12.2 8z",fill:c})); }
  else if(kind==="half"){ s.append(svgEl("circle",{cx:8,cy:8,r:5.6,fill:"none",stroke:c,"stroke-width":1.8})); s.append(svgEl("path",{d:"M8 2.4a5.6 5.6 0 0 0 0 11.2z",fill:c})); }
  else if(kind==="check"){ s.append(svgEl("path",{d:"M3.5 8.4l3 3 6-6.6",fill:"none",stroke:c,"stroke-width":2.2,"stroke-linecap":"round","stroke-linejoin":"round"})); }
  else if(kind==="sample"){ s.append(svgEl("circle",{cx:8,cy:8,r:5.6,fill:"none",stroke:c,"stroke-width":1.6,"stroke-dasharray":"2.4 2"})); s.append(svgEl("circle",{cx:8,cy:8,r:1.8,fill:c})); }
  else if(kind==="warn"){ s.append(svgEl("path",{d:"M8 1.8L15 14H1z",fill:"none",stroke:c,"stroke-width":1.6,"stroke-linejoin":"round"})); s.append(svgEl("path",{d:"M8 6v3.6M8 11.6v.4",stroke:c,"stroke-width":1.8,"stroke-linecap":"round"})); }
  else if(kind==="q"){ s.append(svgEl("circle",{cx:8,cy:8,r:6.5,fill:"none",stroke:c,"stroke-width":1.6,"stroke-dasharray":"2.2 2"})); const t=svgEl("text",{x:8,y:11.3,"text-anchor":"middle","font-size":"9","font-weight":"700",fill:c}); t.textContent="?"; s.append(t); }
  else if(kind==="none"){ s.append(svgEl("circle",{cx:8,cy:8,r:5.6,fill:"none",stroke:c,"stroke-width":1.6})); }
  else if(kind==="info"){ s.append(svgEl("circle",{cx:8,cy:8,r:6.5,fill:"none",stroke:c,"stroke-width":1.6})); s.append(svgEl("path",{d:"M8 7v4.5M8 4.6v.4",stroke:c,"stroke-width":1.8,"stroke-linecap":"round"})); }
  else if(kind==="chev"){ s.setAttribute("viewBox","0 0 22 22"); s.append(svgEl("path",{d:"M6 9l5 5 5-5",fill:"none",stroke:c,"stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round"})); }
  else if(kind==="right"){ s.append(svgEl("path",{d:"M6 3.5l5 4.5-5 4.5",fill:"none",stroke:c,"stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round"})); }
  else if(kind==="sun"){ s.append(svgEl("circle",{cx:8,cy:8,r:3.2,fill:"none",stroke:c,"stroke-width":1.6})); for(let a=0;a<8;a++){ const r=a*Math.PI/4; s.append(svgEl("line",{x1:8+5.2*Math.cos(r),y1:8+5.2*Math.sin(r),x2:8+6.8*Math.cos(r),y2:8+6.8*Math.sin(r),stroke:c,"stroke-width":1.4,"stroke-linecap":"round"})); } }
  else if(kind==="moon"){ s.append(svgEl("path",{d:"M10.5 2.5a6 6 0 1 0 3 11A5 5 0 0 1 10.5 2.5z",fill:c})); }
  return s;
}
/* the same glyph drawn inside an SVG timeline, in ink, with a surface ring */
function stageMark(svg,kind,cx,cy,tipBuild){
  const g=svgEl("g",{class:"stage",transform:"translate("+(cx-8)+","+(cy-8)+")"});
  g.append(svgEl("circle",{class:"ring",cx:8,cy:8,r:8.5}));
  const c="var(--ink)";
  if(kind==="cap"){ g.append(svgEl("circle",{cx:8,cy:8,r:4.6,fill:"none",stroke:c,"stroke-width":1.6})); g.append(svgEl("circle",{cx:8,cy:8,r:1.9,fill:c})); }
  else if(kind==="play"){ g.append(svgEl("path",{d:"M5.4 4v8L12 8z",fill:c})); }
  else if(kind==="half"){ g.append(svgEl("circle",{cx:8,cy:8,r:4.6,fill:"none",stroke:c,"stroke-width":1.6})); g.append(svgEl("path",{d:"M8 3.4a4.6 4.6 0 0 0 0 9.2z",fill:c})); }
  else if(kind==="check"){ g.append(svgEl("path",{d:"M4 8.4l2.8 2.8L12 5.6",fill:"none",stroke:c,"stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round"})); }
  else if(kind==="sample"){ g.append(svgEl("circle",{cx:8,cy:8,r:4.6,fill:"none",stroke:c,"stroke-width":1.4,"stroke-dasharray":"2.2 1.8"})); }
  if(tipBuild) hoverable(g,tipBuild);
  svg.append(g); return g;
}
function pill(key,opts){ opts=opts||{}; const s=stOf(key); const p=el("span","st "+s.cls+(opts.tap?" tapp":"")); if(opts.cam) p.append(camDot(opts.cam)); p.append(glyph(s.icon)); p.append(document.createTextNode(opts.text||(opts.verb?s.verb:s.word))); return p; }
function stageChip(state,opts){ return pill(STATUS_OF_STATE[state]||state,opts); }
function markEl(m){ const s=el("span","mark "+(m.cls||"")); s.append(glyph(m.icon)); const w=el("span"); w.append(el("span","w",m.word)); if(m.sub) w.append(el("small",null,m.sub)); s.append(w); if(m.tip) hoverable(s,box=>{ box.append(el("div","tt-t",m.word)); box.append(el("div",null,m.tip)); }); return s; }

/* ---------- the three marks beside an Askar dataset lane (wording: R/truth/wording.md) ---------- */
function captureMark(p){
  const a=p.lastNight?ago(p.lastNight):null; const by=p.captureStateSource==="capture-state.json";
  if(p.status==="capturing"&&p.captureState==="open") return {icon:"cap",cls:"",word:"Open, kept by you",sub:a==null?"":"last frames "+agoTxt(p.lastNight),tip:"You kept this one open in capture-state.json, so it stays Still capturing until you close it."};
  if(p.status==="capturing") return {icon:"cap",cls:"",word:"Active",sub:a==null?"":"last frames "+agoTxt(p.lastNight),tip:"New frames within the last "+(D.quietPeriodDays||14)+" nights."};
  if(p.captureState==="complete") return {icon:"check",cls:"ok",word:"Closed by you",sub:by?"in capture-state.json":"",tip:"You marked this dataset complete, so it is ready to process whatever the dates say."};
  if(p.status==="done") return {icon:"check",cls:"ok",word:"Quiet",sub:a==null?"":"nothing new for "+nts(a),tip:"No new frames; the finished picture closes it."};
  return {icon:"none",cls:"none",word:"Quiet",sub:a==null?"":"nothing new for "+nts(a),tip:"No new frames for more than "+(D.quietPeriodDays||14)+" nights."};
}
function processingMark(p){
  const u=!!p.masterOwnerUncertain;
  if(p.finalsNamed.length||p.processedFinals>0) return {icon:"check",cls:"ok",word:"Final found",sub:p.finalsNamed[0]||"",tip:p.finalsNamed.length?"Finished picture: "+p.finalsNamed.join(", "):"A finished picture names this target and this scope."};
  if(p.mastersNamed.length||p.masters>0) return {icon:"half",cls:"",word:"Master saved"+(u?" ?":""),sub:u?"which Askar made it?":(p.mastersNamed[0]||""),tip:(p.mastersNamed.length?"Master: "+p.mastersNamed.join(", ")+". ":"")+(u?"One master sits in the shared Askar folder and its name doesn't say which scope made it.":"A master of yours is saved; no final yet.")};
  return {icon:"none",cls:"none",word:"Not started"+(u?" ?":""),sub:u?"unless the shared folder's master is this scope's":"",tip:u?"The shared Askar folder holds a master that may be this scope's.":"Nothing of yours is saved for this dataset yet."};
}
function calibrationMark(p){
  const c=p.calibration||{}; const modeK=c.mode||(c.applies===false?"inCamera":(c.applies?"tracked":"unknown"));
  if(modeK==="inCamera"||(isSeestar(p.camera)&&c.applies!==true)) return {icon:"none",cls:"none",word:"Not tracked",sub:"the Seestar calibrates in the camera",tip:"The Seestar takes and applies its own calibration; the importer does not file darks or flats for it."};

  const miss=Array.isArray(c.missing)?c.missing:[];

function subsTxt(exps){ const ks=Object.entries(exps||{}).filter(([k,v])=>+k>0&&v>0).sort((a,b)=>b[1]-a[1]); if(!ks.length) return ""; return ks.length===1?(+ks[0][0])+" s subs":ks.slice(0,2).map(([k])=>(+k)+" s").join(" and ")+" subs"; }

/* ---------- tooltip: one element, anchored to the mark, not the cursor ---------- */

/* ---------- header: eyebrow, freshness, hero, share bar, legend ---------- */
let heroVal=null;
const scopeWord=n=>["no","one","two","three","four","five","six","seven","eight","nine"][n]||String(n);
function renderHeader(changed){

}
/* the share bar: an SVG at its real width; every slice labelled, in-segment when it fits, by a numbered tick when thin */
function renderShare(changed){
  const sb=$("sharebar"); const w=Math.max(200,Math.floor(sb.clientWidth||600)); if(!changed&&sb._w===w&&sb.children.length) return; sb._w=w; const H=mode()==="phone"?22:36, barH=mode()==="phone"?14:18, y=(H-barH)/2;
  const tot=SC.reduce((a,s)=>a+s.hours,0); const pcts=pctLR(SC.map(s=>s.hours));

    hoverable(r,box=>{ box.append(el("div","tt-t",s.camera)); ttRow(box,"hours",fmtH(s.hours),col(s.camera)); ttRow(box,"share",pcts[i]+"%"); ttRow(box,"frames",fmtI(s.frames)); ttRow(box,"nights",fmtI(s.nights)); });

    if(sw>=need&&mode()!=="phone"){ const t=svgEl("text",{x:(x+7).toFixed(1),y:(y+barH/2+4).toFixed(1)}); t.textContent=label; svg.append(t); s._tick=0; }
    else { ntick++; s._tick=ntick; if(sw>=10){ const t=svgEl("text",{class:"tick",x:(x+sw/2).toFixed(1),y:(y+barH/2+4).toFixed(1),"text-anchor":"middle"}); t.textContent=String(ntick); svg.append(t); } }
    x+=sw; });

  SC.forEach((s,i)=>{ let k=sk.children[i]; if(!k){ k=el("div","k"); k.append(camDot(s.camera)); const t=el("div"); t.append(el("div","nm"),el("div","v")); k.append(t); sk.append(k); }
    const nm=k.querySelector(".nm"); nm.replaceChildren(); if(s._tick){ nm.append(el("span","no",String(s._tick))); } nm.append(document.createTextNode(mode()==="phone"?s.short:s.camera));
    const v=k.querySelector(".v"); const html=mode()==="phone"?"<b>"+fmtH(s.hours)+"</b>":"<b>"+fmtH(s.hours)+"</b> · "+pcts[i]+"% · "+nts(s.nights); if(!fresh&&v.innerHTML!==html&&changed) wash(v); v.innerHTML=html; });

/* ---------- freshness: five states, and what is still on a camera ---------- */
const live={state:"fresh",at:Date.parse(D.generatedAtIso||"")||Date.now(),fails:0,lastOk:Date.now()};
function ageText(at){ const m=Math.max(0,Math.round((Date.now()-at)/60000)); if(m<1) return "just now"; if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<36) return h+" h ago"; return Math.round(h/24)+" days ago"; }
function renderFresh(){
  const f=$("fresh"); f.replaceChildren();
  const t=el("span","built"); t.append("Record built ",el("b",null,D.generatedAt||"?"));
  const snap=(D.inputs||{}).snapshot;
  if(snap&&snap.at){ const days=typeof snap.ageHours==="number"?Math.floor(snap.ageHours/24):null; const s=el("span","snap"); s.textContent=" · the "+(snap.machine||"other computer")+"'s copy is "+(days==null?"from "+fmtDY(String(snap.at).slice(0,10)):days===0?"from today":days===1?"a day old ("+fmtDS(String(snap.at).slice(0,10))+")":days+" days old ("+fmtDS(String(snap.at).slice(0,10))+")"); t.append(s); }
  f.append(t);
  const lv=el("span","live"); lv.id="live"; lv.append(el("i","led"),el("span","age")); f.append(lv);
  hoverable(lv,box=>{ box.append(el("div","tt-t","How fresh this page is")); const m={fresh:"The importer is reachable and this is its latest record. The page checks every 30 s and redraws itself when a rebuild finishes.",stale:"This record is more than a day old. Press Refresh on the panel to rebuild it.",rebuilding:"The importer is rebuilding the record from your records. The numbers below stay until the new ones arrive.",updated:"The record was just rebuilt; what changed is highlighted.",offline:"The importer isn't answering, so this page may be out of date. It keeps trying every 30 s.",file:"Opened from a file: the page shows the record it was saved with."}; box.append(el("div",null,m[live.state]||m.fresh)); });

  if(p&&typeof p==="object"){ const cam=p.camera?("the "+p.camera):"a camera"; const when=p.seenAt?(" · seen "+ageText(Date.parse(p.seenAt))):"";
    if(p.files>0){ pend.classList.add("warn"); pend.append(glyph("warn")); const sp=el("span",null,fmtI(p.files)+" files on "+cam+" not yet imported"+(p.targets?" ("+plural(p.targets,"target")+")":"")+(p.failedEject?" · eject failed":"")); sp.append(el("span","long",(p.elsewhere?" · "+fmtI(p.elsewhere)+" already on the other computer":"")+" · the lists below don't include them"+when)); pend.append(sp); }
    else { pend.append(glyph("check")); pend.append(el("span",null,"nothing left to import on "+cam+" at the last scan"+when)); } }
  else { pend.append(glyph("info")); pend.append(el("span",null,"Frames still on a camera: not checked by this record")); }

}
function setLive(state){
  if(state==="fresh"&&Date.now()-live.at>24*3600e3) state="stale";
  live.state=state; const lv=$("live"); if(!lv) return; lv.dataset.state=state==="file"?"stale":state;
  const txt={fresh:"live · "+ageText(live.at),stale:"a day old · "+ageText(live.at),rebuilding:"rebuilding…",updated:"updated just now",offline:"importer not answering · last seen "+ageText(live.lastOk),file:"saved record · "+ageText(live.at)}[state];
  lv.querySelector(".age").textContent=txt;
  $("main").classList.toggle("busy",state==="rebuilding"); $("main").setAttribute("aria-busy",state==="rebuilding"?"true":"false");
}
setInterval(()=>{ if(["fresh","stale","offline","file"].includes(live.state)) setLive(live.state); },30000);
/* the poll: inside the panel (same origin) ask every 30 s; when the stamp changes fetch the dataset and redraw in place */
const SAME=(location.origin&&location.origin!=="null")?location.origin:null;
let polling=false;
async function poll(){
  if(location.protocol==="file:"||!SAME||polling) return; polling=true;
  try{ const r=await fetch("/api/observatory/status",{cache:"no-store",credentials:"same-origin"}); if(!r.ok) throw new Error(r.status); const s=await r.json(); live.fails=0; live.lastOk=Date.now();
    if(s.rebuilding){ setLive("rebuilding"); return; }
    const at=s.generatedAtIso?Date.parse(s.generatedAtIso):NaN;
    if(!isNaN(at)&&at!==live.at){ setLive("rebuilding"); const rj=await fetch("/observatory?json=1",{cache:"no-store",credentials:"same-origin"}); if(!rj.ok) throw new Error(rj.status); const j=await rj.json(); applyDataset(j); }
    else if(live.state==="rebuilding"||live.state==="offline") setLive("fresh");
  }catch(e){ if(++live.fails>=2) setLive("offline"); }
  finally{ polling=false; }
}
if(location.protocol!=="file:"&&SAME){ setInterval(poll,30000); }

/* ---------- tabs: a roving tablist with a sliding ink bar and a crossfade ---------- */
const VIEWS=[["overview","Overview"],["targets","Targets"],["coverage","Coverage"],["pipeline","Pipeline"],["nights","Nights"],["sky","Sky"],["footprints","Footprints"],["equipment","Equipment"],["health","Data checks"]];
const RENDER={};
const tabsNav=$("tabs"), mainEl=$("main"), viewSel=$("viewsel");
const sections={}; let current=null; const painted={}, failed={}, scrollMem={};
let WARN_N=0;
for(const [id,label] of VIEWS){
  const b=el("button",null,label); b.id="tab-"+id; b.setAttribute("role","tab"); b.setAttribute("aria-selected","false"); b.setAttribute("aria-controls","view-"+id); b.tabIndex=-1;
  if(id==="health"){ const n=el("span","n"); n.id="navHealth"; b.append(n); }
  b.addEventListener("click",()=>go(id)); tabsNav.append(b);
  const o=el("option",null,label); o.value=id; viewSel.append(o);
  const s=el("section","view"); s.id="view-"+id; s.setAttribute("role","tabpanel"); s.setAttribute("aria-labelledby","tab-"+id); mainEl.append(s); sections[id]=s;
}
viewSel.addEventListener("change",()=>go(viewSel.value));
tabsNav.addEventListener("keydown",e=>{ const ids=VIEWS.map(v=>v[0]); let i=ids.indexOf(current); if(e.key==="ArrowRight") i=(i+1)%ids.length; else if(e.key==="ArrowLeft") i=(i-1+ids.length)%ids.length; else if(e.key==="Home") i=0; else if(e.key==="End") i=ids.length-1; else return; e.preventDefault(); go(ids[i]); $("tab-"+ids[i]).focus(); });
function placeInk(){ const b=$("tab-"+current), ink=$("ink"); if(!b||!ink) return; ink.style.left=b.offsetLeft+"px"; ink.style.width=b.offsetWidth+"px"; ink.style.top=(b.offsetTop+b.offsetHeight-3)+"px"; }
function setHealthCount(n){ WARN_N=n; const b=$("navHealth"); if(b){ b.textContent=n; b.classList.toggle("hid",!n); b.classList.add("tick"); setTimeout(()=>b.classList.remove("tick"),ms("--dur-short")); } const o=viewSel.querySelector('option[value="health"]'); if(o) o.textContent="Data checks"+(n?" · "+n+" to look at":""); }
let switching=false;
function paintView(id){
  if(painted[id]) return;
  try{ sections[id].replaceChildren(); RENDER[id](sections[id]); }
  catch(e){ failed[id]=true; sections[id].replaceChildren(el("p","sub","This view couldn't be drawn ("+(e&&e.message||e)+"). The other tabs still work.")); }
  painted[id]=true;
}
function go(id,instant){
  if(!RENDER[id]) id="overview";
  for(const [vid] of VIEWS){ const b=$("tab-"+vid); b.setAttribute("aria-selected",vid===id?"true":"false"); b.tabIndex=vid===id?0:-1; }
  viewSel.value=id;
  if(id===current) { placeInk(); return; }
  const from=current?sections[current]:null, to=sections[id];
  if(current) scrollMem[current]=scrollY;
  current=id; placeInk(); ttHide();
  const finish=()=>{ paintView(id); to.classList.add("on"); if(!failed[id]){ mem.tab=id; remember(); } fitAll(); scrollTo({top:scrollMem[id]||0,behavior:"instant"}); };
  if(!from||instant||switching||ms("--dur-fade")===0){ if(from) from.classList.remove("on","leaving"); finish(); return; }
  switching=true; from.classList.add("leaving");
  setTimeout(()=>{ from.classList.remove("on","leaving"); to.classList.add("entering"); finish(); nextFrame(()=>{ to.classList.remove("entering"); to.classList.add("entered"); setTimeout(()=>{ to.classList.remove("entered"); switching=false; },Math.max(ms("--dur-fade"),ms("--dur-base"))); }); },ms("--dur-fade"));
}
addEventListener("resize",placeInk);
/* every SVG is drawn at its real pixel width: redraw what is visible when the width changes */
const FITTERS=new Set();
function fitAll(still){ for(const f of [...FITTERS]){ try{ f(!!still); }catch(e){} } }
let rsT; addEventListener("resize",()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ fitAll(true); renderShare(false); placeInk(); },120); });
</script>
<script>
"use strict";
/* ============================================================================
   Overview: last night · needs your attention · what each scope captured (the
   six-scope strip) · what to do next · projects that moved lately, with the
   project panel, the night panel and the scope panel (SPEC §1, §1b, §3).
   ========================================================================== */
const QUIET=()=>D.quietPeriodDays||14;

/* ---------- keyed strips: one SVG, one or many lanes, a dot per night (or per week past 120 nights),
   dots keyed so a range change MOVES them; drawn at the real pixel width ---------- */
const PAD=10;
const xOf=(k,N,plot)=>PAD+(N-1-k)/(N-1)*plot;

  if(p.status==="ready_to_process") return p.captureState==="complete"?"closed by you · ready to process":"nothing new for "+nts(ago(p.lastNight));

<script>

/* ================= COVERAGE: every target against every scope ================= */
RENDER.coverage=function(root){

  const count=el("span","tcount"); tb.append(count); root.append(tb);

  const head=el("div","mxhead"); head.style.gridTemplateColumns=gridCols; head.append(el("span","colhead","Target")); for(const cm of cols){ const c=el("span","mxcol colhead"); c.append(camDot(cm.camera),document.createTextNode(cm.short)); head.append(c); } head.append(el("span","mxcol end colhead","of "+cols.length)); mx.append(head);

          hoverable(cell,box=>{ box.append(el("div","tt-t",t.name+" · "+cm.camera)); ttRow(box,"hours",a.hours>0?fmtH(a.hours):"unknown · "+fmtI(a.frames)+" frames",col(cm.camera)); ttRow(box,"frames",fmtI(a.frames)); ttRow(box,"nights",fmtI(a.nights.size)); ttRow(box,"span",fmtDY(a.first)+(a.last!==a.first?" to "+fmtDY(a.last):"")); }); }

<script>
"use strict";
/* ================= TARGET DRAWER: the project in full, with its folders ================= */
const drawer=$("drawer"), scrim=$("scrim");
let lastFocus=null;
function showDrawer(){ if(!drawer.classList.contains("open")) lastFocus=document.activeElement; ttHide(); scrim.style.display="block"; drawer.classList.add("open"); drawer.setAttribute("role","dialog"); drawer.setAttribute("aria-modal","true"); document.body.style.overflow="hidden"; drawer.scrollTop=0; const c=drawer.querySelector(".close"); if(c) c.focus(); }
function closeDrawer(){ if(!drawer.classList.contains("open")) return; drawer.classList.remove("open"); scrim.style.display="none"; document.body.style.overflow=""; ttHide(); closePanel("night"); if(lastFocus&&document.contains(lastFocus)&&lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} } lastFocus=null; }
scrim.addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
/* Buttons ask the panel that frames this page; alone in a browser they can only say so.
   Messages go to, and come from, the same origin only (a file: page has none, so it never posts). */
const OPEN_SAID=new Map();
function ask(msg){ if(window.parent===window||!SAME){ const s=OPEN_SAID.get(msg.rel); if(s) s.textContent="Open this page from the importer's Observatory tab to use the buttons."; return; } try{ window.parent.postMessage(msg,SAME); }catch(e){} }
window.addEventListener("message",e=>{ if(!SAME||e.origin!==SAME||e.source!==window.parent||!e.data||e.data.kind!=="archive-opened") return; const s=OPEN_SAID.get(e.data.rel); if(s) s.textContent=e.data.ok?"Opened.":("Couldn't open: "+(e.data.error||"see the panel")); });
function openTarget(name){
  const t=byName[name]; if(!t) return;
  OPEN_SAID.clear(); drawer.replaceChildren();
  const close=el("button","btn close","Close"); close.addEventListener("click",closeDrawer); drawer.append(close);
  drawer.append(el("div","eyebrow",[t.type||"target",t.constellation,...t.codes].filter(Boolean).join(" · ")));
  drawer.append(nameEl(t.name,"","h3"));
  const progs=scopeOrder(t.programmes); const scopeNames=progs.map(p=>short(p.camera)); const unkAll=progs.every(p=>hoursUnknown(p.hours,p.lights));

  const chips=el("div"); chips.style.cssText="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px"; for(const p of progs) chips.append(pill(stKey(p),{cam:p.camera})); if(t.mosaic) chips.append(el("span","chip","mosaic")); if(t.ra==null) chips.append(el("span","chip",(t.type&&/comet|asteroid|moving/i.test(t.type))?"moving target, not on the sky map":"no sky position in the importer's target list, so not on the sky map")); drawer.append(chips);
  /* the project level: one lane per scope, the marks, the nights */

  /* the folders and files */
  const ph=el("h2",null,"By scope: the folder and what is in it"); ph.style.margin="24px 0 4px"; drawer.append(ph);
  for(const p of progs){ const box=el("div","prog"); box.style.setProperty("--sc",col(p.camera)); const h=el("div","p-h"); h.append(camDot(p.camera),el("span",null,p.camera)); if(p.mosaic) h.append(el("span","chip","mosaic")); h.append(pill(stKey(p))); if(p.collected) h.append(el("span","chip","Collect Lights: collected")); box.append(h);
    const st=el("div","p-stats"); const stat=(lbl,val)=>{ if(val==null||val==="") return; const s2=el("span"); s2.append(lbl+" "); s2.append(el("b",null,String(val))); st.append(s2); };
    stat("light frames",fmtI(p.lights)); stat("hours",hoursUnknown(p.hours,p.lights)?"unknown":fmtH(p.hours)); stat("nights",fmtI(p.nights)); if(p.firstNight) stat("span",fmtDY(p.firstNight)+" to "+fmtDY(p.lastNight)); if(p.autostacks) stat("auto-stacks",p.autostacks); if(p.panels&&p.panels.length) stat("mosaic panels",p.panels.length); box.append(st);

    const fl=Object.entries(p.filters).sort((a,b)=>b[1]-a[1]).map(([k,v])=>filtLabel(k)+" ×"+fmtI(v)).join(", "); const ex=Object.entries(p.exposures).sort((a,b)=>(+b[0])-(+a[0])).filter(([k])=>+k>0).map(([k,v])=>(+k)+" s ×"+fmtI(v)).join(", ");
    if(fl||ex){ const f2=el("div","p-stats"); if(fl){ const s3=el("span"); s3.append("filters "); s3.append(el("b",null,fl)); f2.append(s3); } if(ex){ const s4=el("span"); s4.append("exposures "); s4.append(el("b",null,ex)); f2.append(s4); } box.append(f2); }

}
function niceTicks(max,n){ if(!(max>0)||!(n>0)) return []; const step=Math.pow(10,Math.floor(Math.log10(max/n))); const cands=[step,2*step,2.5*step,5*step,10*step]; const s=cands.find(c=>max/c<=n)||10*step; const out=[]; for(let v=s;v<=max;v+=s) out.push(+v.toFixed(2)); return out; }

/* ================= PIPELINE: a board from 900 up, a list under it ================= */
RENDER.pipeline=function(root){
  root.append(el("div","sub prose","Every dataset (one target on one scope), placed by the facts the importer has: the nights in the records, the masters the archive's inventory found in the target's folder, and the finished pictures in Final Astro Images. Click one for the project."));
  const tb=el("div","toolbar"); tb.style.marginTop="12px"; const cams=chipFilter(SC.map(s=>({id:s.camera,cam:s.camera,label:s.short})),()=>paint()); tb.append(cams.box);

/* ================= DATA CHECKS: how the numbers add up ================= */
RENDER.health=function(root){
  const nc=D.notCounted; const rowsAll=(D.ledgerMeta&&D.ledgerMeta.rows)||0; const lights=D.totals.lights||0;

  const sum=el("div","sum"); const line=(k,v,cls)=>{ sum.append(el("div","k "+(cls||""),k),el("div","v "+(cls?cls.replace("sub-k","sub-v"):""),v)); };
  const nlf=nc.notLightFrames||0, un=(nc.unknownNames||{}).frames||0, drop=un+(nc.noScope||0)+(nc.noNight||0)+(nc.unreadable||0), dup=nc.duplicates||0;
  const total=rowsAll+nlf;
  if(total){ line("lines in the importer's record",fmtI(total)); if(nlf) line("not light frames (darks, flats, stacks, previews)","− "+fmtI(nlf),"sub-k"); if(un) line("names the importer doesn't recognise","− "+fmtI(un),"sub-k"); if(nc.noScope) line("no scope named","− "+fmtI(nc.noScope),"sub-k"); if(nc.noNight) line("no night","− "+fmtI(nc.noNight),"sub-k"); if(nc.unreadable) line("could not be read","− "+fmtI(nc.unreadable),"sub-k"); if(dup) line("imported on both computers, counted once","− "+fmtI(dup),"sub-k"); line("light frames counted on this page",fmtI(lights),"tot");
    const gap=total-nlf-drop-dup-lights; if(gap) line("unexplained by the record",fmtI(gap),"sub-k"); }
  else line("light frames counted on this page",fmtI(lights),"tot");
  rec.append(sum); root.append(rec);
  if(D.reconciliation&&D.reconciliation.length){ const rc=el("div","card"); rc.style.marginTop="24px"; const rh=el("div","cardhead"); const rd=el("div"); rd.append(el("h2",null,"The importer's own checks"),el("div","sub","read against counted, as the engine worked it out")); rh.append(rd); rc.append(rh); const w=el("div","tablewrap"); const t2=el("table","dt"); const thead=el("thead"); const hr=el("tr"); ["Check","Read","Counted","Note",""].forEach((h,i)=>hr.append(el("th",(i===1||i===2)?"r":null,h))); thead.append(hr); t2.append(thead); const tb=el("tbody");
    for(const r of D.reconciliation){ const tr=el("tr"); tr.append(el("td",null,r.check)); tr.append(el("td","r",typeof r.expected==="number"?fmtI(r.expected):String(r.expected))); tr.append(el("td","r",typeof r.computed==="number"?fmtI(r.computed):String(r.computed))); tr.append(el("td",null,r.note||"")); const td=el("td"); const m=el("span","okmark"+(r.ok?"":" diff")); m.append(glyph(r.ok?"check":"warn"),document.createTextNode(r.ok?"adds up":"look")); td.append(m); tr.append(td); tb.append(tr); }
    t2.append(tb); w.append(t2); rc.append(w); root.append(rc); }

  const notices=(D.notices||[]).filter(n=>n&&n.text);
  for(const n of notices){ const it=el("div","hitem warn"); it.append(glyph("warn")); const bx=el("div"); bx.append(el("h4",null,({unknown_names:"Names the importer doesn't recognise",no_scope:"Frames that name no scope",no_night:"Frames with no night",unreadable:"Lines that could not be read",inventory_missing:"The archive wasn't checked",finals_unchecked:"Finished pictures weren't checked",finals_note:"About the finished pictures",capture_state_bad:"capture-state.json names a dataset that doesn't exist",contract:"The importer's list of targets and scopes"})[n.kind]||"Something to know")); bx.append(el("p",null,n.text)); it.append(bx); hl.append(it); }
  for(const h of D.health){ if(!h) continue; if(h.severity==="warn"&&notices.some(n=>n.text===h.detail)) continue; const it=el("div","hitem"+(h.severity==="warn"?" warn":"")); it.append(glyph(h.severity==="warn"?"warn":"info")); const bx=el("div"); bx.append(el("h4",null,h.severity==="warn"&&h.title==="Warning from the project layer"?"Something to know":h.title),el("p",null,h.detail)); it.append(bx); hl.append(it); }
  root.append(hl);
  const inp=D.inputs||{}; const lg=el("div","card"); lg.style.marginTop="24px"; lg.append(el("h2",null,"Where this record came from")); const ul=el("div","sum"); ul.style.marginTop="12px";
  const li=(k,v)=>{ ul.append(el("div","k",k),el("div","v",v)); };
  li("built",D.generatedAt||"?"); if(D.generatedAtLocal) li("local time",String(D.generatedAtLocal).replace("T"," ").slice(0,16)+(D.timezone?" "+D.timezone:"")); li("on",inp.machine||"?"); li("this computer's record",inp.ledger?(inp.ledgerCorrupt?"can't be read":"read"):"none here"); if(inp.snapshot) li("the "+(inp.snapshot.machine||"other computer")+"'s copy",fmtDY(String(inp.snapshot.at||"").slice(0,10))+(typeof inp.snapshot.ageHours==="number"?" · "+Math.floor(inp.snapshot.ageHours/24)+" days old":"")+(inp.snapshot.rows?" · "+fmtI(inp.snapshot.rows)+" lines":"")); li("the archive's inventory",inp.inventoryAt?fmtDY(String(inp.inventoryAt).slice(0,10)):"not checked"); li("finished pictures",inp.finals?"checked":"not checked"); li("quiet period",(D.quietPeriodDays||14)+" observing nights"); li("as of night",fmtNight(ASOF()));
