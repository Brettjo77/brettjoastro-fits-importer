<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Astro Archive Observatory, served by the BrettjoAstro FITS Importer panel (1.7.2).
     Design: the Astro Archive Observatory artifact (Aug 2026), rebuilt to the merged
     specification of 17 Oct 2026 (docs/ux-observatory-16oct/SPEC.md). Data: the dataset
     slot is filled by the engine (observatory_html) from projects.json, the ledgers and
     the contract. Fonts are the system's: the panel loads nothing from the web. -->
<title>Astro Archive Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================================
   TOKENS. Type (R/type), colour (R/colour), motion (R/motion). Dark is the base;
   light is selected by the OS or the toggle. COLOUR MEANS SCOPE: a scope's colour
   comes only from D.scopes[].colour, set per element as --sc. Status is a glyph
   and a word; teal says alive, ink says do this, an outline says nothing to do.
   ========================================================================== */
:root{
  color-scheme: dark light;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px; --fs-hero:48px;
  --lh-display:1.1; --lh-heading:1.25; --lh-body:1.4; --lh-small:1.45;
  --fw-regular:400; --fw-semi:600; --fw-bold:700;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --card-pad:16px; --item-pad:12px; --section-gap:24px; --item-gap:8px;
  --container:1280px; --container-wide:1440px; --gutter:24px; --measure:72ch;
  --r-sm:6px; --r-md:10px; --r-pill:999px; --accent-bar:4px; --ctl-sm:24px; --ctl-md:32px; --tap:44px; --dot:10px; --ring-min:56px;

  /* surfaces: dark */
  --page:#0d1120; --card:#181d36; --card2:#1f2544; --line:#303860; --grid:#262d4c;
  --wash:rgba(241,239,232,.06); --wash2:rgba(241,239,232,.11); --track:#2c3456; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-hover:0 6px 18px rgba(0,0,0,.45);
  --ink:#f3f1ea; --ink2:#c6cadc; --muted:#9aa0bd; --faint:#5f6584; --on-scope:#15141f;
  /* the night sky: identical in both themes */
  --sky1:#070b1e; --sky2:#131a40; --sky3:#1b2660; --sky-ink:#f4f2ec; --sky-ink2:#c9cde6; --sky-muted:#a4aacb; --sky-line:rgba(255,255,255,.14); --sky-wash:rgba(255,255,255,.08);
  /* status: one accent (teal) + ink */
  --st-live-ink:#5cc9de; --st-live-tint:#21344b; --st-live-line:#2f6a7a;
  --st-work-bg:#2aa5bd; --st-work-ink:#0e1222;
  --st-action-bg:#f1efe8; --st-action-ink:#0e1222;
  --st-quiet-ink:#9aa0bd; --st-quiet-line:#3a4168;
  /* attention: warm wash + ink + glyph */
  --attn-wash:#36301d; --attn-line:#5a4c2a; --attn-ink:#f1efe8; --attn-glyph:#f1efe8;
  --quiet-band:rgba(241,239,232,.055); --today-line:#f3f1ea; --mark-ring:var(--card);
  --moon-glow:rgba(241,239,232,.09); --sel-col:rgba(143,211,230,.14); --moon-lit:#efe7cc; --moon-dark:#2f3761;
  --heat1:#20355f; --heat2:#2b4f8f; --heat3:#3a6fc0; --heat4:#5f93dc; --heat5:#a3c3ee;
  --focus:#8fd3e6; --tip-bg:#f1efe8; --tip-ink:#0e1222; --tip-ink2:#4e4c60;
  --led:#5cc9de; --led-stale:#c9c5d8; --led-off:#e05a5a;
  /* motion */
  --dur-micro:120ms; --dur-short:200ms; --dur-base:320ms; --dur-long:480ms; --dur-reveal:600ms; --dur-pop:360ms; --dur-fade:200ms; --dur-stars:900ms;
  --sweep:420ms; --stagger:70ms;
  --ease-out:cubic-bezier(.2,.7,.2,1); --ease-in:cubic-bezier(.4,0,1,1); --ease-move:cubic-bezier(.65,0,.35,1); --ease-spring:cubic-bezier(.34,1.35,.5,1);
  --lift:-1px; --loop:1; --rscale:1;
}
@media (min-width:1200px){ :root{ --card-pad:20px; } }
@media (max-width:700px){ :root{ --gutter:16px; --fs-hero:34px; --fs-2xl:24px; --fs-xl:18px; --ctl-md:var(--tap); } }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --page:#eeeae0; --card:#fffefb; --card2:#f6f3eb; --line:#d9d3c5; --grid:#e8e3d7;
    --wash:rgba(26,25,38,.05); --wash2:rgba(26,25,38,.09); --track:#e2ddd1; --shadow:0 1px 2px rgba(26,25,38,.06); --shadow-hover:0 6px 18px rgba(26,25,38,.10);
    --ink:#15141f; --ink2:#403e52; --muted:#625f74; --faint:#a39fae;
    --moon-glow:rgba(26,25,38,.075); --sel-col:rgba(15,127,149,.12); --moon-lit:#e2bd3c; --moon-dark:#d9d3c5;
    --st-live-ink:#086b80; --st-live-tint:#dcf2f6; --st-live-line:#9ed3df;
    --st-work-bg:#0f7f95; --st-work-ink:#fffdf9;
    --st-action-bg:#1a1926; --st-action-ink:#fffdf9;
    --st-quiet-ink:#625f74; --st-quiet-line:#c4bfb2;
    --attn-wash:#fbf1dc; --attn-line:#ecd9b0; --attn-ink:#1a1926; --attn-glyph:#7a4a12;
    --quiet-band:rgba(26,25,38,.045); --today-line:#15141f;
    --heat1:#d7e4f6; --heat2:#a9c5ea; --heat3:#6f9ad8; --heat4:#3f6fbe; --heat5:#1f4687;
    --focus:#0f7f95; --tip-bg:#1a1926; --tip-ink:#f1efe8; --tip-ink2:#c1c5d9;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#eeeae0; --card:#fffefb; --card2:#f6f3eb; --line:#d9d3c5; --grid:#e8e3d7;
  --wash:rgba(26,25,38,.05); --wash2:rgba(26,25,38,.09); --track:#e2ddd1; --shadow:0 1px 2px rgba(26,25,38,.06); --shadow-hover:0 6px 18px rgba(26,25,38,.10);
  --ink:#15141f; --ink2:#403e52; --muted:#625f74; --faint:#a39fae;
  --moon-glow:rgba(26,25,38,.075); --sel-col:rgba(15,127,149,.12); --moon-lit:#e2bd3c; --moon-dark:#d9d3c5;
  --st-live-ink:#086b80; --st-live-tint:#dcf2f6; --st-live-line:#9ed3df;
  --st-work-bg:#0f7f95; --st-work-ink:#fffdf9;
  --st-action-bg:#1a1926; --st-action-ink:#fffdf9;
  --st-quiet-ink:#625f74; --st-quiet-line:#c4bfb2;
  --attn-wash:#fbf1dc; --attn-line:#ecd9b0; --attn-ink:#1a1926; --attn-glyph:#7a4a12;
  --quiet-band:rgba(26,25,38,.045); --today-line:#15141f;
  --heat1:#d7e4f6; --heat2:#a9c5ea; --heat3:#6f9ad8; --heat4:#3f6fbe; --heat5:#1f4687;
  --focus:#0f7f95; --tip-bg:#1a1926; --tip-ink:#f1efe8; --tip-ink2:#c1c5d9;
}
/* reduced motion: movement to 0, fades stay short, nothing loops */
@media (prefers-reduced-motion: reduce){
  :root:not([data-motion="full"]){ --dur-micro:0ms; --dur-short:0ms; --dur-base:0ms; --dur-long:0ms; --dur-reveal:0ms; --dur-pop:0ms; --sweep:0ms; --stagger:0ms; --lift:0px; --loop:0; --dur-fade:120ms; --rscale:0; --dur-stars:120ms; }
}
:root[data-motion="reduce"]{ --dur-micro:0ms; --dur-short:0ms; --dur-base:0ms; --dur-long:0ms; --dur-reveal:0ms; --dur-pop:0ms; --sweep:0ms; --stagger:0ms; --lift:0px; --loop:0; --dur-fade:120ms; --rscale:0; --dur-stars:120ms; }

/* ============================================================================ base */
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{overflow-x:hidden;scroll-padding-top:64px}
body{background:var(--page);color:var(--ink);font:var(--fw-regular) var(--fs-base)/var(--lh-body) var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--container);margin:0 auto;padding:0 var(--gutter)}
.wrap.wide{max-width:var(--container-wide)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{cursor:default;opacity:.6}
svg{display:block;max-width:100%}
b{font-weight:var(--fw-semi)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
svg [tabindex]:focus-visible{outline:none}
svg g.dot:focus-visible circle.c, svg g.dot.cur circle.c{stroke:var(--ink);stroke-width:2.5;transform:scale(1.25)}
svg g.lane:focus-visible rect.lanehit{stroke:var(--focus);stroke-width:2}
.mono{font-family:var(--mono);font-size:var(--fs-xs)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tab{font-variant-numeric:tabular-nums}
.unit{font-weight:var(--fw-regular);color:var(--ink2)}
.nowrap{white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prose{max-width:var(--measure)}
.eyebrow,.colhead{font:var(--fw-semi) var(--fs-xs)/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font:var(--fw-bold) var(--fs-2xl)/var(--lh-display) var(--sans);letter-spacing:-.01em}
h2{font:var(--fw-bold) var(--fs-xl)/var(--lh-heading) var(--sans);letter-spacing:-.01em}
h3{font:var(--fw-semi) var(--fs-lg)/var(--lh-heading) var(--sans)}
.sub{font-size:var(--fs-md);line-height:var(--lh-body);color:var(--muted);margin-top:var(--s1)}
.meta{font-size:var(--fs-sm);line-height:var(--lh-small);color:var(--ink2)}
.meta b{color:var(--ink)}
.muted{color:var(--muted)}
.ink2{color:var(--ink2)}
.codes{font-weight:var(--fw-regular);color:var(--muted);white-space:nowrap}
.hid{display:none !important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================================ header: the night sky (short: ≤110 px + a 44 px bar) */
header.sky{background:linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 60%,var(--sky3) 100%);color:var(--sky-ink);position:relative;overflow:hidden}
header.sky .stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;animation:fadein var(--dur-stars) var(--ease-out) calc(200ms*var(--rscale)) both}
header.sky .wrap{position:relative;padding-top:10px;padding-bottom:10px}
.mast{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 var(--s6);align-items:start}
.mast>div{animation:rise var(--dur-reveal) var(--ease-out) both}
.mast>div:nth-child(2){animation-delay:calc(120ms*var(--rscale))}
.titlerow{display:flex;align-items:baseline;gap:14px;min-width:0;height:20px}
h1.wordmark{font:var(--fw-bold) var(--fs-lg)/20px var(--sans);letter-spacing:-.01em;white-space:nowrap}
.mast .eyebrow{color:var(--sky-muted);font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.06em;text-transform:none;font-weight:var(--fw-regular);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fresh{display:flex;gap:0 8px;align-items:center;flex-wrap:wrap;font-size:var(--fs-sm);line-height:20px;color:var(--sky-ink2);min-height:20px;margin-top:4px}
.fresh b{color:var(--sky-ink);font-weight:var(--fw-semi)}
.fresh .built{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.live{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sky-line);border-radius:var(--r-pill);height:22px;padding:0 9px 0 7px;background:rgba(255,255,255,.06);font-size:var(--fs-xs);line-height:1;color:var(--sky-ink2);white-space:nowrap;transition:background var(--dur-short),border-color var(--dur-short)}
.live .led{width:7px;height:7px;border-radius:50%;background:var(--led);flex:none}
.live[data-state="stale"] .led{background:var(--led)}
.live[data-state="file"] .led{background:var(--led-stale)}
.live[data-state="offline"] .led{background:var(--led-off)}
.live[data-state="rebuilding"]{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35)}
.live[data-state="rebuilding"] .led{background:var(--sky-ink);animation:pulse 1.2s ease-in-out infinite}
.live[data-state="updated"]{background:rgba(92,201,222,.18);border-color:rgba(92,201,222,.5);color:var(--sky-ink)}
:root[data-motion="reduce"] .live[data-state="rebuilding"] .led{animation:none;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
@media (prefers-reduced-motion: reduce){ :root:not([data-motion="full"]) .live[data-state="rebuilding"] .led{animation:none;box-shadow:0 0 0 3px rgba(255,255,255,.35)} }
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
/* the camera chip: amber, only when a camera still holds files the record doesn't know */
.camchip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 7px;border-radius:var(--r-pill);border:1px solid rgba(246,213,139,.55);background:rgba(246,213,139,.13);color:#f6d58b;font:var(--fw-semi) var(--fs-xs)/1 var(--sans);white-space:nowrap;transition:background var(--dur-micro)}
.camchip:hover{background:rgba(246,213,139,.24)}
.camchip svg{width:13px;height:13px}
.hero{display:flex;align-items:baseline;flex-wrap:nowrap;gap:0 7px;justify-content:flex-end;text-align:right;height:20px;margin-top:0}
.hero .n{font:var(--fw-bold) var(--fs-2xl)/20px var(--sans);letter-spacing:-.02em;font-variant-numeric:proportional-nums;color:var(--sky-ink)}
.hero .u{font-size:var(--fs-md);font-weight:var(--fw-semi);color:var(--sky-ink2);white-space:nowrap}
.comps{display:flex;gap:0 6px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px;font-size:var(--fs-sm);line-height:20px;color:var(--sky-ink2)}
.comps span{white-space:nowrap}
.comps b{color:var(--sky-ink);font-variant-numeric:tabular-nums}
.share{margin-top:8px;animation:rise var(--dur-reveal) var(--ease-out) both;animation-delay:calc(200ms*var(--rscale))}
.sharebar{width:100%;height:10px}
.sharebar svg{width:100%;height:10px;overflow:visible}
.sharebar rect.seg{transform-box:fill-box;transform-origin:left center;animation:growx var(--dur-reveal) var(--ease-out) both;animation-delay:calc((260ms + var(--i,0)*60ms)*var(--rscale));transition:filter var(--dur-micro);cursor:pointer}
.sharebar rect.seg:hover{filter:brightness(1.18)}
.sharekey{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 14px;margin-top:5px;font-size:var(--fs-sm);line-height:16px;color:var(--sky-ink2)}
.sharekey .k{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:0 4px;margin:0 -4px;border-radius:4px;color:var(--sky-ink2);transition:background var(--dur-micro)}
.sharekey .k:hover{background:var(--sky-wash);color:var(--sky-ink)}
.sharekey .k .dot{--mark-ring:var(--sky2);width:9px;height:9px}
.sharekey .k .nm{font-weight:var(--fw-semi);color:var(--sky-ink)}
.sharekey .k .v{font-variant-numeric:tabular-nums}
.sharekey .k .v b{color:var(--sky-ink)}
/* the Key: the folded legend under the bar */
.keyfold{background:var(--sky2);border-top:1px solid var(--sky-line);animation:fadein var(--dur-short) var(--ease-out) both}
.keyfold[hidden]{display:none}
.legend{display:flex;gap:var(--s2) var(--s4);flex-wrap:wrap;align-items:center;padding:10px 0;font-size:var(--fs-sm);color:var(--sky-ink2)}
.legend .k{font:var(--fw-semi) var(--fs-xs)/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--sky-muted);margin-right:-4px}
.legend .m{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:24px}
.legend .m .dot{--mark-ring:var(--sky2)}
.legend .m i.band{display:inline-block;width:22px;height:12px;border-radius:3px;background:rgba(255,255,255,.12);border:1px solid var(--sky-line)}
.legend .m i.speck{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--sky-ink2);margin:0 4px}
.legend .m i.glow{display:inline-block;width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.16);border:1px solid var(--sky-line)}
.legend .m i.hatch{display:inline-block;width:22px;height:12px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--sky-ink2) 0 1.5px,transparent 1.5px 4px),rgba(255,255,255,.1)}
.legend .sep{width:1px;height:16px;background:var(--sky-line)}
.legend .st{--st-live-tint:rgba(92,201,222,.16);--st-live-ink:#8fd9e8;--st-live-line:rgba(92,201,222,.5);--st-work-bg:#2aa5bd;--st-work-ink:#0e1222;--st-action-bg:#f1efe8;--st-action-ink:#0e1222;--st-quiet-ink:#c9cde6;--st-quiet-line:rgba(255,255,255,.35)}
@media (max-width:1100px){ .sharekey{justify-content:flex-start;gap:0 18px} }
@media (max-width:900px){ .mast{grid-template-columns:minmax(0,1fr)} .hero,.comps{justify-content:flex-start;text-align:left} .hero{margin-top:6px} }
@media (max-width:700px){
  header.sky .wrap{padding-top:8px;padding-bottom:8px}
  .titlerow{height:auto} .mast .eyebrow{display:none}
  .hero .n{font-size:var(--fs-2xl)} .comps{gap:0 5px;font-size:var(--fs-xs)}
  .fresh{font-size:var(--fs-xs)} .fresh .built .snapfrom{display:none}
  .sharekey{gap:0 12px;font-size:var(--fs-xs)} .sharekey .k .v{display:none}
  .legend button.m{min-height:var(--tap)}
}

/* ============================================================================ sticky bar: 44 px */
.navbar{position:sticky;top:0;z-index:30;background:var(--sky2);color:var(--sky-ink);border-bottom:1px solid var(--sky-line);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.navin{display:flex;align-items:stretch;gap:var(--s1);min-height:44px}
.back{display:inline-flex;align-items:center;gap:6px;min-width:var(--tap);min-height:var(--tap);align-self:center;padding:0 10px 0 2px;font-size:var(--fs-md);color:var(--sky-ink2);text-decoration:none;white-space:nowrap;border-right:1px solid var(--sky-line);margin-right:var(--s1);border-radius:var(--r-sm) 0 0 var(--r-sm)}
.back:hover{color:var(--sky-ink)}
nav.tabs{display:flex;flex-wrap:wrap;gap:0 2px;flex:1;min-width:0;position:relative}
nav.tabs button{padding:0 10px;min-height:44px;font-size:var(--fs-base);font-weight:var(--fw-regular);color:var(--sky-ink2);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-sm) var(--r-sm) 0 0;transition:color var(--dur-micro),background var(--dur-micro)}
nav.tabs button:hover{color:var(--sky-ink);background:var(--sky-wash)}
nav.tabs button[aria-selected="true"]{color:var(--sky-ink);font-weight:var(--fw-semi)}
nav.tabs .ink{position:absolute;bottom:0;height:3px;background:var(--sky-ink);border-radius:2px;transition:left var(--dur-base) var(--ease-move),width var(--dur-base) var(--ease-move)}
nav.tabs .n{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--sky-ink);color:var(--sky1);font-size:var(--fs-xs);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;transition:transform var(--dur-short) var(--ease-spring)}
nav.tabs .n.tick{transform:scale(1.25)}
.viewsel{display:none;align-items:center;gap:10px;flex:1;font-size:var(--fs-base);font-weight:var(--fw-semi);color:var(--sky-ink)}
.viewsel .selwrap{position:relative;flex:1}
.viewsel select{appearance:none;-webkit-appearance:none;width:100%;min-height:var(--tap);font:inherit;font-weight:var(--fw-semi);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:0 36px 0 12px}
.viewsel .selwrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.navright{display:flex;align-items:center;gap:var(--s2);padding-left:var(--s2)}
.theme{display:inline-flex;align-items:center;justify-content:center;width:var(--ctl-md);height:var(--ctl-md);border-radius:var(--r-sm);color:var(--sky-ink2);border:1px solid var(--sky-line);transition:background var(--dur-micro),color var(--dur-micro)}
.theme:hover{color:var(--sky-ink);background:var(--sky-wash)}
.theme svg{width:16px;height:16px}
.btn.sky{background:transparent;border-color:var(--sky-line);color:var(--sky-ink2)}

/* motion between layers: a brief slide that says where you came from; instant under reduced motion (the tokens go to 0) */

<script id="dataset" type="application/json">__DATASET__</script>
<script>
"use strict";
/* ============================================================================
   Core: the dataset, its normalisation, the vocabulary, formatting with ONE
   rounding function, the anchored tooltip, the toast, tabs, header, freshness
   and the 30 s poll that redraws the page in place when the record changes.
   ========================================================================== */
const $ = id => document.getElementById(id);
let D = JSON.parse(document.getElementById("dataset").textContent);
const DEFAULTS = {targets:[],sessions:[],scopes:[],events:[],health:[],reconciliation:[],warnings:[],shelves:{},calibration:{},askarRigs:{},junk:{files:0,bytes:0},totals:{},inputs:{},
  notices:[],unknownNames:[],scopeOrder:[],notCounted:{},pendingImport:null,
  /* phase 1 (25 Oct, honest numbers): absent in an older record, so every reader degrades quietly */
  stateCounts:null,stateHours:null,rules:{},finalsUnmatched:[],finalsAmbiguous:[],statesKeptFrom:null,
  /* phase 2 (29 Oct, scope first; PHASE2-CONTRACT.md): the cards' units, the status line's facts, this month, the newest night */
  units:[],thisMonth:null,recordsUpTo:null,status:null,space:null};
function normalise(d){
  /* a dataset from another engine version may lack a key: fill the gaps once, so no tab goes blank */
  if(!d||typeof d!=="object") d={};
  for(const [k,v] of Object.entries(DEFAULTS)) if(d[k]==null) d[k]=(v===null?null:Array.isArray(v)?[]:(typeof v==="object"?{...v}:v));
  for(const k of ["unknownNames","noScope","noNight","unreadable","duplicates","notLightFrames"]) if(d.notCounted[k]==null) d.notCounted[k]=(k==="unknownNames"?{names:0,frames:0}:0);
  if(typeof d.notCounted.unknownNames!=="object"||d.notCounted.unknownNames===null) d.notCounted.unknownNames={names:0,frames:0};
  if(typeof d.pendingImport!=="object") d.pendingImport=null;
  for(const s of d.sessions){ if(!s) continue; s.hours=+s.hours||0; s.frames=+s.frames||0; s.filters=s.filters||{}; s.exps=s.exps||{}; s.night=String(s.night||""); s.target=String(s.target||""); s.camera=String(s.camera||"");
    if(!s.morning) s.morning=nightAdd(s.night,1); s.gains=Array.isArray(s.gains)?s.gains:[]; s.importedOn=Array.isArray(s.importedOn)?s.importedOn:[]; s.archived=(s.archived==null||isNaN(+s.archived))?null:+s.archived; s.framesWithoutExposure=+s.framesWithoutExposure||0; s.dayKeys=Array.isArray(s.dayKeys)?s.dayKeys:[]; s.archiveDays=Array.isArray(s.archiveDays)?s.archiveDays:[]; }
  d.sessions=d.sessions.filter(s=>s&&s.night);
  for(const t of d.targets){ t.programmes=t.programmes||[]; t.statusCards=t.statusCards||[]; t.codes=Array.isArray(t.codes)?t.codes:[]; t.cameras=t.cameras||[]; t.hours=+t.hours||0; t.lights=+t.lights||0; t.nights=+t.nights||0; t.name=String(t.name||"?"); t.id=String(t.id||t.name);
    for(const p of t.programmes){ p.hours=+p.hours||0; p.lights=+p.lights||0; p.nights=+p.nights||0; p.sessions=Array.isArray(p.sessions)?p.sessions:[]; p.mastersNamed=Array.isArray(p.mastersNamed)?p.mastersNamed:[]; p.finalsNamed=Array.isArray(p.finalsNamed)?p.finalsNamed:[]; p.captureState=p.captureState||"auto"; p.captureStateSource=p.captureStateSource||"rule"; p.sample=!!p.sample; p.framesWithoutExposure=+p.framesWithoutExposure||0; p.filters=p.filters||{}; p.exposures=p.exposures||{}; if(!p.status) p.status=STATUS_OF_STATE[(t.statusCards.find(c=>c.camera===p.camera)||{}).state]||"capturing";
      /* phase 1: the engine's state word (may be "sample"), when it became ready, its reason in words, the final's date and the frames after it */
      p.state=typeof p.state==="string"?p.state:""; p.readySince=(typeof p.readySince==="string"&&p.readySince)?p.readySince.slice(0,10):null; p.reason=typeof p.reason==="string"?p.reason.trim():"";
      p.finalDate=(typeof p.finalDate==="string"&&p.finalDate)?p.finalDate.slice(0,10):null; p.newFramesSinceFinal=(p.newFramesSinceFinal===true)?1:(+p.newFramesSinceFinal||0); p.stateKeptFrom=(typeof p.stateKeptFrom==="string"&&p.stateKeptFrom)?p.stateKeptFrom.slice(0,10):null;
      /* phase 2: the first unfinished step in words, and whether darks or flats are missing (absent in an older record) */
      p.nextAction=typeof p.nextAction==="string"?p.nextAction.trim():""; p.calMissing=p.calMissing===true; } }
  d.finalsUnmatched=d.finalsUnmatched.filter(x=>x&&typeof x==="object"); d.finalsAmbiguous=d.finalsAmbiguous.filter(x=>x&&typeof x==="object");
  if(typeof d.rules!=="object"||d.rules===null) d.rules={}; if(typeof d.stateCounts!=="object") d.stateCounts=null; if(typeof d.stateHours!=="object") d.stateHours=null;
  /* phase 2: units (the cards), the status line's facts, this month, the newest night; each absent in a 1.8.0 record */
  d.units=Array.isArray(d.units)?d.units.filter(u=>u&&typeof u==="object"&&(u.id||u.label||u.name)):[];
  for(const u of d.units){ u.id=String(u.id||u.label||u.name); u.label=String(u.label||u.short||u.id); u.scopes=Array.isArray(u.scopes)?u.scopes.map(String):[]; u.scopeIds=Array.isArray(u.scopeIds)?u.scopeIds.map(String):[]; u.current=Array.isArray(u.current)?u.current.filter(x=>x&&typeof x==="object"):[]; u.strip=Array.isArray(u.strip)?u.strip.filter(x=>x&&x.night):[]; u.moreReady=+u.moreReady||0; u.moreReadyHours=+u.moreReadyHours||0; u.active=u.active!==false; u.latestDone=(u.latestDone&&typeof u.latestDone==="object")?u.latestDone:null; u.onScope=typeof u.onScope==="string"?u.onScope:null; u.lastOut=typeof u.lastOut==="string"?u.lastOut.slice(0,10):null; }
  d.status=(d.status&&typeof d.status==="object")?d.status:null;
  d.thisMonth=(d.thisMonth&&typeof d.thisMonth==="object")?d.thisMonth:null;
  d.recordsUpTo=(typeof d.recordsUpTo==="string"&&d.recordsUpTo)?d.recordsUpTo.slice(0,10):null;
  d.space=(d.space&&typeof d.space==="object")?d.space:null;
  if(d.pendingImport&&typeof d.pendingImport.scope!=="string") d.pendingImport.scope=null;
  return d;
}
const STATUS_OF_STATE={captured:"capturing",stacked:"ready_to_process",processing:"in_progress",complete:"done"};
const STATE_OF_STATUS={capturing:"captured",ready_to_process:"stacked",in_progress:"processing",done:"complete"};
const dayMs=864e5;
function nightAdd(iso,n){ const t=Date.parse(iso+"T12:00:00Z"); if(isNaN(t)) return iso; return new Date(t+n*dayMs).toISOString().slice(0,10); }
const nightIdx=(iso,start)=>Math.round((Date.parse(iso+"T12:00:00Z")-Date.parse(start+"T12:00:00Z"))/dayMs);
D=normalise(D);

/* ---------- the vocabulary: a status is a glyph and a word; colour means scope ---------- */
const ST={
  capturing:        {word:"Still capturing",  verb:"Keep capturing", icon:"cap",    cls:"st-live",   state:"captured"},
  ready_to_process: {word:"Ready to process", verb:"Process it",     icon:"play",   cls:"st-action", state:"stacked"},
  in_progress:      {word:"Finish it",        verb:"Finish it",      icon:"half",   cls:"st-work",   state:"processing"},
  done:             {word:"Done",             verb:"Done",           icon:"check",  cls:"st-done",   state:"complete"},
  sample:           {word:"Sample",           verb:"Set aside",      icon:"sample", cls:"st-sample", state:"sample"},
};
const PIPE_ORDER=["capturing","ready_to_process","in_progress","done","sample"];
const stOf=k=>ST[k]||ST.capturing;
/* the stored state word (statusCards.state) → the status key */
const stageOf=state=>stOf(STATUS_OF_STATE[state]||state);
/* a sample is the engine's state (under the sample cut-off, phase 1) or Brett's quick-look flag; the flag never
   overrides a master or a final. Any other engine state word the page knows wins over the older status */
const stKey=p=>{ if(!p) return "capturing"; if(p.state==="sample") return "sample"; if(p.sample&&!(p.masters>0||p.processedFinals>0||(p.mastersNamed||[]).length||(p.finalsNamed||[]).length)) return "sample"; return (p.state&&ST[p.state])?p.state:p.status; };
const cardKey=c=>(c.sample&&c.state!=="processing"&&c.state!=="complete")?"sample":(STATUS_OF_STATE[c.state]||"capturing");

/* ---------- scopes: colour and order from the engine only ---------- */
let SC=[], BY={}, TG=[], byName={}, SESS=[], nightly=new Map(), CARDS=[], PROGS=[], MAXSES=1, totalHours=0;
const shortName=cam=>String(cam).replace(/^(Seestar|Askar)\s+/,"").replace(/^Starfront S50 Pro$/,"Starfront");
function derive(){
  const order=D.scopeOrder||[];
  SC=D.scopes.filter(s=>s&&s.camera).map(s=>({...s,short:shortName(s.camera),hours:+s.hours||0,frames:+s.frames||0,nights:+s.nights||0,
    kind:s.kind||(/seestar|starfront/i.test(s.camera)?"seestar":"askar")}))
    .sort((a,b)=>((a.order??(order.indexOf(a.id)+1||99))-(b.order??(order.indexOf(b.id)+1||99)))||String(a.camera).localeCompare(String(b.camera)));
  /* a camera that only the sessions name (no scopes row) still gets a place, never a silent drop */
  for(const s of D.sessions) if(!SC.some(c=>c.camera===s.camera)) SC.push({camera:s.camera,id:s.camera,short:shortName(s.camera),colour:null,hours:0,frames:0,nights:0,kind:/seestar|starfront/i.test(s.camera)?"seestar":"askar",order:99});
  BY=Object.fromEntries(SC.map(s=>[s.camera,s]));
  TG=D.targets.slice(); byName={};
  for(const t of TG){ if(byName[t.name]){ continue; } byName[t.name]=t; }
  SESS=D.sessions;
  for(const t of TG) t.camHours={};
  nightly=new Map();
  for(const s of SESS){
    const t=byName[s.target]; if(t) t.camHours[s.camera]=(t.camHours[s.camera]||0)+s.hours;
    let n=nightly.get(s.night); if(!n){ n={frames:0,hours:0,perCam:{},targets:new Set()}; nightly.set(s.night,n); }
    n.frames+=s.frames; n.hours+=s.hours; n.perCam[s.camera]=n.perCam[s.camera]||{frames:0,hours:0}; n.perCam[s.camera].frames+=s.frames; n.perCam[s.camera].hours+=s.hours; n.targets.add(s.target);
  }
  CARDS=[]; PROGS=[];
  for(const t of TG){ for(const c of t.statusCards) CARDS.push(c); for(const p of t.programmes) PROGS.push({...p,target:t.name,tid:t.id,t}); }
  MAXSES=Math.max(1,...SESS.map(s=>s.hours||0));
  /* one rounding rule: a scope's hours are the sum of its sessions' displayed hours (when the record has
     sessions for it), and the hero is the sum of the six scope figures, so the strip, the key and the hero agree */
  const rr=h=>Math.round((+h||0)*10)/10, ssum=list=>list.reduce((a,x)=>{ x=+x||0; return a+((x>0&&x<1)?x:rr(x)); },0);   /* = r1 / sumH (MIN_H), which are defined below */
  for(const s of SC){ const ss=SESS.filter(z=>z.camera===s.camera); if(ss.length) s.hours=rr(ssum(ss.map(z=>z.hours))); }
  totalHours=SESS.length?rr(SC.reduce((a,s)=>a+s.hours,0)):(+D.totals.hours||0);
}
derive();
const col=cam=>(BY[cam]&&BY[cam].colour)||"var(--muted)";
const short=cam=>(BY[cam]&&BY[cam].short)||String(cam);
const rank=cam=>{ const i=SC.findIndex(s=>s.camera===cam); return i<0?99:i; };
const scopeOrder=list=>list.slice().sort((a,b)=>rank(a.camera)-rank(b.camera));
const isSeestar=cam=>(BY[cam]&&BY[cam].kind)==="seestar";
const CAMSHORT=new Proxy({}, {get:(_,k)=>short(k)});

/* ---------- formatting: ONE rounding function; unknown is never 0; totals are sums of displayed parts ---------- */
const r1=h=>Math.round((+h||0)*10)/10;
const fmtI=n=>(n==null||isNaN(+n))?"?":(+n).toLocaleString("en-GB");
/* one rule for durations (§9.1): under an hour is minutes ("45 min"), from an hour one decimal ("3.2 h"); fmtHp gives the number and its unit apart */
const MIN_H=1;
function fmtHp(h){ h=+h||0; if(h>0&&h<MIN_H) return {n:String(Math.max(1,Math.round(h*60))),u:"min"}; return {n:r1(h).toLocaleString("en-GB",{minimumFractionDigits:1,maximumFractionDigits:1}),u:"h"}; }
function fmtH(h){ const p=fmtHp(h); return p.n+" "+p.u; }
const fmtHn=h=>fmtHp(h).n;
/* a total is the sum of its displayed parts: tenths, except a part under an hour is shown in minutes, so it keeps its minutes */
const sumH=list=>list.reduce((a,x)=>{ x=+x||0; return a+((x>0&&x<MIN_H)?x:r1(x)); },0);
const hoursUnknown=(hours,frames)=>!(hours>0)&&frames>0;
const hoursTxt=(hours,frames)=>hoursUnknown(hours,frames)?"hours unknown":fmtH(hours);
const fmtGB=b=>{ b=+b||0; const g=b/2**30; return g>=1024?(g/1024).toLocaleString("en-GB",{maximumFractionDigits:2})+" TB":g>=1?g.toLocaleString("en-GB",{maximumFractionDigits:g>=100?0:1})+" GB":(b/2**20).toLocaleString("en-GB",{maximumFractionDigits:0})+" MB"; };
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDY(iso){ if(!iso) return "?"; const [y,m,d]=String(iso).split("-"); if(!m||!d) return String(iso); return (+d)+" "+(MONTHS[+m-1]||m)+" "+y; }
const fmtD=fmtDY;
function fmtDS(iso){ if(!iso) return "?"; const [y,m,d]=String(iso).split("-"); if(!m||!d) return String(iso); return (+d)+" "+(MONTHS[+m-1]||m); }
const dowOf=iso=>{ const t=Date.parse(iso+"T12:00:00Z"); return isNaN(t)?"":DOW[new Date(t).getUTCDay()]; };
/* one format for dates (§9.1): "Fri 16 Oct", with the year only when it isn't this year */
function fmtDate(iso){ if(!iso) return "?"; const [y,m,d]=String(iso).slice(0,10).split("-"); if(!m||!d) return String(iso); const dw=dowOf(y+"-"+m+"-"+d); return (dw?dw+" ":"")+(+d)+" "+(MONTHS[+m-1]||m)+(+y!==new Date().getFullYear()?" "+y:""); }
/* a night is noon to noon: the key is the evening, `morning` the day after */
function fmtNight(night,morning,year){ morning=morning||nightAdd(night,1); const [y1,m1,d1]=night.split("-"),[y2,m2,d2]=morning.split("-");
  if(!m1||!m2) return fmtDY(night); const a=dowOf(night)+" "+(+d1), b=dowOf(morning)+" "+(+d2)+" "+(MONTHS[+m2-1]||m2)+(year?" "+y2:"");
  return a+(m1!==m2?" "+(MONTHS[+m1-1]||m1):"")+" → "+b; }
const fmtMonth=ym=>{ const [y,m]=String(ym).split("-"); return (MONTHS[+m-1]||m)+" "+y; };
const nts=n=>fmtI(n)+" night"+(n===1?"":"s");
const plural=(n,w,ws)=>fmtI(n)+" "+(n===1?w:(ws||w+"s"));
const ASOF=()=>D.asOfNight||(SESS.map(s=>s.night).sort().pop())||new Date().toISOString().slice(0,10);
const ago=iso=>nightIdx(ASOF(),iso);
const agoTxt=iso=>{ const n=ago(iso); return n===0?"last night":n===1?"1 night ago":n+" nights ago"; };

/* ============================================================================
   Phase 1, honest numbers (25 Oct 2026, Observatory_UX_Plan §6): one order for every list, samples set
   aside, the rules from the record, the finished-picture checks. PURE: no DOM, so test_app renders
   these in node (chain NL, "HN" checks) beside the panel's projectsHtml. Keep this region self-contained:
   it may use D, PROGS, TG, SESS, the ST vocabulary and the formatting helpers above, nothing else.
   ========================================================================== */
/* the rules live in config (§6.5): the record carries them; an older record falls back to the defaults */
function RULES(){ const r=(D.rules&&typeof D.rules==="object")?D.rules:{}; const n=(v,dflt)=>(Number.isFinite(+v)&&+v>0)?+v:dflt;
  return {quietDays:n(r.quietDays,n(D.quietPeriodDays,14)),sampleMinutes:n(r.sampleMinutes,30),activeWindowNights:n(r.activeWindowNights,30)}; }
/* ONE order for every list of datasets (§6.3), the engine's `dataset_sort_key` mirrored exactly: the most recent
   capture (lastNight) first; among items captured the same night the newest readySince first (the day the quiet
   period ended, or the night Brett closed it; none sorts after); then the most hours; then the name, A to Z.
   Works on programmes (target, lastNight, hours) and on targets (name, lastNight, hours) alike */
function orderDatasets(list){
  const s=x=>String(x||""); const nm=x=>s(x.target||x.name).toLowerCase();
  return list.slice().sort((a,b)=>s(b.lastNight).localeCompare(s(a.lastNight))||s(b.readySince).localeCompare(s(a.readySince))||((+b.hours||0)-(+a.hours||0))||nm(a).localeCompare(nm(b)));
}
const ORDER_WORDS={ready_to_process:"most recent capture first, then newest ready",in_progress:"most recent capture first",capturing:"most recent capture first",done:"most recent capture first",sample:"most recent capture first"};

function calibrationMark(p){

  chips("Scope",SC.map(s=>({id:s.camera,cam:s.camera,label:s.short})),FILTER.scopes,id=>{ const s=FILTER.scopes.includes(id)?FILTER.scopes.filter(x=>x!==id):FILTER.scopes.concat([id]); setFilter({...FILTER,scopes:s}); paintFilter(); });
  chips("State",PIPE_ORDER.map(k=>({id:k,st:k,label:stOf(k).word})),FILTER.states,id=>{ const s=FILTER.states.includes(id)?FILTER.states.filter(x=>x!==id):FILTER.states.concat([id]); setFilter({...FILTER,states:s}); paintFilter(); });
  chips("Last captured",[[30,"30 nights"],[90,"90 nights"],[365,"a year"]].map(([n,l])=>({id:n,label:l})),[FILTER.since],id=>{ setFilter({...FILTER,since:FILTER.since===id?0:id}); paintFilter(); });
  const act=el("div","pact"); act.append(el("span",null,filterOn()?"Filtering the cards and the rows":"Showing everything")); const c=el("button","btn","Clear"); c.disabled=!filterOn(); c.addEventListener("click",clearFilter); act.append(c); p.append(act);
}
setFilter(FILTER);
/* Find (§7.5): type a name or a code, pick a project; it opens anchored to the scope with the most recent capture */
(function(){ const inp=$("find"), list=$("findList"); let sel=-1;
  function paint(){ const q=inp.value.trim(); list.replaceChildren(); sel=-1; if(!q){ list.classList.add("hid"); inp.setAttribute("aria-expanded","false"); return; } const hits=findMatches(q,8); list.classList.remove("hid"); inp.setAttribute("aria-expanded","true");
    if(!hits.length){ const n=el("div","none"); n.append(el("span",null,"Nothing found for “"+q+"”. Try a catalogue code (M 31) or part of the name.")); const c=el("button","btn","Clear"); c.addEventListener("click",()=>{ inp.value=""; paint(); inp.focus(); }); n.append(c); list.append(n); return; }
    hits.forEach((h,i)=>{ const b=el("button","fi"); b.type="button"; b.setAttribute("role","option"); b.setAttribute("aria-selected","false"); b.dataset.i=i; b.append(nameEl(h.name,"t","span")); b.append(el("span","h",fmtH(h.hours)+" · "+nts(h.nights))); const m=el("div","m"); for(const c of h.cams){ const s=el("span","scn"); s.append(camDot(c),document.createTextNode(short(c))); m.append(s); } b.append(m); b.addEventListener("click",()=>{ openProjectLayer(h.tid,h.anchor,{from:"find"}); inp.value=""; list.classList.add("hid"); }); list.append(b); }); }
  inp.addEventListener("input",paint); inp.addEventListener("focus",()=>{ if(inp.value.trim()) paint(); });
  inp.addEventListener("keydown",e=>{ const bs=[...list.querySelectorAll(".fi")]; if(e.key==="ArrowDown"||e.key==="ArrowUp"){ if(!bs.length) return; e.preventDefault(); sel=(sel+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length; bs.forEach((b,i)=>b.setAttribute("aria-selected",i===sel?"true":"false")); } else if(e.key==="Enter"){ const b=bs[sel>=0?sel:0]; if(b){ e.preventDefault(); b.click(); } } else if(e.key==="Escape"){ inp.value=""; paint(); } });
})();
/* every SVG is drawn at its real pixel width: redraw what is visible when the width changes */
const FITTERS=new Set();
function fitAll(still){ for(const f of [...FITTERS]){ try{ f(!!still); }catch(e){} } }
let rsT; addEventListener("resize",()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ fitAll(true); renderShare(false); placeInk(); },120); });
</script>
<script>
"use strict";
/* ============================================================================
   Overview: last night · needs your attention · what each scope captured (the
   six-scope strip) · what to do next · projects that moved lately, with the
   project panel, the night panel and the scope panel (SPEC §1, §1b, §3).
   ========================================================================== */
const QUIET=()=>RULES().quietDays;

/* ---------- keyed strips: one SVG, one or many lanes, a dot per night (or per week past 120 nights),
   dots keyed so a range change MOVES them; drawn at the real pixel width ---------- */
const PAD=10;
const xOf=(k,N,plot)=>PAD+(N-1-k)/(N-1)*plot;
/* the biggest dot: by the range, the lane height, and (when nights sit close) the room each night has */
const rMax=(N,laneH,plot)=>Math.min(laneH/2-2,N<=30?12:N<=90?9:7,plot?Math.max(4.5,plot/Math.max(1,N)*0.7):99);
const rOf=(h,N,laneH,ref,plot)=>h>0?3+(rMax(N,laneH,plot)-3)*Math.sqrt(Math.min(1,h/(ref||MAXSES))):Math.min(4.5,rMax(N,laneH,plot));
/* at 30 nights a dot is always a night (the key says so; dots may touch on a phone); beyond that a dot is a
   night while nights are 16 px apart (9 px on a narrow strip), then a week, a fortnight, a month, two months */
const binFor=(N,plot)=>{ if(N<=30) return 1; const px=plot/Math.max(1,N), min=plot<480?9:16; for(const k of [1,7,14,30,61,91,182]) if(px*k>=min) return k; return 182; };
const binWord=b=>b===1?"night":b===7?"week":b===14?"fortnight":b===30?"month":b===61?"two months":b===91?"three months":"six months";
const weekKey=iso=>{ const t=Date.parse(iso+"T12:00:00Z"); const d=new Date(t); const dow=(d.getUTCDay()+6)%7; return new Date(t-dow*dayMs).toISOString().slice(0,10); };
/* the marks of one lane for a range: by night, or by a bin of nights when the range is wide */
function marksOf(sessions,N,bin){
  const by=new Map(); bin=bin||1;
  for(const z of sessions){ const k=ago(z.night); if(k<0||k>=N) continue; const idx=Math.floor(k/bin); const key=bin===1?z.night:"B"+bin+":"+idx;
    let a=by.get(key); if(!a){ a={key,bin,week:bin>1?nightAdd(ASOF(),-((idx+1)*bin-1)):null,nights:new Set(),hours:0,frames:0,sessions:[],kSum:0}; by.set(key,a); }
    a.nights.add(z.night); a.hours+=z.hours; a.frames+=z.frames; a.sessions.push(z); }
  for(const a of by.values()){ const ks=[...a.nights].map(ago); a.k=ks.reduce((x,y)=>x+y,0)/ks.length; a.night=[...a.nights].sort().pop(); a.unk=!(a.hours>0)&&a.frames>0; }
  return by;
}
function dotTip(cam,a){ return box=>{
  if(a.week){ box.append(el("div","tt-t",(a.bin===7?"Week of ":binWord(a.bin)[0].toUpperCase()+binWord(a.bin).slice(1)+" from ")+fmtDS(a.week)+" · "+nts(a.nights.size))); for(const n of [...a.nights].sort()){ const ss=a.sessions.filter(z=>z.night===n); const h=ss.reduce((x,z)=>x+z.hours,0), f=ss.reduce((x,z)=>x+z.frames,0); ttRow(box,fmtNight(n,ss[0].morning),hoursUnknown(h,f)?fmtI(f)+" frames, hours unknown":fmtH(h),col(cam)); } }
  else { box.append(el("div","tt-t","Night of "+fmtNight(a.night,a.sessions[0].morning))); for(const z of a.sessions) ttRow(box,commonName(z.target),hoursUnknown(z.hours,z.frames)?fmtI(z.frames)+" frames, hours unknown":fmtH(z.hours),col(cam)); if(a.sessions.length>1) ttRow(box,"together",a.unk?fmtI(a.frames)+" frames":fmtH(sumH(a.sessions.map(z=>z.hours)))); }
  ttRow(box,"scope",short(cam));
  const what=a.week?"its latest night":"the night";
  box.append(el("div","hint",matchMedia("(hover: none)").matches?"tap again for "+(a.week?"its latest night":"the night's detail"):"Enter or click opens "+what));
}; }
function makeDot(st,ln,a,N,plot){
  const x=xOf(a.k,N,plot), cy=ln.cy; const r=rOf(a.unk?0:a.hours,N,st.laneH,st.ref,st.bin===1?plot:0);
  const g=svgEl("g",{class:"dot"+(a.unk?" unk":""),"data-key":a.key}); g.style.transform="translate("+x.toFixed(1)+"px,"+cy+"px)";
  const pop=svgEl("g",{class:"pop"}); pop.style.setProperty("--k",((N-1-a.k)/(N-1)).toFixed(3));
  const c=svgEl("circle",{class:"c",r:r.toFixed(1),fill:a.unk?"var(--card)":col(ln.cam),stroke:a.unk?col(ln.cam):"var(--mark-ring)","stroke-width":a.unk?2:1.5});
  pop.append(c);
  if(a.week&&a.nights.size>1&&r>=6.5){ const t=svgEl("text",{class:"cnt",x:0,y:3.4,"text-anchor":"middle"}); t.textContent=a.nights.size; pop.append(t); }
  g.append(svgEl("circle",{class:"hit",r:12}),pop);
  hoverable(g,dotTip(ln.cam,a));
  g.addEventListener("click",e=>{ e.stopPropagation(); if(st.onDot) st.onDot(ln,a); });
  return {g,c,...a};
}
function buildStrip(o){
  /* o: {lanes:[{key,cam,label,sessions,target}], laneH, labelW, emptyDots, stageOf(ln), onDot(ln,a), onLane(ln), still} */
  const laneH=o.laneH||36, labW=o.labelW||0, right=o.stageOf?34:0, H=laneH*o.lanes.length;
  const svg=svgEl("svg",{viewBox:"0 0 600 "+H,class:"strip",role:"group"}); svg.style.height=H+"px";
  const band=svgEl("rect",{class:"band",x:PAD,y:2,width:580,height:H-4,rx:4}); svg.append(band);
  const today=o.today?svgEl("line",{class:"todayline",y1:1,y2:H-1}):null; if(today) svg.append(today);
  const inset=o.inset==null?22:o.inset;
  const st={svg,band,today,lanes:[],laneH,labW,right,W:600,N:30,onDot:o.onDot,emptyDots:!!o.emptyDots,stageOf:o.stageOf,H,inset,lblCls:o.lblCls||""};
  o.lanes.forEach((ln,i)=>{ const cy=i*laneH+laneH/2;
    const g=svgEl("g",{class:"lane",tabindex:"0",role:"group"}); g.setAttribute("aria-label",(ln.label||short(ln.cam))+(ln.target?" · "+ln.target:"")+": one dot per night out. Use the arrow keys to walk the nights.");
    const hit=svgEl("rect",{class:"lanehit",x:0,y:i*laneH,width:600,height:laneH,rx:4}); g.append(hit);
    const base=svgEl("line",{class:"gridline",x1:PAD+labW,y1:cy,x2:600-PAD-right,y2:cy}); g.append(base);
    const bg=svgEl("g",{class:"bg"}); g.append(bg);
    const earlier=svgEl("text",{class:"axis",x:PAD+labW+2,y:cy+4,"font-weight":"600"}); g.append(earlier);
    let lbl=null; if(labW){ lbl=svgEl("text",{class:"lane-lbl"+(st.lblCls?" "+st.lblCls:""),x:labW+PAD-6,y:cy+4,"text-anchor":"end"}); lbl.textContent=ln.label||short(ln.cam); if(o.onLane){ lbl.style.cursor="pointer"; lbl.addEventListener("click",()=>o.onLane(ln)); } g.append(lbl); if(String(lbl.textContent).length>12){ const ti=svgEl("title"); ti.textContent=lbl.textContent; lbl.append(ti); } }
    const L={...ln,g,hit,base,bg,earlier,lbl,cy,dots:new Map(),cur:-1,stageG:null};
    hoverable(earlier,box=>box.append(el("div",null,(L.nEarlier||0)+" earlier night"+(L.nEarlier===1?"":"s")+", before this range")));
    g.addEventListener("keydown",e=>{
      const list=[...L.dots.values()].filter(d=>!d.g.classList.contains("out")).sort((a,b)=>a.night<b.night?-1:1); if(!list.length) return;
      if(["ArrowRight","ArrowLeft","Home","End"].includes(e.key)){ e.preventDefault(); L.cur=e.key==="Home"?0:e.key==="End"?list.length-1:L.cur<0?(e.key==="ArrowRight"?0:list.length-1):(L.cur+(e.key==="ArrowRight"?1:-1)+list.length)%list.length; for(const d of list) d.g.classList.remove("cur"); const d=list[L.cur]; d.g.classList.add("cur"); ttOpen(d.g); }
      else if(e.key==="Enter"){ e.preventDefault(); if(L.cur>=0&&st.onDot) st.onDot(L,list[L.cur]); else if(o.onLane) o.onLane(L); }
    });
    g.addEventListener("blur",()=>{ for(const d of L.dots.values()) d.g.classList.remove("cur"); L.cur=-1; ttHide(); });
    if(o.onLane){ hit.style.cursor="pointer"; hit.addEventListener("click",()=>o.onLane(L)); }
    svg.append(g); st.lanes.push(L);
  });
  return st;
}
function fitStrip(st){ const w=Math.floor(st.svg.clientWidth||0); if(!w) return false; const W=Math.max(200,w); if(W===st.W) return false; st.W=W; st.svg.setAttribute("viewBox","0 0 "+W+" "+st.H); for(const L of st.lanes){ L.hit.setAttribute("width",W); L.base.setAttribute("x2",W-PAD-st.right); } return true; }
function updateStrip(st,N,first){
  st.N=N; const x0=PAD+st.labW+st.inset, plot=st.W-2*PAD-st.labW-st.right-st.inset;
  const bin=binFor(N,plot); st.bin=bin; const marks=st.lanes.map(L=>marksOf(L.sessions,N,bin)); const rM=rMax(N,st.laneH,bin===1?plot:0);
  st.ref=bin===1?MAXSES:Math.max(0.1,...marks.flatMap(m=>[...m.values()].map(a=>a.unk?0:a.hours)));
  const qn=Math.min(QUIET(),N); const bw=Math.max(0,(qn-1)/(N-1)*plot+rM);
  if(first){ st.band.classList.add("still"); nextFrame(()=>st.band.classList.remove("still")); }
  st.band.setAttribute("x",x0); st.band.setAttribute("width",plot); st.band.style.transform="translateX("+(plot-bw).toFixed(1)+"px) scaleX("+(bw/plot).toFixed(4)+")";
  if(st.today){ st.today.setAttribute("x1",(x0+plot).toFixed(1)); st.today.setAttribute("x2",(x0+plot).toFixed(1)); }
  st.lanes.forEach((L,li)=>{
    const by=marks[li]; const keep=new Set();
    L.nEarlier=new Set(L.sessions.filter(z=>ago(z.night)>=N).map(z=>z.night)).size; L.earlier.textContent=L.nEarlier?"‹"+L.nEarlier:"";
    /* empty nights at 30, only while a dot is a night: crossfade */
    const nb=svgEl("g",{class:"bg"}); if(N<=30&&bin===1&&st.emptyDots){ for(let k=0;k<N;k++){ const n=nightAdd(ASOF(),-k); if([...by.values()].some(a=>a.nights.has(n))) continue; nb.append(svgEl("circle",{cx:(x0+(N-1-k)/(N-1)*plot).toFixed(1),cy:L.cy,r:2.2,fill:"var(--track)"})); } }
    const oldBg=L.bg; if(!first){ nb.classList.add("out"); oldBg.classList.add("out"); setTimeout(()=>oldBg.remove(),ms("--dur-fade")+20); } else oldBg.remove();
    L.g.insertBefore(nb,L.earlier); L.bg=nb; if(!first) nextFrame(()=>nb.classList.remove("out"));
    for(const a of by.values()){ keep.add(a.key); let d=L.dots.get(a.key);
      const x=x0+(N-1-a.k)/(N-1)*plot;
      if(d){ d.g.style.transform="translate("+x.toFixed(1)+"px,"+L.cy+"px)"; d.c.setAttribute("r",rOf(a.unk?0:a.hours,N,st.laneH,st.ref,bin===1?plot:0).toFixed(1)); d.g.classList.remove("out"); if(a.hours!==d.hours||a.frames!==d.frames){ Object.assign(d,a); hoverable(d.g,dotTip(L.cam,a)); } }
      else { d=makeDot(st,L,a,N,plot); d.g.style.transform="translate("+x.toFixed(1)+"px,"+L.cy+"px)"; if(!first){ d.g.classList.add("in"); nextFrame(()=>d.g.classList.remove("in")); } L.dots.set(a.key,d); L.g.append(d.g); } }
    for(const [key,d] of L.dots){ if(keep.has(key)) continue; d.g.classList.add("out"); setTimeout(()=>{ if(d.g.classList.contains("out")){ d.g.remove(); L.dots.delete(key); } },ms("--dur-base")+30); }
    if(st.stageOf){ if(L.stageG) L.stageG.remove(); const sk=st.stageOf(L); if(sk){ L.stageG=stageMark(L.g,stOf(sk.key).icon,st.W-PAD-14,L.cy,box=>{ box.append(el("div","tt-t",stOf(sk.key).word)); if(sk.note) box.append(el("div",null,sk.note)); }); } }
  });
  if(st.binNote) st.binNote.textContent=bin===1?"":"at this range a dot is a "+binWord(bin)+", the number its nights";
}
function axisText(N){ const a=nightAdd(ASOF(),-(N-1)), m=nightAdd(ASOF(),-Math.floor((N-1)/2)); return N>400?[fmtDY(a),fmtDY(m),fmtDS(ASOF())+" · last night"]:[fmtDS(a),fmtDS(m),fmtDS(ASOF())+" · last night"]; }
function axisRow(box,N,first){ const put=()=>box.replaceChildren(...axisText(N).map(t=>el("span",null,t))); if(first||ms("--dur-fade")===0){ put(); return; } box.classList.add("out"); setTimeout(()=>{ put(); box.classList.remove("out"); },ms("--dur-fade")); }
function segRange(ranges,cur,onPick,label){
  const seg=el("div","seg"); seg.setAttribute("role","radiogroup"); seg.setAttribute("aria-label",label||"Range");
  for(const [id,lab,N] of ranges){ const b=el("button",null,lab); b.setAttribute("role","radio"); b.dataset.id=id; b.setAttribute("aria-checked",id===cur?"true":"false"); b.addEventListener("click",()=>{ for(const x of seg.children) x.setAttribute("aria-checked",x===b?"true":"false"); onPick(N,id); }); seg.append(b); }
  seg.addEventListener("keydown",e=>{ const bs=[...seg.children]; let i=bs.findIndex(b=>b.getAttribute("aria-checked")==="true"); if(e.key==="ArrowRight"||e.key==="ArrowDown") i=(i+1)%bs.length; else if(e.key==="ArrowLeft"||e.key==="ArrowUp") i=(i-1+bs.length)%bs.length; else return; e.preventDefault(); bs[i].click(); bs[i].focus(); });
  return seg;
}

/* ---------- panels: a full-width panel under a row, height eases, contents fade 60 ms later ---------- */
const OPEN={};   /* slot -> panel */
function expandPanel(slot,anchor,panel,opts){
  opts=opts||{}; closePanel(slot);
  panel.dataset.slot=slot; anchor.insertAdjacentElement("afterend",panel); OPEN[slot]=panel;
  if(panel.fit) panel.fit(); fitAll(true);
  const h=panel.scrollHeight; panel.style.height="0px"; void panel.offsetHeight; panel.style.height=h+"px"; panel.classList.add("open");
  const dur=ms("--dur-long");
  const pr=panel.getBoundingClientRect(); const need=pr.top+h-(innerHeight-24);
  if(need>0){ const ar=(opts.scrollRef||anchor).getBoundingClientRect(); scrollBy({top:Math.min(need,Math.max(0,ar.top-80)),behavior:reduced()?"auto":"smooth"}); }
  setTimeout(()=>{ panel.classList.add("auto"); panel.style.height=""; },dur+20);
  if(opts.focus!==false) setTimeout(()=>{ const c=panel.querySelector(".panelin"); if(c){ c.tabIndex=-1; c.focus({preventScroll:true}); } },dur);
}
function closePanel(slot){ const p=OPEN[slot]; if(!p) return; delete OPEN[slot]; if(p.onClose) p.onClose(); const dur=ms("--dur-long"); p.classList.remove("auto","open"); p.style.height=p.scrollHeight+"px"; void p.offsetHeight; p.style.height="0px"; setTimeout(()=>p.remove(),dur+30); }
function collapseAll(){ for(const k of Object.keys(OPEN)) closePanel(k); }
function panelShell(kind,colour){ const panel=el("div","panel "+kind); const pin=el("div","panelin"); if(colour) pin.style.setProperty("--pc",colour); panel.append(pin); panel.pin=pin; return panel; }
function panelHead(pin,title,sub,tools,onClose){ const ph=el("div","ph"); const l=el("div"); if(typeof title==="string") l.append(el("h3",null,title)); else l.append(title); if(sub) l.append(el("div","sub",sub)); ph.append(l); const t=el("div","tools"); for(const x of tools||[]) t.append(x); const cl=el("button","btn","Close"); cl.addEventListener("click",onClose); t.append(cl); ph.append(t); pin.append(ph); return ph; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ ttHide(); if(Object.keys(OPEN).length){ const slots=Object.keys(OPEN); const last=OPEN[slots[slots.length-1]]; const ret=last.returnTo; closePanel(slots[slots.length-1]); if(ret&&ret.isConnected) ret.focus(); } } });

/* ---------- the night panel (micro level): one night on one scope ---------- */
const SIDE={mac:"the Mac",pc:"the PC"};
function nightPanelFor(cam,night,target){
  const ss=SESS.filter(z=>z.camera===cam&&z.night===night&&(!target||z.target===target)).sort((a,b)=>b.hours-a.hours);
  const panel=panelShell("night",col(cam)); const pin=panel.pin;
  const h=el("h3"); h.append("Night of "+fmtNight(night,ss[0]&&ss[0].morning,true)+" · "); h.append(scopeName(cam));
  const tot=sumH(ss.map(z=>z.hours)), fr=ss.reduce((a,z)=>a+z.frames,0);
  panelHead(pin,h,(ss.length>1?plural(ss.length,"object")+" · ":"")+(hoursUnknown(tot,fr)?"hours unknown":fmtH(tot))+" · "+plural(fr,"frame")+" · "+(isSeestar(cam)?"calibrates in the camera":"calibration as filed that night"),[],()=>{ const r=panel.returnTo; closePanel("night"); if(r&&r.isConnected) r.focus(); });
  if(!ss.length){ pin.append(el("p","sub","No frames recorded on this scope that night.")); return panel; }
  for(const z of ss){
    const blk=el("div"); if(ss.length>1||true){ const hh=el("h4"); hh.style.cssText="font:600 14px/1.3 var(--sans);margin:12px 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"; const nb=el("button","disc"); nb.append(nameEl(z.target,"","span"),glyph("right")); nb.style.height="auto"; nb.style.padding="2px 6px 2px 0"; nb.title="Open the project"; nb.addEventListener("click",()=>openProject(z.target,cam)); hh.append(nb); blk.append(hh); }
    const grid=el("div","night");
    const b1=el("div","blk"); b1.append(el("h4",null,"Frames"));
    const line=(box,k,v,soft)=>{ const l=el("div","l"+(soft?" soft":"")); l.append(el("span",null,k),el("b",null,v)); box.append(l); };
    line(b1,"light frames",fmtI(z.frames));
    line(b1,"hours",hoursUnknown(z.hours,z.frames)?"unknown":fmtH(z.hours)+(z.integrationFromNote?" (from your note)":""));
    if(z.framesWithoutExposure) line(b1,"frames with no exposure in the header",fmtI(z.framesWithoutExposure));
    const subs=subsTxt(z.exps); if(subs) line(b1,"exposure",subs); else if(!Object.keys(z.exps||{}).length) line(b1,"exposure","not in the headers",true);
    const fl=filtersTxt(z.filters); line(b1,"filter",fl||"not recorded",!fl);
    if(z.gains&&z.gains.length) line(b1,"gain",z.gains.join(", ")); else line(b1,"gain","not in the record",true);
    grid.append(b1);
    const b2=el("div","blk"); b2.append(el("h4",null,"Calibration"));
    if(isSeestar(cam)||!z.calDetail&&z.cal===null){ line(b2,"darks and flats","calibrates in the camera",true); }

/* ---------- what each scope captured: Brett's chart (SPEC-2 §3). Tiles, a moon row, one stacked column per night for
   all scopes, then one row of bars per scope in the fixed order, a selected-night panel beside it, and under it
   "What each scope shot" (§4): one bar per scope split into its objects. Replaces the dot strip. ---------- */
const CHART={card:null,N:30,sel:null,range:"30",redraw:null,fit:null};
const RANGES=[["30","30 nights",30],["90","90 nights",90],["365","a year",365],["all","everything",0]];
/* the moon from the date alone: synodic month 29.530588853 d from the new moon of 2000-01-06 18:14 UTC;
   the fraction lit at local midnight of the night = (1 − cos(2π·age/29.5306)) / 2 */
const SYNODIC=29.530588853, NEWMOON=Date.UTC(2000,0,6,18,14);
function moonAt(night){ const [y,m,d]=night.split("-").map(Number); const mid=new Date(y,m-1,d+1,0,0); const age=(((mid-NEWMOON)/dayMs)%SYNODIC+SYNODIC)%SYNODIC; const f=(1-Math.cos(2*Math.PI*age/SYNODIC))/2; return {age,f,waxing:age<SYNODIC/2}; }
function moonName(mn){ const a=mn.age, q=SYNODIC/4; const near=(x,c)=>Math.abs(x-c)<=0.92; if(near(a,0)||near(a,SYNODIC)) return "New moon"; if(near(a,q)) return "First quarter"; if(near(a,2*q)) return "Full moon"; if(near(a,3*q)) return "Last quarter"; if(a<q) return "Waxing crescent"; if(a<2*q) return "Waxing gibbous"; if(a<3*q) return "Waning gibbous"; return "Waning crescent"; }
/* a small disc: the dark side, then the lit part (lit limb on the right while waxing) */
function moonDisc(svg,cx,cy,r,mn,cls){ const g=svgEl("g",{class:"moon "+(cls||"")}); g.append(svgEl("circle",{class:"dark",cx,cy,r})); const f=mn.f; if(f>0.02){ const k=Math.cos(Math.PI*f), rx=Math.abs(k)*r; const s=mn.waxing?1:0; const lit=k>0?(mn.waxing?0:1):(mn.waxing?1:0);
    const d=f>0.98?"M"+(cx-r)+" "+cy+"a"+r+" "+r+" 0 1 0 "+(2*r)+" 0a"+r+" "+r+" 0 1 0 "+(-2*r)+" 0z":"M"+cx+" "+(cy-r)+"A"+r+" "+r+" 0 0 "+s+" "+cx+" "+(cy+r)+"A"+rx.toFixed(2)+" "+r+" 0 0 "+lit+" "+cx+" "+(cy-r)+"Z";
    g.append(svgEl("path",{class:"lit",d})); } svg.append(g); return g; }
/* bins: nights at 30; weeks at 90; calendar months beyond (quarters past 36 months). Oldest first. */
function chartBins(N){
  const asof=ASOF(); const out=[];
  if(N<=30){ for(let k=N-1;k>=0;k--){ const n=nightAdd(asof,-k); out.push({key:n,kind:"night",nights:[n],from:n,to:n}); } return out; }
  if(N<=90){ const nb=Math.ceil(N/7); for(let i=nb-1;i>=0;i--){ const nights=[]; for(let k=Math.min(N,(i+1)*7)-1;k>=i*7;k--) nights.push(nightAdd(asof,-k)); out.push({key:"W"+i,kind:"week",nights,from:nights[0],to:nights[nights.length-1]}); } return out; }
  const quarters=N>36*30.5; const by=new Map();
  for(let k=N-1;k>=0;k--){ const n=nightAdd(asof,-k); const key=quarters?n.slice(0,4)+"-Q"+(Math.floor((+n.slice(5,7)-1)/3)+1):n.slice(0,7); let b=by.get(key); if(!b){ b={key,kind:quarters?"quarter":"month",nights:[],from:n,to:n}; by.set(key,b); out.push(b); } b.nights.push(n); b.to=n; }
  return out;
}
const binWordC=k=>k==="night"?"night":k==="week"?"week":k==="month"?"month":"quarter";
function binLabel(b){ if(b.kind==="night") return fmtNight(b.from,nightAdd(b.from,1)); if(b.kind==="week") return "Week of "+fmtDS(b.from)+(b.nights.length<7?" ("+nts(b.nights.length)+")":""); if(b.kind==="month") return fmtMonth(b.from.slice(0,7)); return b.key.slice(5)+" "+b.key.slice(0,4); }
/* everything the chart and the panel need for one range */
function chartData(N){
  const bins=chartBins(N); const inRange=SESS.filter(z=>ago(z.night)>=0&&ago(z.night)<N);
  const byNight=new Map(); for(const z of inRange){ let a=byNight.get(z.night); if(!a){ a=[]; byNight.set(z.night,a); } a.push(z); }

    const card=el("div","card"); const hh=el("div","cardhead"); const hd=el("div"); hd.append(el("h2",null,"Imaging nights"),el("div","sub","one cell per calendar night, coloured by "+(metric==="hours"?"hours captured":"frames captured")+(sel.size?" on the selected scopes":" across all scopes")+" · a night is noon to noon, shown on its evening's date")); hh.append(hd); card.append(hh);

    card.append(stx); holder.append(card);

};

    const gap=total-nlf-drop-dup-lights; if(gap) line("unexplained by the record",fmtI(gap),"sub-k"); }
  else line("light frames counted on this page",fmtI(lights),"tot");
  rec.append(sum); root.append(rec);

    t2.append(tb); w.append(t2); rc.append(w); root.append(rc); }
  const hl=el("div","hlist"); hl.style.marginTop="24px";

  const inp=D.inputs||{}; const lg=el("div","card"); lg.style.marginTop="24px"; lg.append(el("h2",null,"Where this record came from")); const ul=el("div","sum"); ul.style.marginTop="12px";

/* the footer in plain words, from the record's inputs; the line count is the one the Data checks tab adds up */
function footerText(){
  const known=D.inputs&&typeof D.inputs==="object"; const inp=known?D.inputs:{}; const from=[];
  if(inp.ledger) from.push("this "+(inp.machine||"computer")+"'s record"+(inp.ledgerCorrupt?" (which couldn't be read)":""));

  const rows=((D.ledgerMeta&&+D.ledgerMeta.rows)||0)+(+D.notCounted.notLightFrames||0);
  return "Worked out"+(inp.machine?" on the "+inp.machine:"")+(D.generatedAt?" on "+D.generatedAt:"")+" from "+from.join(", ")+(rows?" · "+fmtI(rows)+" lines read, "+fmtI(D.totals.lights||0)+" light frames counted":"")+".";
}
